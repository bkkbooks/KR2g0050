body:
  text: 明儒言行録卷三安化縣知縣沈佳撰吳與弼康齋先生字子傅江西崇仁人天順初徴聘授左諭德固辭還山父溥國子司業先生生時夢有藤繞其先墓一老人指為攀轅藤故初名夢祥資稟英異永樂己丑年十九覲親於京師從洗馬楊文定溥學見伊洛淵源録慨然有志于道至程伯淳言見獵心喜曰審如是吾亦可學為聖賢遂去舉業謝人事獨處小樓玩四書五經諸儒語録收斂身心沈潛義理足不下樓者二年視世之所尚舉不足為其志直欲造乎聖賢之域其詩曰九仭始一簣千里方跬步又曰誠當通鬼神志當貫金石門人婁諒撰行狀動必以禮或誚其迂先生不少變每省親往來太學粗衣敝履人莫識為司成子也還鄉遭風舟幾覆衆皆驚怖先生獨正襟危坐舟定問其故曰吾守正以俟耳言行録溥友孔諤謂溥曰與與弼談有富貴不淫貧賤不移之象今雖見迂後當大顯先生強毅堅忍痛自浣厲恆念學之無成道之不立至於中夜奮興展轉逹旦其服膺孔子朱子之為人寤寐見之昨非今是日改月化平生一色一辭不以假人不教人舉業弟子從逰者講道而已不納贄禮或極其誠懇姑受之不動後或有過即以還之辭而不教家貧衣食不給風雨不蔽躬耕樂道非其道義一介不取非其力不食躬行實踐鄉人化之所讀書小陂種湖二處耕牧之事皆身親之或在田間或在枕席默誦精思暇則彈琴詠詩鳥鳴花發有鳶魚風雩氣象其教人由涵養以及致知先據德而後依仁啓勿忘勿助之訓悟無聲無臭之妙而窺其域者少矣儒林記弟子從學甚衆先生謂婁諒確實楊傑淳雅周文勇邁雨中披簑負耒與諸生並耕談乾坤及坎離艮震兊巽于所耕之耒耜可見歸則解犂飯糲蔬豆共食晚造詣益深嘗視種田問學者曰此為何曰種田因微笑曰非也此贊化育蓋觸處洞然矣白沙來受學先生絶無講説使白沙劚地植蔬編籬康齋作字使白沙研墨或客至則令接茶如是者數月而歸白沙文編詠桃詩云靈臺清曉玉無瑕獨立東風玩物華春氣夜來深幾許小桃又放兩三花有吾與點也氣象古穰雜録省郡交薦之不赴太息曰宦官釋氏不除而欲天下治難矣吾庸出為又曰聖人之道昭眀易見簡易易行然世鮮能之者不學故耳原其故有二焉懵然無知而不事夫學者庸人也學焉而弗克者未誠也先生剛毅疾惡慕眀道之和易凡遇逆境必加含容用力既久渾然無復圭角之露嘗語學者曰吾平生得患難進學胡九韶曰惟先生遇患難進學在他人則惰志矣皇眀書天順元年石亨謀于李賢賢為草疏薦數日上問賢與弼何如人對曰與弼儒者髙蹈古昔眀王莫不好賢下士皇上聘與弼即聖朝盛事上曰善卿草敕加束帛遣使聘處士敕曰朕承祖宗丕緒求賢圖治亦有年矣永惟勞于求賢然後成無為之治樂于忘勢乃能致難進之賢聞爾與弼潛心經史博洽古今藴經國之逺猷抱致君之宏略顧乃嘉遁丘園不求聞逹朕眷懷髙誼思訪嘉猷企望丰儀以資啓沃夫古之君子隱居以求其志行義以逹其道諒爾于行藏之宜處之當矣今特遣行人曹隆詣爾所居徴爾赴闕仍賜禮幣以表至懷其惠然就道以副朕翹望之意時年六十八矣比至上喜甚問賢曰當以何官官與弼賢曰今東宫講學需老成儒者司其輔𨗳宜莫如與弼上可諭德召對文華殿上曰聞髙義久矣特聘卿來煩輔東宫對曰臣少賤多病杜迹山林本無髙行徒以聲聞過情誤膺薦牘聖眀過聽束帛丘園臣實內愧力疾謝命不能供職上曰宫僚優間不必過辭賜文幣酒牢遣中使送至館次上顧李賢曰此老非迂濶者務令就職居數日召講中庸有御桃之賜先生再辭復請待病間一接祕閣群書以益聞見上皆不許遂稱病篤不起上命賢諭意欲祿之終身賢傳諭先生辭益堅上曰果爾亦難留乃允之先生因上十事上復召對賜璽書銀幣遣行人王惟善送歸命有司月廩之其上十事云一崇聖志二廣聖學三隆聖德四子庶民五謹命令六敦教化七清百僚八齊庶政九廣言路十君相一德同心皆本洛閩言佳按英宗聘康齋一事終始恩禮可謂帝王盛節康齋再三辭官亦有深意或者遂疑以伊傅之禮起之而僅授以宫僚故不受而歸亦淺之乎窺康齋矣通紀所載皆不足據也先生表陳十事首舉程頥謂言人便以聖為志言學便以道為志伊尹恥其君不為堯舜伏願陛下斷然以堯舜自任雍熙自期勿二勿疑次言願博訪羣臣講而眀之其餘皆切時務知者以為篤論不知者以為常談也先生歸過南京士夫有候之者多不見者有見者問先生何為不致君而還則搖首曰吾欲保性命而已即卻客而起未幾石亨等被誅凡與交通者悉罹重譴先生潔然髙蹈蓋有先幾之眀焉先生風格髙邁議論英偉胸次灑落師道尊嚴善感悟啓發人其學術質任自然務涵養性情亦通時務能用世凡天文兵法隂陽易卜無不諳悉嘗曰注箋繁無益以故不務著述云己卯九月遣門生進謝表辛巳冬適楚拜楊文定之墓壬午春適閩問考亭以申願學之志己丑十月十七日卒年七十有九鄉人稱曰聘君聘君沒百餘年小陂男女禮讓咸服其化先生上無所傳而聞道最早身體力行只在步趨語默之間出作入息刻刻不忘久之自成片假所謂敬義夾持誠眀兩進者也一切玄逺之言絶口不道學者依之真有途轍可循云始先生誦讀以道義自強常以克己安貧二事書壁銘几其讀朱子書夜無膏至傍爨光冬夜用苧帳覆腹斬然峻絶藩臬有司深加禮接一切辭避逮朝命臨門官吏師生皆來會集鄉里聚觀驚詫所居近山天使經過居止諸門生悉易以美名表之先生亦不覺震矜既退數念當時邅遇形之詩篇焉所著日録其日用間功力艱難志意堅苦逮巨細精粗畢具書之臨川吳御史衮歎以為一人之史皆自言已事非若他人以已意附成説以成説附已意泛言廣論者比云鄧元錫埋學傳清江有陳海雍號龍潭老人潛心古學遁世無悶公雅敬重之白沙嘗以周易疑義質公公曰過清江可叩龍潭老人白沙如其言往謁適龍潭雨中簔笠犂田乃延至家與之對榻信宿辨析疑義白沙歎服而去龍潭語兒輩曰吳康齋非愛我者名臣記白沙曰康齋語學多舉古人成法由濓洛關閩以上逹洙泗尊師道勇擔荷不屈不撓如立千仭之壁蓋一代之人豪也其出處大致不暇論然而世之知康齋甚少如某輩往往譏訶太甚群啄交競是非混淆聖學宗傳初先生聘至京時南陽首以賔師禮遇待之公卿大夫士屣履擁門而謗忌萌起一日于南陽所坐上坐適尹編修入側侍尹怫然不平南陽問下學上逹聘君曰今未論上逹且論下學事蓋欲令自得也直不省謂殊疏不能條析乃如此出大肆訕而中官中見聘君操古禮屹屹則群姍笑之士大夫以為言南陽曰凡為此者所以勵風俗使奔競干求乞哀之徒觀之有愧也諸君成人之美可矣鄧元錫理學傳陸儼山過楓山先生因留一日語間及康齋先生云昔見陳公甫言就學康齋時忽一日晨光初動窗外見康齋手自揚榖其子從作厲聲曰秀才恁地懶惰只此如何到伊川門下又如何到孟子門下又一日出穫手為鐮傷流血不止舉視傷處曰若血不即止而吾收之即是為爾所勝言已而穫如故又往逰武夷過逆旅索宿錢至多三文堅不與或勸之曰即此便是暴殄天物乃負擔而夜往焉先生父在京時命先生還鄉授室至親迎後不行合卺禮乃舟赴京師拜父母畢始入室祭酒胡儼父執也自京還家往謁之至門四拜而退眀日又造其宅方請見曰昨日已行拜禮今惟長揖問其故曰先生父執也若靣拜恐勞神凡行類此古穰雜録正統十一年山西按察僉事何自言上言自古有國家者必有懷抱才德不屑進取之士如漢之周黨宋之种放邵雍孫復當咸知褒崇以勵風節竊見崇仁縣儒士吳與弼守素尚義好古通經上無所傳聞道甚早待妻子如賔客視財利如鴻毛年過五十不求聞逹弟子樂從鄉人敬式真儒林之清節聖代之逸民乞敕取到京授以文學髙職如不願仕量與褒嘉亦足敦勵風操景泰中御史余謙陳述等先後列薦兩召皆不起佳按人知先生之薦出自石亨不知前此已兩經薦召矣先生居恆執古禮自度當風頺俗靡中嗤訕四至壁立萬仭凜然不少變事親至孝事繼母如母待異母弟友愛夫婦禮敬如賔接友以誠講論切磋每忘寢食久之踐行孚著鄉里式化先生有弟嗜酒不飭祖父田數畝盡為奪去既歸用其賜金墾田荒山下以為祭資弟復謀斥賣先生訟之守守張璝驁物人也致先生于庭先生免冠束腰以庶人禮見張元禎聞而作書雖止不逹先生亦尋悔之矣儒林記佳按世傳先生與嫂爭祭田自訟于公庭又瑣綴録載先生弟行不檢訴于官張東白惡之有欲上告素王之語蓋髙名易汙謗誹所致如尹直輩多見其不知量也佳嘗讀先生文集屢言能安貧夫貧者士之常能安亦是分內事以學道之人而數數言此猶未免有貧之見在至先生訟祭田一事洵或有之然未足為先生病也蓋祭田祖宗禋祀所自出為子孫者所當敬守今其嫂無故鬻之惡先生正論遂訟于官先生若眀退讓之節不質一言是棄墜先業而失祀戾孰甚焉然則如之何而可或使族人緩諭之無使爭焉則處之似為得宜何世之吠聲者不樂成人之善借此一端而遽毁之耶據名山藏所載則與弟爭田未知孰是又按吳司業墓志先生為司業長子則所稱與嫂訟未實鄒元標曰丁巳秋舉青原會少參吳公持新編康齋先生集略言于衆曰我國朝以學倡者康齋先生先生一傳新會再傳餘干俱易名從祀吾道吐氣顧其師寥落似于報稱之義未當時或以先生有爭田訟不宜見知石亨為疑不知先生于諸弟子來從學者率之力耕而食未有田也而奚訟好是懿德凡人皆有石亨知先生薦之然先生未嘗有求于世何于大儒過之深也鄒子曰公以陳胡二先生諡與從祀也于陳胡二公有加乎而吳先生之不諡不祀嘖有煩言亦有損乎曰無曰然則豫等當于不加不損處理會更不必從世法上度長挈短一從世法論俾世之學聖者于形迹上比擬而聖人之旨荒矣且豫自幼聞先生訟田也以弟鬻祭田故夫士大夫無故不鬻祭田禮也先生秉禮者也即訟非過昔文清在大理一內使薦曰南京好官惟薛卿可以是病文清乎夫人之精神映照百世者百世千萬世者千萬世故曰百世以俟聖人而不惑學如先生俟不惑可矣語略序何喬逺曰胡居仁陳獻章皆淵源吳公胡陳之學已著于世而吳公尚有遺論何哉論者謂其訟田于公及為石亨作譜跋稱門下士而已有弟不飭而吳公計及先人之祀束腰跪庭用部民禮以見有司猶屬質哉豫讀譜跋寥寥數言耳石亨當時有震主之威巽以處之亦或當爾至于辭職不就意殊可見王文成檄祀康齋鄉祠云吳公方其貴近之薦固可見好德之同及夫官爵之辭尤足驗先幾之哲蓋宣和之疏于龜山無嫌而眀堂之留在漢儒為愧出處不至于失已學術何待夫立言顧涇陽言先生一團元氣可追太古之朴劉山隂言豫于本朝極服康齋先生其弟不檢私鬻祭田先生訟之遂囚服以質絶無矯飾之意非名譽心淨曷克至此楊端潔傳易考先生自辭宫諭歸絶不言官以民服力田撫守張璝因先生拒而不見璝知京貴有忌先生者欲壞其節行令人訟之久之無應者璝以嚴法令他人代弟訟之牒入即遣吏執牒拘之門人胡居仁等勸以官服往先生服民服從拘者至庭璝加慢侮方以禮遣先生無愠色亦心諒非弟意相好如初張廷祥始亦信之後乃釋然顧涇凡曰先生樂道安貧曠然自足真如鳳凰翔于千仭之上下視塵世曽不足過而覽焉區區總戎一薦何關重輕乃遂不勝私門桃李之以世俗所事座主薦主之禮乎此以知其不然者一也且總戎之汰甚矣行路之人皆知其必敗而况于先生先生所為堅辭諭德之命意蓋將若浼焉惟恐其去之不速也况肯褰裳而赴自附于匪人之黨乎此以知其不然者二也應嗣寅曰先生當盛世遇徴聘而訟祭田一事或謂其與弟訟田或謂其與嫂訟田而楊端潔所考則謂撫守令他人代弟訟之蓋當時門人無實録而出之悠悠之口也世傳康齋待人甚峻有人作詩諷之曰贋不贋兮真不真巖巖氣象好難親不知東魯吾夫子猶是循循善誘人此詩頗有意然康齋得伯夷之隘終是有所成就康齋先生語録與鄰人處一事涵容不熟既已容訖彼猶未悟不免説破此間氣為患尋自悔之因思為君子當常受虧于人方做得蓋受虧即有容也食後坐東窗四體舒泰神氣清朗讀書愈有進益數日趣同此必又透一關矣聖賢所言無非存天理去人欲聖賢所行亦然學聖賢者舍是何以哉日夜痛自點檢且不暇豈有工夫點檢他人耶責人密自治疏矣可不戒哉貧苦中百務紛至兼以病瘡不免時有憤躁徐整衣冠讀書便覺意思通暢古人云不遇盤根錯節無以别利器又云若要熟也須從這裏過然誠難能只得小心寧耐做將去朱子云終不成處不去便放下旨哉言也文公先生謂延平先生終日無疾言遽色與弼常歎何修而至此又自分雖終身不能學也文公先生又云李先生初間也是豪邁底人後來也是琢磨之功觀此則李先生豈是生來便如此蓋學力所致也然下愚未學苦不能克去血氣之剛平居則慕心平氣和與物皆春少不如意躁急之態形焉因思延平先生所與處者豈皆聖賢而能無疾言遽色者豈非成湯與人不求備檢身若不及之功效與而今而後吾知聖賢之必可學而學之必可至人性之本善而氣質之可化也的然矣下學之功此去何如哉南軒讀書孟子甚樂湛然虗眀平旦之氣略無所撓緑隂清晝薰風徐來而山林閴寂天地自濶日月自長邵子所謂心靜方能知白日眼眀始會識青天于斯可驗與弼氣質偏于剛忿永樂庚寅年二十從洗馬楊先生學方始覺之春季歸自先生官舍紆道訪故人李原道于秦淮客館相與携手淮畔共談日新與弼深以剛忿為言始欲下克之之功原道尋以告吾父母二親為之大喜厥後克之之功雖時有之其如鹵莽滅裂何十五六年之間猖狂自恣良心一發憤恨無所容身去冬今春用功甚力而日用之間覺得愈加辛苦疑下愚終不可以希聖賢之萬一而小人之歸無由可免矣五六月來覺氣象漸好于是益加苦功逐日有進心氣稍稍和平雖時當逆境不免少動於中尋即排遣而終無大害也二十日又一逆事排遣不下心愈不悅蓋平日但制而不行未有拔去病根之意反復觀之而後知吾近日之病在于欲得心氣和平而惡夫外物之逆以害吾中此非也心本至虛七情不可有所于物之相接甘辛醃苦萬有不齊而吾惡其逆我者可乎但當于萬有不齊之中詳審其理以應之則善矣于是中心灑然此殆克己復禮之一端乎蓋制而不行者硬苦以理處之則順暢因思心氣和平非絶無于往日但未如此八九日之無間斷又往日家和平多無事之時今乃能于逆境擺脫懼學之不繼也故特書于册冀日新又新讀書窮理從事于敬恕之間漸進于克己復禮之地此吾志也效之遲速非所敢知淡如秋水貧中味和似春風靜後功病體衰憊家務相纒不得專致志于聖經賢傳中心益以鄙詐而無以致其知外貌益以暴慢而何以力于行乎嵗月如流豈勝痛悼如何一事少含容蓋一事差則當痛加克己復禮之功務使此心湛然虗眀則應事可以無失靜時涵養動時省察不可須臾忽也茍此心為事物所撓無澄清之功則心愈亂氣愈濁梏之反覆失愈逺矣觀近思録覺得精神收斂身心檢束有歉然不敢少恣之意有悚然奮拔向前之意朝公武謂康節先生隱居博學尤精于易世謂其能窮作易之本原前知來物其始學之時睡不施枕者三十年嗟乎先哲苦心如此吾輩將何如哉大凡處順不可喜喜心之生驕侈之所由起也處逆不可厭厭心之生怨尤之所由起也一喜一厭皆為動其中也其中不可動也聖賢之心如止水或順或逆處以理耳豈以自外至者為憂樂哉枕上思在京時晝夜讀書不間而精神無恙後十餘年疾病相因少能如昔精進不勝痛悼然無如之何兼貧乏無藥調護只得放寬懷抱毋使剛氣得撓愛養精神以圖少長噫世之年壯氣盛者豈少不過悠悠度日誠可惜哉枕上思近來心中間思甚少亦一進也寢起讀書栁隂及東窗皆有妙處晚二次事逆雖動于中隨即消釋怒意未形逐漸如此揩磨則善矣大抵學者踐履工夫雖至難至危處試驗過方始無往不利若舍至難至危其他踐履不足道也夜徐行田間默誦中庸字字句句從容詠歎體于心驗于事所得頗多上不怨天下不尤人君子居易以俟命小人行險以僥幸燈下讀中庸書此不肖恆服有效之藥也知弗致己弗克何以學為因暴怒徐思之以責人無恕故也欲責人須思吾能此事否茍能之又思曰吾學聖賢方得能此安可遽責彼未嘗用功與用功未深者乎况責人此理吾未必皆能乎此也以此度之平生責人謬妄多矣戒之戒之信哉躬自厚而薄責于人則逺怨以責人之心責已則盡道也以事難處夜與九韶論到極處須是力消間氣純乎道德可也倘常情一動則去道逺矣出處進退惟學聖賢為無弊若夫窮通得喪付之天命可也然此心必半毫無愧自處必盡其分方可歸之天欲大書何者謂聖賢何者為小人以自警自今須純然粹然卑以自牧和順道德方可庶幾嗟乎人生茍得至此雖寒飢死刑獄死何害為大丈夫哉茍不能然雖極富貴極夀考不免為小人可不思以自處乎燈下坐南軒觀年二十時所作論三篇不勝悲歎何者昔時志向的然以古聖賢為可學至今逡巡茍且二十年多病侵凌血氣漸衰非惟不能至聖賢欲求一寡過人且不可得奈何奈何凡事誠有所不堪君子處之無所不可以此知君子之難能也據今地位努力向前途間與九韶談及立身處世向時自分不敢希及中庸數日熟思須是以中庸自任方可無忝此生只是難能然不可畏難而茍安直下承當可也讀罷思債負難還生理蹇澀未免起計較之心徐覺計較之心起則為學之志不能專一矣平生經營今日不過如此况血氣日衰一日若再茍且因循則學何可向上此生將何堪于是大書隨分讀書于壁以自警窮通得喪死生憂樂一聽于天此心須淡然一毫無動於中也倦卧夢寐中時時驚恐為過時不能學也人生但能不負神明則窮通死生皆不足惜矣欲求如是其惟慎獨乎董子云人之所為其美惡之極乃與天地流通往來相應噫天人相與之際可畏哉人須整理心下使教瑩淨常惺惺地方好此敬以直內工夫也嗟夫不敬則不直不直便昏昏倒了萬事從此隳可不懼哉凡事須斷以義計較利害便非人須于貧賤患難上立得腳住克治粗暴使心性純然上不怨天下不尤人物我兩忘惟知有理而已熟思平生歷試不堪回首間閲舊稿深恨學不向前身心荒怠可憂可愧今日所當為者夙興盥櫛家廟禮畢正襟端坐讀聖賢書收斂此心不為外物所汩夜倦而寢此非所當計窮通夀夭自有命焉宜篤信之心是活物涵養不熟不免搖動只常常安頓在書上度不為外物所勝應事後即須看書不使此心頃刻走作數日養得精神差好須節節接續去莫令間斷精白一心對越神眀茍一毫不盡其道即是自絶于天中堂讀倦逰後園歸絲桐三弄心地悠然日眀風靜天壤之間不知復有何樂遇逆境暴怒再三以理遣蓋平日自己無德難于専一責人况化人亦當以漸又一時過差人所不免嗚呼難矣哉中庸之道也貧困中事事纒人雖則如此然不可不勉一邉處困一邉進學七月十二夜枕上思家計窘甚不堪其處反覆思之不得其方日晏未食久方得之蓋亦别無巧法只隨分節用安貧而已誓雖寒餓死不敢易初心也于是欣然而起又悟若要熟也須從這裏過凡百皆當責己晴窗親筆硯心下清涼之甚忘却一身如是之窘也康節云雖貧無害日髙眠月下咏詩獨步緑隂時倚修竹好風徐來人境寂然心甚平淡日來甚悟中字之好只是工夫難也然不可不勉康節詩云拔山蓋世稱才力到此分毫強得乎早觀生意可樂殘月尚在露華滿眼箇中妙處非言語所能形容東觀柱帖窗前花草宜人意几上詩書恱道心寄身于從容無競之境逰心于恬淡不撓之鄉日以聖賢嘉言善行沃潤則庶幾其有進乎人之病痛不知則已知而克治不勇使其勢日甚可乎哉志之不立古人之深戒也男兒須挺然生世間先儒云道理平鋪在信乎斯言也急不得慢不得平鋪之云豈不是如此近來時時見得如此是以此心較之往年亦稍稍向定但眼痛廢書一年餘為可歎耳處大事者須深沈詳審看言行録龜山論東坡云君子之所養要令暴慢邪僻之氣不設于身體大有所省然志不能帥氣工夫間斷甚矣聖賢之難能也纍日看遺書甚好因思二程先生之言真得聖人之傳也何也以其説道理不髙不低不急不緩溫乎其夫子之言也讀之自然令人心平氣和萬慮俱清涵養此心不為事物所勝甚切日用工夫看朱子六十後長進不多之語恍然自失嗚呼日月逝矣不可得而追矣近來身心稍靜又似進一步間逰門外而歸程子云和樂只是心中無事誠哉是言也佳按康齋先生只是將聖賢言語來體驗日用工夫真覺有味不似後人談玄説妙全無實落也世間可喜可怒之事自家著一分陪奉他可謂勞矣誠哉是言也先哲云大輅與柴車較逐鸞鳳與鴟梟爭食連城與瓦礫相觸君子與小人鬭力不惟不能勝兼亦不可勝也學易稍有進但恨精力減而嵗月無多矣只得隨分用工以畢餘齡焉耳纍日思平生架空過了時日晚知書史真有益却恨嵗月來無多與學者話久大槩勉以栽培自己根本一毫利心不可萌也三綱五常天下元氣一家亦然一身亦然動靜語默無非自己工夫靜坐獨處不難居廣居應天下為難事往往急便壞了胡文定公云世事當如行雲流水隨所遇而安可也毋以妄想戕真心客氣傷元氣請看風急天寒夜誰是當門定腳人看史數日愈覺收斂為至要人生須自重間卧新齋西日眀窗意思好道理平鋪在著些意不得彼以慳吝狡偽之心待我吾以正大光明之體待之詩云戰戰兢兢如臨深淵如履薄氷七十二嵗方知此味信乎希賢之不易也夜靜卧閣上深悟靜虛動直之旨但動時工夫尤不易云程子云五倫多少不盡分處至哉言也學至于不尤人學之至也午後看陸宣公集及遺書易一親聖賢之言則心便一但得此身粗安頃刻不可離也夜卧閣思朱子云間散不是真樂因云程子云人于天地間並無窒礙處多少大快活乃真樂也勉旃勉旃無時無處不是工夫年老厭煩非理也朱子云一日未死一日要是當著力于是厭倦皆是無誠雖萬變之紛紜而應之各有定理婁諒字克貞上饒人自少有志于學嘗求師四方夷然不屑曰率舉子學非身心學也聞康齋在臨川乃往從之康齋一見喜之一日康齋治地召先生往視云學者須親細務先生素豪邁由此折節雖掃除之事必躬自為之遂為康齋入室凡康齋不以語門人者于先生無所不盡羅一峰未第時往訪康齋康齋不出先生謂康齋曰此一有志知名之士也如何不見康齋曰我那得工夫見此小後生耶一峰不恱移書四方謂是名教中作怪張東白從而和之康齋若不聞先生語兩人曰君子小人不容並立使康齋為小人二兄為君子無疑倘後世以君子處康齋不知二兄安頓何地兩人之議遂息景泰癸酉舉于鄉退而讀書十餘年始上春官天順甲申登乙榜分教成都尋告歸以著書造就後學為事所著目録四十卷三禮訂訛四十卷春秋本意十二篇先生以收放心為居敬之門以何思何慮勿忘勿助為居敬要旨康齋之門最著者陳石齋胡敬齋與先生三人而已敬齋之所訾者亦惟石齋與先生為最謂兩人皆是儒者陷入異教去謂克貞陸子不窮理他郤肯窮理石齋不讀書他却勤讀書但其窮理讀書只是將聖賢言語來護己見耳未嘗虛心求聖賢指意舍己以從之也又言克貞見搬木之人得法便説他是道此與運水搬柴相似指知覺運動為性故如此説道固無所不在必其合乎義理而無私乃可謂道豈搬木者所能蓋搬木之人固不可謂之非道但行不著習不察耳先生之言未嘗非也先生靜久而明癸未至杭州而返人問云何先生曰此行非惟不第且有危禍春闈果災舉子多焚死者靈山崩曰其應在我矣急召子弟永訣卒年七十門人私諡文肅先生莊定山寄一齋詩云江門風月詩連塘水花趣安得二先生傾倒鵝湖寺又云朱學本不煩陸學亦非簡先生一笑中皓月千峰晚胡九韶金溪人自少從康齋學家甚貧課兒力耕僅給衣食凡康齋學有進益無不相告故康齋贈之詩云頑鈍淬磨還有益新功頻欲故人聞成化初卒謝復字一陽祁門人謁康齋于小陂師事之凡有得于講授者必身體力行以求自得閲三嵗而後返從事于踐履葉畏齋問知曰行陳寒谷問行曰知未逹曰知至至之知終終之非行乎未之能行惟恐有聞非知乎知行合一學之要也邑令問政曰辨義利則知所以愛民厲已學者稱西山先生嘗聚徒南塘每開迪以孝弟為先窮年一室討論古今遇感有作多悠然自發其所養𢎞治中與修邑志太守幸菴彭公深敬禮之造詣既久逺近知名所著有西山類藁髙陵吕氏為序而行之夏尚朴字敦夫永豐人從學于婁一齋傳主敬之學謂才提起便是天理才放下便是人欲魏莊渠歎為至言登正德辛未進士仕至南太僕少卿逆瑾擅政遂歸鄭伉敬齋先生字孔眀浙江常山人三嵗聞父母哭而知哀五嵗誦故事十三讀書治舉子業文理蔚然二十為博士弟子員及省試一再不合棄之曰顯親揚名恐不在此也乃走豐城拜于丁潛軒之門求踐履實學復見吳康齋先生于崇仁康齋曰此間工夫非朝夕可得恐誤子逺來對曰此心放逸已久求先生收之耳敢欲速乎因受小學日自驗于身心徐得聞四子六籍之要久之于道若有見焉乃歸築室于龍池之上日取諸儒論議一切折衷于朱子凡古載籍靡不讀但不讀佛老之書嘗謂其毁肢體滅人倫即不容誅義何待讀其書而後辨其謬哉一時名儒若蘭溪章楓山開化吾文山南昌張東白皆相與可否所著有易義發明卦贊讀史管見觀物餘論蛙鳴集凡十餘萬言惜燬燼存者僅十之一本傳執喪極哀祠墓殯葬一本之家禮設義學立社倉事事皆著實地上做學者稱敬齋先生兩浙理學名賢録胡居仁敬齋先生文敬公字叔心江西餘干人布衣從祀孔廟先生自幼頴異有大志七嵗學于家孰言動如老成人吾學編既而從康齋吳先生得心學之正退而益加充廣慨然以古人自期以斯道自任以記誦詞章為不足事專用心于內其學以主忠信為本以求放心為要以聖學成始成終在于敬因以敬名齋動靜語默出入起居常以敬為所處家庭如在廟堂臨妻孥如對賔客端莊凝重履繩蹈矩造次顛沛未嘗少違隱微幽獨之際則愈嚴愈密故其詩曰謹獨功深後防微意最先爭交真在此要不愧皇天先生嚴毅清苦左繩右矩每日必立課程詳書得失以自考終日竟夕孳孳不倦探典墳之藴奧究事理之精微存諸心而履諸身明其體而逹其用見義勇為不擇利害為趨舍排異端振流俗繼聖賢之緒任綱常之責髙風偉節儀表江南門人徐𢎞撰行狀先生家居日以悅親為事父病劇嘗糞味苦疾果愈兄弟外歸迓于門外有疾躬調藥家人化之篤宗族訓子侄不倦執親之喪水漿不入口哭踊每絶而方蘇哀毁骨立非杖不能起三載不入寢室祠堂月朔之薦四時之祭及緦功之小悉遵古禮簞食瓢飲處之泰然或為之籌則應之曰以仁義潤身以牙籖潤屋足矣四方摳衣及門者衆于是築書室曰禮吾曰南谷聚徒講學語學則曰為已語治則曰王道又曰第一怕見得不真第二怕工夫間斷多有質美者好髙入于禪騁詞失于矜不知操存省察為何事安能造道德之域隱然有自任意久之欲廣聞見適閩歷浙入金陵從彭蠡而返所至訪求學問之士與上饒婁一齋永豐羅一峰南昌張東白相與麗澤會于弋陽之龜峰餘干之應天寺提學李齡鍾城相繼請主白鹿書院諸生又請講學貴溪桐源書院淮王聞之請講易于其府王欲梓其詩文先生辭曰尚需稍進所著有居業録敬齋集成化甲辰三月十二日卒年五十一萬厯乙酉從祀孔廟先生持已雖嚴待物甚恕其言學也則曰惟為已則所從不差然後可以及人言治則曰惟王道能使萬物各得其所又曰一日克己復禮天下歸仁此王道之本也其初家食稍有餘鄰里有假無不應比後不能償亦不之較不戚戚于貧賤故其詩曰終日觀書聖賢在目終日言談不及利祿若使稊稗不生何愁五榖不熟行狀先生隱居吾邑之梅溪少從松江郡守于君世衡受春秋為舉子業知無所得而稍厭之及聞聘君吳康齋先生講義理之學于崇仁里第慨然徒步往從之逰于是盡棄舊學一以求道為心歸築室于梅溪山中事親講學之外一意謝絶人事而人亦無能知者會親死哀毁踰節喪葬之儀悉依倣古典不茍卜兆為鄉里刁兒所厄不得已而訟之則墨其衰以入公門時喪禮久廢獨先生毅然行之識者知其為特立獨行之士而不識者咸非笑之然搢紳間知有先生實自兹始而先生年蓋三十餘矣先生之學以窮理盡性至命為期謂非身心內外一主于敬則亦無所依據以為之地故特以敬名齋夷考其可知者雖在屋漏之中夫婦相對如賔即櫛椸篋笥之微亦區别精嚴至老不相淆亂應接賔客深衣巾履終日儼然而性度寬和談論亹亹人亦往往樂從之遊先生以堯舜之道不外乎孝弟孔子之道不外乎忠恕而士之遊情髙逺者非也故其為道必始于卑近以漸造乎髙逺循循有序而方興未艾之勢實不容已焉雖其不幸老死林泉無以考其本末兼備之眀驗然于斯理體認親切一反求諸身心以得之吾邑自曹無妄先生後僅見斯人而已真可謂儒者之髙蹈今世之逸民而先生無求于世世亦不知有求于先生惜哉鶉衣簞食每有超然自得之趣一切權利紛華舉不足以動其心至于佛老之説尤所不取皆搜剔根蠧而深闢之先生五經皆通尤邃于春秋自孟子沒後獨推尊二程朱子以為得其正傳他不得與也先生之道真可垂諸竹帛以增一代道德之光張吉序居業録要語本朝正統景泰間以理學為倡者河東薛敬軒其讀書録亷年二十六七始得見之國初以來諸公所著述求其粹然一出于正未有先之者也近年乃得餘干胡敬齋所為居業録其言精確簡當亦粹然出于正者讀書録之外所見惟此耳亷聞敬齋嚴毅清苦力行可畏其議論實由涵養體驗所得非考索探討致然讀其書者其尚有以識此哉楊文恪廉撰居業録兮類序門人余祐曰先生弱冠時奮志聖學往遊康齋先生門退而藏修于家讀書窮理存諸心者不以一時或息反諸身者不以一事或遺久之則知益精守益固養益裕而所得益深矣居業録者先生道明德立無可告語事有感于外而無可施行故筆之于册取易修辭立誠之義其間論聖賢德業經傳旨趣學問工夫政教基本性命淵微不一而足至異端佛老之學尤深辨詳闢惟恐其陷溺人心變亂士習蓋亦有為而發故其辭繁而不殺焉居業録序周瑛祭文略曰君學之所至兮雖淺深豫未有知觀君學之所向兮得正路抑又何疑倘嵗月之延兮必日躋乎逺大痛夀命之勿永兮若深造而未艾謂力行之有功兮惡虛談之無益競內外以交修兮每得尺而守尺肆辨博以夸誕兮匪豫拙之不能無實地以為據兮竟何學之有成顧天理之精粹兮寓人事之粗淺惟粗淺之既盡兮而精粹之乃見佳曰先生篤守朱子之學教人専從小學近思録入純修實詣不雜不偏河東夫子而後一人而已黃太沖曰先生言治法寓兵未復且先行屯田賔興不行且先薦舉井田之法當以田為母區畫有定數以人為子增減以受之設官之法正官命于朝廷僚屬大者薦聞小者自辟皆非迂儒所言後有王者所當取法者也羅整庵曰胡敬齋大類尹和靖皆是一敬字做成居業録中言敬最詳蓋所謂身有之故言之親切而有味也然亦儘窮理但似乎欠透又曰敬齋力攻禪學蓋有志于間聖道者也但于禪學本末似乎未嘗深究動以想像二字斷之安能得其心服耶困知記佳按攻禪學者但當眀指其絶人倫壞天理與吾儒聖賢之中道背馳若深究其學則彼之辭善遁而在我所知未精所守未固鮮有不引而去故程子曰學者當如淫聲美色以逺之韓昌黎氏曰人其人火其書廬其居眀先王之道以道之斯言至矣先生復汪謙書曰學所以眀道是以古昔聖賢恂栗戒懼存養于未發之前使是道之體昭然于方寸之內精一謹獨省察于已發之際使是道之用流行于日用事物之間極其至與天地同其大造物同其功豈詞章功利之可擬哉昔孔子之所傳顔曽思孟之所學皆以此也及孟子沒而失其傳者千有餘年周子發其端于前程子遂擴而大之朱子又集而全之故吾道遂大眀于宋焉西山真氏亦庶幾乎此也元之魯齊許氏雖其道德之全未及于宋觀其所行端慤務實亦非世儒訓詁之可比也外此諸儒皆以考索為足以眀道注解為足以明道求其操存踐履之實蓋寡焉若雙峯饒氏公遷朱氏已不免此弊其流至于陳氏吳季子等則其害為尤甚某思與學者講明而踐行之刋落華浮一趨夲實庶有以革其弊但力學疏淺終不能遂也敬齋集佳按自宋末訓詁繁而性命之旨微至先生時其弊已極此陽眀先生所以有廓清之功也又曰今之可憂者道術分裂教出多門人才聰眀便好髙喜妙腳根不曽點地便要自髙大道理須自下學中朴實頭做工夫積纍之久自然貫通寄張東白書下同又曰此道理與生俱生有一毫未盡便是欠缺了自家底故提警扶持全有賴于吾兄竊觀聖賢之教雖多不出于存心處事存心以敬處事以義敬義立而德不孤看來後人處事多是智計才識未嘗有義以方外之實學此處見得分眀則王道伯術判然為二途而不混矣居業録要語靜中有物只是常有箇操持主宰無空寂昏塞之患離內外别心迹此二本也蓋心具衆理衆理悉具于心心與理一也故天下事物之理雖在外統之在吾一心應事接物之迹雖在外實吾心之所發見故聖人以一心之理應天下之事內外一致心迹無二異端虛無寂滅此理先絶于內以何者而應天下之事哉由其専事乎內而遺其外不考諸迹而専求諸心厭棄事物之理専欲夲心之虛靈是分內外心迹為二夲矣天下無道外之物故政刑文章皆須出於道天髙地下萬物散殊而禮制行矣流而不息合同而化而樂興焉此禮樂之本意也聖人制作只是因其自然之理曷嘗有一毫私意安排禮樂既成則所以節民之欲感人之心成人之德乃自然之功用故程子曰若逹便是堯舜氣象學不為已根本已失讀書窮理皆非自己之物孔子只教人去忠信篤敬上做放心自能收德性自能能養孟子説出求放心以示人人反無捉摸下工夫處故程子只説王敬佳按孟子説操則存舍則亡即程子主敬意也又曰寡欲即周子主靜意也求放心工夫孰切于此忠信篤敬是孔門第一等工夫非禮勿視聽言動也靠就這裏做去熟處便是仁事事存其當然之理而已無與焉便是王者事著些計較便是私吝心即流于伯矣成已者必能成物自治者必能治人程子有篤恭而天下平氣象氣之發用處即是神陳公甫説無動非神他只窺測至此不識裡靣本體故認氣為理眀道天資髙本領純粹其學自大本上流出于細微處又精盡孔門學者以求仁為要真是好是教他在最切要處求非但自己一身好與天地萬物血脈便相貫通不為堯存不為桀亡大行不加窮居不損須要識此人不能處事只是不曽窮理理眀天下無難處之事矣化民全要身修有理而後有氣有氣則有象有數故理氣象數皆可以知吉凶四者本一也異端之道全是安排造作儒者只是順其自然之理君子役物小人役于物言者心之聲事者心之迹心正時言必不差事亦順理程子曰未應不是先已應不是後蓋未應之時此理全具于寂然不動之中當此之時敬以操存之而未發之中天下之大本立焉已應之時此理發見于感而遂通之際當此之時敬以省察之則發而中節之和而天下之逹道行焉未應體也靜也已應動也用也體即用之所存用即體之所發非有兩事也固無先後之可言亦是動靜無端隂陽無始之意讀書須著實理會做入書內裏去皮膚上綽過不濟事眀道行狀云狡獪者獻其誠暴慢者致其恭聞風者誠服覿德者心醉其為政也道之而從動之而和不求物而物應未施信而民信此聖人境界上事聲色之于以化民末也退藏于密只是其心湛然無事而衆理具在也涵養之道須深篤實方能制其飛揚之心消其粗厲之氣主一工夫易施心易純也訂頑立心便可語王道物我之私既去則天地之生意在我推而行之將無一物不得其所不然則雖一匡天下不過出于智計之私况禍敗者乎王道之外無坦途仁義之外無功利程子天資髙其于義理不用甚窮索只優遊涵詠以得之雖曰反求諸六經然亦不甚費力自孔顔而下所造精粹未有及之者一本而萬殊萬殊而一本學者須從萬殊上一一窮究然後會于一本若不于萬殊上體察而欲直探一本未有不入異端者未發時仁義禮智之性渾然在中感而遂通之時惻隱羞惡辭讓是非之情隨應而出動靜一理體用一源故未應不是先已應不是後人以朱子調息針為可以存心此特調氣耳只恭敬安詳便是存心法豈假調息以存心以此存心害道甚矣異教謂用志不分乃凝于神又謂絶利欲源便到至道他却肯如此做工夫令學者反不及也然看他工夫雖専而隘雖捷而偏所以卒悖于道有一分利欲便蔽一分天理利欲長一分大本便虧一分天地聖人只一箇誠私意間處便不誠誠實理也不可以人偽雜之君實雖無偽然與聖人之誠不同者于實理未盡也乃無私之私無偽之偽也子路之欺亦然感化之機雖在無聲無臭處然政刑禮樂既具教化乃行天依形地附氣此二語説得天地規模最親切凡有氣者盡屬天有形者盡屬地凡物皆然氣屬陽形屬隂天只是氣有甚形質地則有形質矣地雖有形質非附乎氣必不能存附天之氣亦必依地之形以行也韓退之極聰眀志大才髙故程子言自孟子後能將許大見識尋求只此人如原道等篇亦窺見聖人之用論性亦過于荀楊惜乎未得聖賢用功之要故用力雖勤多在言語文字之間自任雖重于義理本原終未有得其以博愛為仁行而宜為義雖能窺見仁義之用于仁義之本體有所未覩也昔孔子言立人之道曰仁與義則人之道乃仁義之所為以見人之身全體是仁義命之于天全之于我而博愛與行而宜不足以盡之也子思曰仁者人也義者宜也以見仁即人身之理義即其理之宜也孟子曰仁人心也義人路也以見人心全體是仁義乃當行之理程子曰心如榖種仁則其生之性則益親切矣朱子曰仁者本心之全德是仁而義在其中即程子所謂専言之仁也又曰仁者心之德愛之理義者心之制事之宜也是兼體用而言也朱子之言尤為詳偹惜退之未覩乎此也為物欲所勝者皆是心不能做主也處事不得其宜者亦是心失其職也此涵養省察之功當盡也理與氣不相離心與理不二心存則氣清氣清則理益眀理眀氣清則心益泰然矣故心與氣須養理須窮不可偏廢嘗驗之存心密則粗暴昏濁之氣自消理直則剛大之氣自生心也理也氣也二而一也正則俱正邪則俱邪以文詞取士不過空言無實豈能得人不若推訪論薦乃能盡衆人公道其得人必勝如詞科必欲教養推選人才使無遺逸須如周禮司徒眀道學校劄子孟子在良知良能上體驗故曰性善荀子在情欲交動處看故曰性惡依孟子説則禮樂教化皆吾性中事依荀子説是指氣質物欲為真情故以禮樂教化為偽為也眀道所論十事條理詳偹先王之法盡于此矣當時若能用之從容三代之治定性無內外無將迎眀道不惟所見端的又工夫完純非去聖不逺不能如此嘗驗之無內外工夫猶可能無將迎非心性已定無一毫牽引之私不能也春秋傳程子精約簡當胡氏詳偹議論發越然胡氏亦有穿鑿過當處令人屏絶思慮以求靜聖賢無此法聖賢只戒謹恐懼自無許多邪思妄念不求靜未嘗不靜也揚子雲之言沈晦見道不眀也辭不厲所守不確也顧諟天之眀命是事事不違天理顔子非禮勿視聽言動孟子必有事焉是此等工夫象山天資髙力量大用力甚切但其見理過于髙大存心過于簡易故入于禪其自幼與伊川不合者伊川收斂謹密其言平實精確象山必有凌虛駕空之意故聞伊川之言似有傷其心其晚年身在此處能知民間事又預知死期則異學無疑其門人楊簡以問答之間忽省此心之清眀忽省此心之無始末忽省此心之無所不通此非儒者之傳授其行狀言四時之變化先生之變化也天地之廣大先生之廣大也鬼神之不可測先生之不可測也亦過髙之言也佳按先生之學正當以髙眀簡易濟之其論慈湖非儒者之傳授則確論也每讀象山之文章筆力精健發揮議論廣大剛徑有悚動人處故其遺風餘烈流傳不泯然細推之則于聖賢細密工夫不甚分眀故規模腔殼雖大未免過于空虛也朱子曰靜而常覺似説重了些子只説常惺惺常精眀則可説常覺便有心分為二底意思朱子于中庸或問言至靜之時但有能知能覺者而未有所知覺也此為至論人之氣貴乎剛却怕粗氣剛則才大氣粗則才疏才大而疏成少敗多故君子養其氣以至剛大完密則才德全矣泥古則濶于事情徇俗則傷于茍簡二者皆非天理時中一者誠也主一敬也由敬入誠欲天下治須得賢才欲得賢才須行推訪選舉法其本在于君身修君心眀欲君身修在于學只從父子君臣夫婦長幼朋友上求道便是真實底道理古人做工夫極切實貌曰恭言曰從視曰眀聽曰聰思曰睿非禮勿視非禮勿聽非禮勿言非禮勿動只不愧屋漏則是吾之職分已盡若夫富貴貧賤禍福皆當處之以義不可纍吾心也只正已而已人之從違用舍皆不可必茍以人之從違用舍為纍則失其所守必矣人須持敬亦要義理來浸灌方得此心恱懌不然只是硬持守也古人云晏安如鴆毒甚可懼也惟莊整嚴肅戰兢惕厲可以勝之心常有所事則雜念不生故程子以必有事焉而勿正為主一若正則反生事心反不寧勿忘勿助乃本心存處天理妙處程子以與鳶飛魚躍同活潑潑地欲為天下第一等人當做天下第一等事學者須要豎得這身起須收斂凝定精神聚志向専察理必密趨向正底人方好讀書佳按必讀書然後趨向正致知在格物也好字當作去聲處事不用智計只循天理便是儒者氣象操持要極其謹密窮理要極其精微應事要極其詳審規模要極其宏大此君子無所不用其極也中庸可以盡易之理日月至焉亦是到那境界只是不久也先儒言仁惟公近之公則無物我包涵遍覆無所不盡孟子天資本英眀剛大他又去集義養氣上做工夫所以才氣愈剛大清眀剛大之氣須要養如何養只是循天理不為物欲所屈便是看來朱子只恁勇猛做向前去更不退縮朱子直是豪氣孟子直是英氣朱子直是豪氣天資合下皆大陸宣公才極精密周遍三代以下罕及但唐德宗庸君不能盡其才范文正作事必要盡其方曰為之自我者當如是其成與否則有不在我者雖聖賢不能必吾豈茍哉此范公有吻合聖賢處故其進退出處超然無纍行藏卷舒過于他人聖人在上氣勢大風化盛人之善心自長惡心自消觀二南之詩可見工夫在大學效驗在二南古之聖王心同天地其生物之心敵國皆知之雖或誅暴禁亂不得已而興師彼之人民皆心服誰肯與我為敵此是個大兵法人不識只有孟子識得透事雖要審處然亦不可揣度過了事雖要聽從人説亦不可為人所惑亂擇須精行須果志不可一日墜心不可一時放心有主雖在閙中亦靜故程子以為金革百萬與飲水曲肱一也然必知之深養之厚心方不動文王在羑里演易周公又擊爻辭是欲以此盡天下古今之變以為卜筮恐不可被雜事昏擾者心役于物也茍能立已事雖多常整整不亂自孟子後千四百年無人見得此道分眀董子見其大意孔眀天資有暗合處韓退之揣見倣佛至程子方見得盡自朱子後無人理會得透徹真西山庶幾佳按昌黎當晦蝕之後灼見道脈推尊孟子豈揣見倣佛者哉惜其功力有未至耳做當今一箇好人須壁立千仭學至聖人地位方了得一生事見理義不怕見得鈍只怕見得淺雖見得快若不精深亦不濟事故曰參也竟以魯得之是理會得事透徹守得牢固一氣交運便齊不得故所生物萬有不齊而剛柔善惡邪正古今淳漓治亂盛衰亦萬變不一然其間莫不有一定之理聖賢隨其事而以理處之雖萬變交于前而吾之心未嘗不定也春秋即人事以明天理用天理以處人事盡天理不以一毫私意智力撓之便是堯舜氣象凡事熟則精精則巧巧則神公輸子之巧師曠之聰伯牙于琴瓠巴于瑟羲之于字皆至熟至精而神生焉聖人之于天理至熟至精故神妙不測也心粗最害事心粗者敬未至也孔門之教只是求仁而堯舜事業盡在此此理須從優遊涵暢中出來則意味自别即孟子所謂自得之也聞人之謗當自修聞人之譽當自懼不顯亦臨無斁亦保此聖人之心學者只是要無間斷看書須沈潛反覆待其義理融液周匝方可放下聖人只是盡其道感化之妙自然而然聖人固欲人之感化亦未嘗有心也故曰同歸殊途一致百慮只虛中無我而已孟子才髙在心性源頭處理會曰存心養性曰求放心擴充四端之類其曰操曰存曰養曰求曰擴充孟子工夫便在此下手非有孟子天資便無可依據故孔子只教人忠信篤敬博文約禮便有依據持徇而心性工夫亦無不盡矣河洛之教實祖孔子故主敬主一齋莊嚴肅整衣冠齊容貌格物窮理益詳益盡學者亦不患無依據下手處矣程子説雞雛可以見仁切脈可以觀仁是無時無處不體認雞雛是生意醇粹處切脈是生理貫通處程子用心熟方見朱子體段大相似孟子但孟子氣英邁朱子氣豪雄孟子工夫直截朱子工夫周遍以上皆張古城所輯居業録要語也余摘其尤要者著于篇胡子粹言吳廷舉曰敬齋胡先生所著居業録中間天地之化生鬼神之情狀聖賢之出處學問之精微心性之淵源異教之歸宿禮樂綱常之懿兵刑政教之端事事物物句句言言皆能探其隱微中其肯綮廷舉入仕頗早見書苦遲𢎞治中同知蜀郡始得薛文清公讀書録既撮其録中要語刻粹矣正德中參江西政又求得所謂居業録者而抄之喟然歎曰朱子而後立論廣大精微髙眀平實者先生一人耳又撮其論學論心切要之語分為上中下三卷録為一帙出入時習且命工刻之以傳題曰胡子粹言他日四方或有與豫同嗜者見其約以求其博因其語以得其心讀其全書推其所學遭時遇主不為一代巨儒名卿矣乎若然先生雖亡所以持世者固存也先生雖逺所以垂範者猶近也豈非斯文之願哉先生閉户讀書開門授徒蓋逹于晝夜死生之變不知人世之有欣戚富貴者有所著述將以明道皆不得已而然亦非攻于文辭以干澤求知也余曩弔其墓下有志存伊旦學希聖賢有體有用識經識權濓洛之後獨得其傳九原可作當為執鞭之誄豈厚誣哉使先生生于周末與顔曽由閔同逰洙泗之間考德問業而下上其議論或可以為天民先覺之亞矣吳清惠公胡子粹言序覺得心放亦是好事便提撕收斂再不令走便是主敬存心工夫若心不知下落茫茫蕩蕩是何工夫窮理非一端所得非一處或在讀書上得之或在講論上得之或在思慮上得之或在行事上得之讀書得之最多講論得之尤速思慮得之至深行事得之最實古今聖賢説敬字曰欽曰寅曰恭曰畏曰翼曰戒懼曰戰兢曰齋莊字雖不同其實一也洪範貌曰恭是外面之敬至曰恭作肅則心亦敬也內外一致也臨深淵履薄氷形容戒懼之意最切孔子言出門如見大賔使民如承大祭又畫出一箇敬底樣子出來與人做程子言整齊嚴肅是入敬處主一無適是就存主處説謝氏惺惺法是就敬之精眀處説尹氏收斂身心不容毫髮事又即是孔子見大賔承大祭之意形容得最親切朱子敬齋針説得全備毫髮有差便流于禪定故朱子有三綱淪九法斁之戒周子有主靜之説學者遂専意靜坐多流于禪蓋靜者體動者用靜者主動者故曰主靜體立而用行也亦是整理其心不使紛亂躁妄然後能制天下之動但靜之意重于動非偏于靜也愚謂靜坐中有箇戒謹恐懼則本體已立自不流于空寂雖靜何害佳按先儒主靜之説是教人心不亂馳以全其湛然真一之體即主一無適之謂故程子每見學者靜坐嘆其善學朱子亦教人半日讀書半日靜坐收斂浮氣歸于寧一則紛擾何自生乎若其靜也惺然不昧則全體自立不偏空寂矣髙者入于空虛卑者流于功利此二句説盡天下古今之病自古害世教只有此兩般人正學不眀名教無主學者才要身心上用功便入空虛去才有志事業便流入功利蓋見道不明以近似者為真故也人心一放道理便失一收道理便在敬者德之聚也敬則衆善畢集不敬則怠惰放僻隨至而德敗矣莠之亂苖紫之奪朱皆以其相似而難辨與儒道相似莫如禪學此最害道者後之學者做存心工夫不得其真者多流于禪所謂髙者入于空虛蓋天資髙邁者多厭世事之冗而樂于虛靜又好竒妙而忽卑近又力去做靜中工夫掃除物欲屏絶思慮是內裏先做空了不覺流于禪學只緣在小學四書近思録不曽實體驗而于窮理工夫不到故如此佳按先生之學可謂正矣其力言學者不當専做靜中工夫似乎太過蓋是時有白沙之學易流禪寂故先生每切言之若得工夫真又無間斷學須日夜進長修身便是王道主一工夫可漸至純亦不已學不為已雖有顔孟之聰亦不濟事讀書須著實理會既曉其大義便真去做務要令此書自我身上發如忠信篤敬非禮勿視等處若實做得來自然長進程子説孔子言仁只説出門如見大賔使民如承大祭看其氣象便須心廣體胖動容周旋中禮又曰居處恭執事敬與人忠充之則睟靣盎背推而逹之則篤恭而天下平又曰惟上下一于恭敬則天地自位萬物自育氣無不和四靈畢至此體信逹順之道聰眀睿智皆由此出以此事天享帝不是程子實做過來如何會如此道今須以程子為法將聖賢言語句句從自己身上體驗何患不長進若未到此地位只是我未曽實做得工夫只管打點做上去此為學之大法也心無主宰靜也不是工夫動也不是工夫靜而無主不是空了本性便是昏了天性此大本所以不立也動而無主若不猖狂妄動便是遂物徇私此逹道所以不行也已立後自能了當得萬事是有主也其心肅然則天理即在故程子曰敬可以對越上帝程子教人靜坐所以救學者之偏亦所以定其紛擾亂雜之心容貌辭氣上做工夫便是實學謹獨是要佳曰不謹獨而只在容貌辭氣上做工夫乃為偽也心常惺惺自無客慮當然處即是天理學者之所患最是惰與輕惰則自治廢輕則物欲恣只一敬字可以治之人莊敬體即立大本即在不然則昏亂無本聖賢只説戒謹恐懼則心自存何嘗看住此心不許他走只説整齊嚴肅則心便一何嘗遏絶思慮以求不雜放心是逐物于外惕然警懼則即此而在矣是知戒謹恐懼乃存心之要也釋氏心亦不放只是內裏無主真能主敬自無雜慮欲屏思慮者皆是敬不至也程子曰有主于內則虛是內裏潔淨眀瑩無昏雜與無主而虛不同如人家主人在內雜亂人不入故虛異端言虛只是空屋無人矣心精眀是敬之效才主一則精眀二三則昏亂矣孟子求放心不是捉得一箇心來存只惕然肅敬心便在此敬便是操存非敬之外别有箇操存工夫格物便是致知非格物之外别有箇致知工夫程子以必有事而勿正心勿忘勿助長為敬是孟子言外之意主一即此義也于此會得則私意不容天理流行矣故與鳶飛魚躍同活潑潑地非如釋氏其實無見只是弄精神也心不可放縱亦不可逼迫故程子以必有事焉而勿正心勿忘勿助長為存心之法雖借用孟子之言其義尤精此自然之理非有毫髮之意故與鳶飛魚躍同活潑潑地涵養本原與窮索義理實交相涉入蓋人心只有許多義理更無别物涵養既至則天理自明窮理既精本心愈安也程子發眀心有主一句真學之要此便見虛中有實大本卓然彼徇于功利者雜擾而無主溺于空虛者寂滅而無主只收斂専一便是有主之道朱子所謂自作主宰自操自存今有一等學問常照看一箇心在內裏乃異教反觀內視之法其無主一也悔悟是去病之藥然以改之為貴若流滯于中則又因藥發病不和不樂鄙詐之心入之矣不莊不敬慢易之心入之矣此禮樂所以不可斯須去身也雖整齊嚴肅亦要箇沈細密意思不可把捉大過心常有主乃靜中之動事得其所乃動中之靜人苦無才此只是不窮理理明才自長然又須養氣以充之存心以察之今人為學多在聲價上做如此則學時已與道離了費盡一生工夫終不可得道聖學以敬為本敬可以去昏惰正邪僻除雜亂立大本人存養久則氣質自變人之學先在持其志志一則動氣如人昏困是氣昏也若悚然自持則志立而氣自清故持志在敬蓋嚴肅之地昏惰不生集義養氣亦由于此窮理須得心専一方有細密工夫方見得透徹若不専一則粗疏草略縱敏者亦略見仿佛而已學者務名所學雖博與自已性分全無干涉濟甚事窮理格物先從性情上窮究則見得仁義禮智渾然全具于吾心惻隱羞惡辭讓是非隨感而發從此力加操存省察推廣擴充此便是源頭工夫根本學問又于日用事物人倫天地山川禽獸草木無不究極其所以然眀而禮樂幽而鬼神日月之更迭寒暑之往來嵗月之交運古今風氣盛衰國家治亂興亡民之安危兵之勝負無不窮究方為窮理致知之學敬該動靜靜坐端嚴敬也隨事檢點致謹亦敬也敬兼內外容貌莊正敬也心地湛然純一敬也立得志定操得心定不至移易則學自進才覺私意起便克去此是大勇人心要深沈靜密方能體察道理故程子以性靜者可以為學若躁動淺露則失之矣志不可放倒身不可放弱程子曰懈意一生便是自暴自棄朱子曰才悠悠便是志不立今人有聰眀都不會用只去雜駁上學或誦記辭章或涉獵史傳或泛觀諸子百家用心一差其聰眀更為心害善用聰眀者潛心積纍先從小學大學近思録論語孟子精思熟記體驗得聖賢心事義理工夫瞭然得之于心然後循序漸進博學群書才昏惰義理自喪一是誠主一是敬收放心只是一箇敬不主敬而欲收放心東追西捉愈見費力縱使捉得住亦是箇死物事其虛靈不昧所以具衆理應萬事者俱不能矣惟整齊嚴肅主一無適則隨動隨靜自然收斂不放心既不放則內有主自然神眀不測體用不虧此釋老之學空寂無用儒者之學所以通逹萬變也用心不可太過過則生疾心為神眀之舍過苦則神傷只主一無適優遊涵泳自然義理眀釋氏之存心有二一是習為虛靜絶滅思慮使之無雜擾一是常照住此心不令走作殊不知聖賢教人有灑掃應對周旋禮樂孝悌恭敬皆是存心之具如九容九思亦是存養之法故心存理得而事治釋氏之存心適以壞其心之體絶其心之用其害莫大焉右吳東湖先生所輯胡子粹言也其書視要語頗有異同然于學者身心用功之要尤為切緊進學銘曰凡學之道立志為先其志伊何曰聖曰賢聖賢之學在于為已擴而充之無所不至彼為人者喪厥良心惟名是務惟利是徇學問之功循序漸進行逺升髙自卑自近存誠主敬立我根基匪敬匪誠外物昏之其誠伊何盡厥真實其敬伊何容莊心一誠敬既立本心自存虛靈不測是曰天君即事即物務窮其理理無不窮其知乃至理雖在事實備吾身力行既久全體皆仁舉而措之家齊國治聖人能事此其畢矣為此銘戒告我良朋毋暴毋棄毋忽毋輕劉念臺曰敬齋云敬無間斷便是誠豫謂心有間斷只為不敬故若敬則自無間斷敬則所以誠之也此所謂自眀而誠也非敬即是誠敬齋尚未及和靖敬齋只持守可觀而和靖於涵養分上大是得力山隂要語又曰敬齋篤實敬齋先生曰朱子曰看來人處大事中無一時間吉凶悔吝一息不曽停如大輪一般一恁滚將去聖人只隨他恁地去看道理如何愚按朱子此言論乾卦潛見惕躍飛亢之事學易者當知此意先生要語鈔清髙太過則傷仁和順太過則傷義先儒言合內外之道又曰表裏交正曰內外交養曰本末相資曰體用一源顯微無間曰動靜相涵曰敬義夾持此等處最宜理會此處見得破則知所用力知所用力則功利無所誘異端不能惑矣纂理學彚編只是這箇道理更有甚事聖賢隨其所指分别出來貫通後萬理只一理以其流行不息賦與萬物者謂之命萬物各有稟受而此理無不全具謂之性性中生意粹然為衆善之長謂之仁裁度斷制處得其宜乃性中之義儀章品節天秩燦然不亂乃性中之禮分别是非條理分眀乃性中之智實有此理原無虛假謂之信見于日用各有所當行者謂之道通天地人物莫不各有當然之理總謂之道其所以闔闢天地終始萬物無窮無盡謂之太極無非是這道理道一也所指不同孔子曰一隂一陽之謂道邵子以道為天地之本又以道為太極朱子曰元亨利貞天道之常子思曰率性之謂道然道即理也一隂一陽之謂道形而上者謂之道是指此理行于形氣之中也道為太極為天地之本是指此理為造化之主也率性之謂道是指此理見于人身日用也元亨利貞是指天理之流行而言也理乃氣之理氣乃理之氣混之則無别二之則不是天地只是一箇生物之心聖人全天地之心故仁民愛物自不能已天人之理雖一天人之分則殊故天做天底人做人底各盡其分而吾之理則天之理也故維天之命於穆不已乾道變化各正性命是天做天底聖人之心純亦不已應酬事物各得其所是人做人底夫人即那天命不已乾道變化中來吾之性即是那各正性命底故天命之性盡在于我無毫髮少欠若存得吾心養得吾性則天命全體渾具于中發而應事各得其所則吾身天道亦流行而無間矣蓋天許多道理我盡有之但盡得吾身之理則天道亦盡今不來吾身做工夫只去思想天道愈見二了豈能合天人之理乎故程子曰天人本一言合天人已剩著一箇合字何喬逺曰居業録大率躬行之言也其辭辨其氣昌凡古今治亂學問之深淺才術之髙下了然洞豁有體有用有經有權非尺幅拘攣之比也以陳獻章倡勿忘勿助之學為亂苖之莠而莊昶豪放之士且使學者流于曠蕩之歸其欲求本實以真體驗如此陸瑞家曰本朝理學之臣胡叔心完璧也席珍懷待聘之資遁世絶憂悶之志余祐認齋先生字子積江西鄱陽人𢎞治己未進士仕至吏部右侍郎始入小學即慨然有求道之志聞餘干胡居仁潛心踐履徒步往從之居仁一見以女女焉授南刑部主事轉員外勳臣有爭襲者公當署其案忤劉瑾意落職瑾誅以薦起知福州鎮守內官市物不豫直又以白金二百強府為市改機公入其金于帑民以不豫直訴者十百為羣公泣慰遣之將以聞于朝鎮守懼稍戢會天旱鎮守曰余知府自謂愛民必能動天可令獨禱公齋戒出郊雨隨應鎮守愈慚隂遣人搆于厰衛曰不去余知府鎮府不得伸手也既媒蘖無所得則謾為好言曰余知府好官我敢不敬之但好亦無庸慢我會遷山東按察副使丁父憂未上服除補山東整飭徐州兵備南京進貢內臣多挾商貨索夫馬價至數倍知州樊凖白公詰其私貨入之誣逮錦衣獄謫南寧同知稍遷韶州知府投劾去嘉靖初升河南按察使屢與撫按爭可否當其辭氣棘棘聽者至不能堪乃因考察橫中之其劾章曰心慕乎古氣失之偏公聞之曰偏則有之慕古吾豈敢也坐調廣西纍升吏部右侍郎公自調廣西後公論益眀當國者知公剛正可大用故未久屢遷吏侍報至而公已不及聞矣戊子嵗也年六十四公好善嫉惡出于天性所交逰皆賢士大夫而與魏挍張嶽尤善人有過不能忍常面斥之退無後言有攻過者欣然樂受人以是信重之推論當世正人必及公云公克念力行居恆言學豈在多言惟去其念慮之不誠不敬者使心地光眀篤實不患不至于古人矣眀書理學傳時文成朱子晚年定論初出以朱子到底歸于涵養先生謂文公論心學凡三變如存齋記所言心之為物不可以形體求不可以聞見得惟存之之久則日用之間若有見焉此則少年學禪見得昭昭靈靈意思及見延平盡悟其失後會南軒始聞五峰之學以察識端倪為最初下手處未免闕却平時涵養一節工夫别南軒詩惟應酬酢處特逹見本根答叔京書尾謂南軒入處精切皆謂此也後來自悟其失改定已發未發之論然後體用不偏動靜交致其力功夫方得渾全此其終身定見也安得以其入門功夫謂之晚年哉先生之學墨守敬齋在獄中著性書三卷其言程朱教人拳拳以誠敬為入門其性書之作兼理氣論性深闢性即理也之言蓋分理是理氣是氣截然為二并朱子之意而失之有云氣嘗能輔理之美矣理豈不救氣之衰乎整庵非之曰不謂理氣交相為賜如此陳獻章白沙先生字公甫廣東新會人正統丁卯鄉貢士授翰林檢討不仕先生身長八尺目光如星右臉有七黑子如北斗狀少頴悟絶人讀書一覽輒記嘗讀孟子至有天民者嘆曰大丈夫行已當如是也正統十二年舉廣東鄉試明年會試中乙榜入國子監讀書聞臨川吳與弼講伊洛之學遂從之逰既受業歸足迹不至城市閉門讀書徹夜不寢少困則以水沃其足久之乃嘆曰夫學貴乎自得也自得之然後博之以典籍之言自我之言也否則典籍自典籍而我自我耳遂築一臺名曰陽春日靜坐其中者數年言行略佳按學于古訓乃有獲以吾未有所得故求之典籍以聖賢為師而指迷開悟欲其自得之也今曰自得之然後博之以典籍其毋乃非先王之訓也乎成化三年復逰太學邢祭酒讓試和楊龜山此日不再得詩曰能飢謀黍稷冒寒思植桑少年負竒氣萬丈摩青蒼夢寐見古人慨然悲流光吾道有宗主千秋朱紫陽説敬不離口示我入德方義利兩途分析之極毫芒聖學信匪難要在用心臧善端日培養庶免物欲戕道德乃膏腴文辭固粃粳俯仰天地間此身何昻藏胡能追逸駕但欲潄餘芳特此木鑽柔其如磐石剛中夜攪衣起沈吟獨倣徨聖途萬里餘髮短心苦長及此嵗未暮驅車適康莊行逺必自邇育德貴含章邇來十六載滅迹聲利場閉門自探討蛻俗如驅羊隱几一室內兀兀同坐忘那知顛沛中此志竟莫強譬如濟巨川中道奪我航顧兹一身小所繫乃綱常樞紐在方寸操舍決存亡胡為漫役役斫喪良可傷願言各努力大海終回狂讓得之驚歎揚言于朝謂真儒復出由是名動京師一時名士羅倫章懋莊昶周映輩皆樂與之友薦紳謁見考德問業無虛日吏部侍郎尹旻賢之遣子從學辭不納給事中賀欽抗疏辭官去執弟子禮肖先生像懸于别室有大事必咨焉羅倫改官南京修撰聞先生議論亦解官去既歸白沙絶意仕進心大業四方來學者日益衆乃築小廬山書屋以待學者雖中官緇流畨夷農賈無不得其歡心家故貧或貨粟于人僉事陶魯以田遺之不受海北提舉汪廷貞慕甚作懷沙亭以想像之江西布政使陳煒修復白鹿洞書院走書幣聘為師謝不往自朝至夕與門人講學或至漏下亹亹不少厭倦楚人李世卿來學留凡七越月别歸先生語之曰子凌邁髙逺則有之優遊自足無外慕嗒乎若忘在身忘身在事忘事在家忘家在天下忘天下未必能與我合也比與朝夕言名理凡天地間耳目所聞見古今上下載籍所存無所不語所未語者此心通塞往來之機生生化化之妙非見聞所及將待子深思而自得之非有愛于言也世卿歸登大崖山吟弄赤壁之風月豫所未言者世卿終當自得之進士薑麟使貴州特取道如新會以師禮見出曰吾閲人多矣如先生者耳目口鼻人也所以視聽言動者殆非人也至京師有問之者曰白沙今之孟子也十八年廣東布政使彭韶薦于朝曰國以仁賢為寶臣等自度才德不及獻章萬萬而未見用恐失社稷之寶請以起吳與弼故事起之巡撫朱英復疏薦召至京大臣尼之令就試吏部辭疾不赴越數日赴試至部復以疾驟發辭卒不就試時年五十六懇辭乞終養疏曰臣母以貧賤早寡俯仰無聊殷憂成病老而彌劇使臣逺客異鄉臣母之憂臣日甚愈病愈憂愈憂愈病憂病相仍理難長久臣又以病軀憂老母年未暮而氣則衰心有為而力不逮乞歸養特授翰林檢討疏謝曰臣雖至愚亦知銜負恩德圖報稱于親終疾愈之日不敢負朝廷待士之盛意不敢違臣子效用之初心歸至南安知府張弼問出處對曰康齋以布衣為石亨所薦故不受職求觀祕書冀得開悟主上惜時相不悟以為實然言之上令受職然後觀書殊戾康齋意遂決去某以聽選監生薦又疏陳始終願仕故不敢偽辭釣虛名或受或不受各有攸宜爾自後屢薦不起或勸之著述不答也先生事母林氏甚謹朝夕不離側或在外母有念先生輒心動亟歸果然太夫人頗信浮屠法及病命以佛事禱先生從之既丁內艱服闋絶不衣錦繡人問之曰向者為親娛耳名臣録先生論治道必曰天下非誠不動非才不治必才與誠合而後治可化理學彚編嘗曰吾年二十七始發憤從吳聘君學于古聖賢垂訓之書蓋無所不講然未知入處比歸白沙杜門不出専求所以用力之方既無師友指引惟日尋書册忘寢忘食如是者亦纍年而卒未得焉于是舍彼之繁求吾之約惟在靜坐久之然後見吾此心之體隱然呈露常若有物日用應酬隨吾所欲如馬之御銜勒也體認物理稽諸聖訓各有頭緒來歷如水之有源委也于是渙然自信曰作聖之功其在兹乎林俊曰康齋之有白沙猶李挺之之有邵康節也始求之博久之曰雜矣又求之靜久之曰偏矣雜佛老而超佛老其立志甚専嚮道甚勇涵養甚熟德器粹完脫落清灑獨超萬物牢籠之外而寓言寄興于風煙水月之間蓋有舞雩陋巷之風焉儒林記沈朗思曰隱然呈露常若有物是未見此心體也靜中養出端倪此言極是有病應嗣寅曰白沙全不從下學起不可法也佳按先生之學極似邵子平生不事著述大都寓意于詩究其所自得可謂安且成矣嘗夢拊石琴其音泠泠然見一偉人笑謂曰八音中惟石音為難諧今諧若是異日得道乎因别號石齋晚號石翁𢎞治十三年卒年七十有三萬厯十三年從祀孔廟諡文恭先生疾革知縣佐某以醫來門人進曰疾不可為也先生曰須盡朋友之情飲一匙而遣之許敬菴曰或疑白沙詩教多類禪家話頭余觀白沙先生戲作禪語耳其學自靜中養出端倪所稱亥子中間元神灝氣之説蓋近玄而不近禪得禪之精者王文成先生也理學彚編胡敬齋曰陳公甫言靜中養出端倪又言藏而後發是將此道理來安排作弄都不是順其自然又曰陳公甫亦窺見些道理本原因下面無循序工夫故遂成空見居業録章楓山謂當時人物以陳白沙為天下第一流又謂白沙不免于作詩寫字之間天下學者做誠未至動不得人惟白沙動得人並楓山語録先生訪莊定山定山擕舟送之中有士人滑稽肆談無忌定山怒不能忍幾至厲聲色先生則當談時若不聞其聲及既去若不識其人定山大服鏡人集先生素不與物競鄰人有侵其居地者揚言曰陳氏子我必辱之于途及見不覺自失先生曰尺土地吾當為若讓其人慚而去嘗買婢得邑人尹氏女既而知之嘆曰良家子也命內人撫育如己女及笄擇壻嫁之友人莊昶病遺書求先生門人知醫范規者往視范貧不能赴先生即偹行纏服食津遣與人交無死生炎涼之别都御史朱英柩歸桂陽為文遣子不逺數千里設奠尚書彭韶御史袁道經歷張黻之殁也亦然弔胡榮母喪于新喻祭吳與弼于崇仁羅倫墓于永豐訪莊昶宅于江浦嘗慕先哲宋丞相崔菊坡之為人也迎其像為文祭于家隅坐瞻仰若弟子之于師者久之先生始懼學者障于言語事為之末也恆訓之曰去耳目支離之用全虛圓不測之神其後懼學者淪于虛無寂滅之偏也又恆訓之曰不離乎日用而見鳶飛魚躍之妙門人張翊行狀石翁先生詩曰從前欲洗安排障萬古斯文看日星其本乎曰一笑功名卑管晏六經仁義沛江河其用乎曰時當可出寧須我道不虛行只在人其出處乎所謂吟咏性情而不纍于性情者乎門人李承箕撰序先生澄瑩開朗韻致極髙自遊康齋而心學正友一峰而節概眀友定山而詩學又大進勾押煙霞陶寫風月堯夫之襟度識量髙洪才慮深逺有道之風致而舂容懿醇軒特嶄絶則又叔度之雅與子陵之風焉先生雖不用于時而道風義槩起鄉人而欲動天下廣之風所以大異于疇昔者誰之功天下之士稍知自立而不隨風以靡者又誰之力與使逰濓洛關閩得其微言奧旨侣羣哲會數聖以肩項四子無疑也見素集丘文莊公雅不喜陳白沙大學衍義中有一處譏議異學似乎為白沙發也然公之文學固足以名世而未有以深服白沙之心其卒也白沙祭之以文意殊不滿此殆程子所謂克已最難者也困知記臨川聘君後江門廣其傳靜中見端倪百年無兩賢致虛本自然此語􅗥無前心理兩湊拍如馬入轡韉後來少解事陽眀堪後先用舍雖異趣門户能窺全辟彼子克家才力各有専去世非遼逺瞻望愧聫翩羅念菴間述詩白沙先生人品最髙抱負殊偉言論脫灑善開發人使白沙見用于時做出來必有精采何椒丘張古城胡敬齋章楓山謝方石皆以禪學稱白沙何也夫名依實而立者也茍無其實人安得而名之諸君子多善白沙而名其學如此亦必有所據矣羅整菴答湛甘泉書四端在我無時無處而不發見知皆擴而充之即是實地上工夫今乃欲于靜中養出端倪既一味靜坐事物不交善端何緣發見遏伏之久或者忽然有見不過虛靈之光景耳困知記念菴曰戒慎不睹恐懼不聞此聖門用功口訣也白沙先生曰戒慎恐懼所以防之而非以為害也此為矜持太拘迫者言乃救病之藥不應遽拈平生不就自身緊切處用功而為多言所轉垂老無成正當為戒白沙詩云千休千處得一念一生持于千休之中而持一念正出萬死于一生者也今言休而不提一念便涉茫蕩必不能休言念而未能千休便涉支離亦非真念茍不知念則亦無所謂能休者能念不期休而自休矣文要天然無句是推敲詩到江門品絶髙幾處感花真有此古來周邵本人豪冥心水月誰堪會浣手山泉我自抄讀到鳥啼春在處江山垂老覺神交才力凡今我與翁百年端許自知公橫渠老筆雖終徑周子通書自不同南海巨觥都水月卧林狂句也溪風無緣更許何時約爛醉羅浮四百峰莊定山讀白沙詩有著真無妙無涵萬有粗溺無寧有有泥有定無無口噤癡前夢身勞醉裏扶若為逢有道細與究圖書張東白元禎寄白沙羅一峰曰白沙先生處南海者二十餘年矣觀天人之微究聖賢之藴充道以富尊德以貴天下之物可愛可求漠然無動于其中者又曰富與貴是人之所欲也貧與賤是人之所惡也先生不欲富貴而一于貧賤者何心哉志其大而已矣莊定山謂汪文光曰吾聞南海之山名玉臺者有巨人焉靜而無欲深知所謂之道者子能不勩萬里而往問焉當必有説李承勳曰白沙之學以自得為宗喫緊工夫全在涵養喜怒未發而非空萬感交集而不動李世卿曰先生不著書嘗曰六經而外散之諸子百家皆剩語也故其詩曰他年得遂投間計只對青山不著書又曰莫笑老慵無著述真儒不是鄭康成陳龍正曰白沙終身不仕相知者欲為建一山房終不肯受髙潔之性皭然不滓矣其學近禪其人則儒張東白敘先生為學云自聘君歸後靜坐一室雖家人罕見其面數年未之有得于是迅掃夙習或浩歌長林或孤嘯絶島或弄艇投竿于溪涯海曲捐耳目去心志久之然後有得焉蓋主靜而見大矣由斯致力遲遲至二十餘年之久乃大悟廣大髙眀不離乎日用一真萬事本自圓成不假人力無動靜無內外大小精粗一以貫之先生之學自博而約由粗入細其于禪學不同如此尹直瑣綴録謂先生初至京潛作十詩頌太監梁方方言于上乃得授職及請歸出城輒乘轎張蓋列槊開道無復故態丘文莊採入憲廟實録可謂遺穢青史憲章録則謂採之實録者張東白也按東白問學之書以義理須到融液操存須到灑落為言又令其門人餽遺先生深相敬慕寄詩疑其逃禪則有之以烏有之事闌入史編理之所無也文莊刻深喜進而惡退一見之于定山再見之于先生與尹直相去不逺就令梁方之詩不偽方是先生鄉人因其求詩而與之亦情理之所有便非穢事既已受職乘轎張蓋分之攸宜攬之以為話柄則凡講學者涕唾亦不得矣黃太沖學案白沙要語道至大天地亦至大天地與道若可相侔矣然以天地而視道則道為天地之本以道視天地則天地者太倉之一粟滄海之一勺耳曽足與道侔哉天地之大不得與道侔故至大者道而已而君子得之一身之微其所得者富貴貧賤死生禍福曽足以為君子所得乎君子之所得者有如此則天地之始吾之始也而吾之道無所增天地之終吾之終也而吾之道無所損天地之大且不我逃而我不增損則舉天地間物既歸于我而不足增損於我矣天下之物盡在我而不足以增損我卒然遇之而不驚無故失之而不介舜禹之有天下而不與烈風雷雨而勿迷尚何銖軒冕塵金玉之足言哉或曰道可狀乎曰不可此理之妙不容言道至于可言則已涉於粗迹矣何以知之曰以吾知之吾或有得焉心得而存之口不得而言之比試言之則已非吾所存矣故凡有得而可言皆不足以得言士從事于學功深力到華落實存乃浩然自得則不知天地之為大死生之為變而况于富貴貧賤功利得喪詘信豫奪之間哉為學莫先于為已為人之辨此是舉足第一步夫道無動靜者得之者動亦定靜亦定無將迎無內外茍欲靜即非靜矣故當隨動靜以施其功也治心之學不可把捉太緊失了元初體段愈尋道理不出又不可太慢慢則流于泛濫而無所歸但得心存斯是敬莫于存外更加功大抵學者之病助長為多晦翁此詩其求樂者歟學以自然為宗以忘已為大以無欲為至其觀于天地日月晦眀山川流峙四序所以運行萬物所以化生無非在我之極而思握其樞機端其銜綏行乎日用事物之中以與之無窮送張廷實録天地間一氣而已詘信相感其變無窮人自少而壯自壯而老其歡悲得喪出處語默之變亦若是而已孰能久而不變哉變之未形也以為不變既形也而謂之變非知變者也夫變也者日夜相代乎前雖一息變也况於冬夏乎生於一息成於冬夏者也變之不一而成形也其必有將然而未形者乎默而識之可與論易矣雲潭記周子程子大賢也其授受之旨曰尋仲尼顔子樂處所樂何事當是時也弟子不問師亦不言其去仲尼顔子之世千幾百年今去周子程子又幾百年嗚呼果孰從而求之仲尼飲水曲肱顔子簞瓢陋巷不改其樂將求之曲肱飲水耶求之陋巷耶抑無事乎曲肱陋巷而有其樂耶其亦慎求之毋惑於坐忘也聖賢垂世立教之所寓者書也用而不用者心也心不可用書亦不可廢其為之有道乎仲尼顔子之樂此心也周子程子此心也吾亦此心也得其心樂不逺矣天下之理至于中而止矣中無定體隨時處宜極吾心之安焉耳出處語默咸率乎自然不受變於俗斯可矣天下非誠不動非才不治誠之至者其動也速才之周者其治也廣才與誠合然後事可成也復江右藩臬諸公聘主白鹿書院曰某於聖人之道非直不能至而已其所求於其心措于其躬者亦若存而若亡雖欲自信自止而不可得况以𨗳人哉百鈞之任以與烏獲而不與童子慮勿稱乎力也使之不以其誠任之而過其分與自欺而誤人者其失均耳天下有任大責重而祿位不與者茍能勝之則至大至通無方無體故能為天地立心為生民立極為往聖繼絶學為萬世開太平所謂建諸天地而不悖質諸鬼神而無疑百世以俟聖人而不惑此其分內也宇宙無窮誰當負荷君子之事親也盡其在我者不必其在人者茍吾之所為不畔乎道不愆乎義則其為孝也大矣祿之失得勿計也夫學有由積纍而至者有不由積纍而至者有可以言傳者有不可以言傳者夫道至無而動至近而神故藏而後發形而斯存大抵由積纍而至者可以言傳也不由積纍而至者不可以言傳也知者能知至無於至近則無動而非神藏而後發眀其幾矣形而斯存道在我矣是故善求道者求之易不善求道者求之難義理之融液未易言也操存之灑落未易言也夫動已形者也形斯實矣其未形者虛而已虛其本也致虛之所以立本也戒慎恐懼所以間之而非以為害也復張東白內翰聖賢處事無所偏主惟視義何如隨而應之無往不中吾人學不到古人處每有一事來斟酌不安便多差却隨其氣質剛者偏於剛柔者偏於柔每事要髙人一著做來畢竟未是蓋緣不是義理發源來只要髙去故差自常俗觀之故相雲泥律以道均為未盡君子未嘗不欲人入於善茍有求於我者吾以告之可也強而語之必不能入則棄吾言於無用又安取之學者先須理會氣象氣象好時百事自當此言最可玩味言語動靜便是理會氣象地頭變急為緩變激烈為和平則有大功亦逺禍之道也非但氣象好而已先生欲理會著述及諸外事莫若且打疊令我潔潔淨淨先生平昔所篤信者非朱紫陽乎非全放下是難湊拍是紫陽語否上三書並與羅一峰學勞攘則無由見道故觀書博識不如靜坐與林君終日乾乾只是收拾此而已此理干涉至大無內外無終始無一處不到無一息不運會此則天地我立萬化我出而宇宙在我矣得此欛柄入手更有何事往古今來四方上下都一齊穿紐一齊收拾隨時隨處無不是這箇充塞色色信他本來何用爾腳勞手攘舞雩三三兩兩正在勿忘勿助之間曽點些兒活計被孟子一口打併出來便都是鳶飛魚躍若無孟子工夫驟而語之以曽點見趣一似説夢會得雖堯舜事業只如一點浮雲過目安事推乎此理包羅上下貫徹終始滚作一片都無分别無盡藏故也自兹已往更有分殊處合要理會毫分縷析義理儘無窮工夫儘無窮與林緝熙人要學聖賢畢竟要去學他若道只是箇希慕之心却恐末稍未易湊拍卒至廢弛若道不希慕聖賢我還肯如此學否思量到此見得箇不容已處雖使古無聖賢為之依歸我亦住不得如此方是自得之學心地要寬平識見要超卓規模要濶逺踐履要篤實能是四者可以言學矣接人接物不可揀擇殊甚賢愚善惡一切要包他到得物我兩忘渾然天地氣象方始是成就處士大夫出處去就分眀已占了好田地更能向學求向上一著不枉費浮生嵗月豈不抵掌為之三歎乎為學須從靜中坐養出箇端倪來方有商量處若未有入處但只依此下工不至相悮未可便靠書䇿也上與賀克恭人心上容著一物不得才著一物便有礙是以聖賢之心廓然若無感而後應不感則不應又不特聖賢如此人心本來皆一般只要養之以靜便自開大人須有逺大見識方做得逺大事業如為學要積纍然後可望發越若朝作而暮改鋭始而怠終方其發憤之初意氣之盛真若可以凌駕古今平步聖途及其衰也志索氣餒忽如墜千仭之淵所守只是恆人此無他無逺大見識又無積纍嵗月平日激昻以為之者特一時好名之意氣耳安能保其久而不衰耶佳按一廢弛即求為恆人而不可得讀此須當猛省然如先生之教亦易鋭始而怠終蓋無程朱循序之功不深造之以道而惟求其自得則人靜坐幾時孰無恬愈之境而無所依據卒至衰息亦所必至矣人爭一個覺才覺便我大而物小物盡而我無盡夫無盡者微塵六合瞬息千古生不知愛死不知惡尚奚暇銖軒冕而塵金玉耶禪家語初看亦甚可喜然實是儱侗與吾儒似同而異毫釐間便分霄壤此古人所以貴擇之精也起腳一差立到前面無歸宿凖的便日用間種種各别不可不勘破也前輩謂學貴知疑小疑則小進大疑則大進疑者覺悟之機也一畨覺悟一畨長進其初學時亦是如此更無别法即此便是科級學者須循次而進漸到至處耳只平生問學一事極索理會不可悠悠人一身與天地參立豈可不知自貴重日與逐逐者伍耶某更無他惟是一味守此益信古人所謂自得者非虛語神理為天地萬物主本長在不滅人不知此虛生浪死與草木一耳伯幹病至此當大為休置縱未灑脫地亦漸省得些撓亂幸而天年未盡神理日著非小益也名節道之藩籬藩籬不守其中未有能獨存者也大抵吾人所學正欲事事點檢今處一家之中尊卑老少咸在才點檢著便有不由己者抑之以義則咈和好之情于此處之必欲事理至當而又無所忤逆亦甚難矣人未死前一日誰肯信著此事終日勞勞而不自足及至死時便無可主張亦可悲也已學無難易在人自覺耳才覺退便是進也才覺病便是藥也道不眀雖日誦萬言博極羣書不害為未學道不行雖普濟羣生一匡天下不害為私意疑而後問問而後知知之真則信矣故疑者進道之萌芽也信則有諸已矣論語曰古之學者為已著些利害不免開口告人此淺丈夫也伊川平生與東坡不合至於成黨自來未嘗向人道及真無愧于斯言矣人所得光隂能幾生不知愛惜漫虛擲卒之與物無異造物所賦於人豈徒具形骸喘息天地間與蟲蟻並活而已耶浮屠氏雖異學亦必以到彼岸為標凖學者以聖人為師其道何如彼文章功業氣節果皆自吾涵養中來三者皆實學也惟大本不立徒以三者自名所務者小所喪者大雖有聞于世亦其才之過人耳其志不足稱也學者能辨乎此使心常在內到見理眀後自然成就得大論語曰朝聞夕死可矣孔子豈欺我哉天下未有不本于自然而徒以其智收顯名於當年精光射來世者也易曰天地變化草木蕃時也隨時詘信與道翺翔固吾儒事也忘我而我大不求勝物而物莫能撓孟子云我善養吾浩然之氣山林朝市一也死生常變一也富貴貧賤夷狄患難一也而無以動其心是名曰自得自得者不纍於外物不纍於耳目不纍於造次顛沛鳶飛魚躍其機在我知此者謂之善學不知此者雖學無益也豫書每於動上求靜放而不放留而不留此吾所以妙乎動也得志勿驚厄而不憂此吾所以保乎靜也法而不囿肆而不流拙而愈巧剛而能柔形立而勢奔焉意足而竒溢焉以正吾心以陶吾情以調吾性此吾所以逰于藝也書法易所謂復其見天地之心乎此理洞如然非涵養至極胸次澄徹則必不能有見於一動一靜之間縱百揣度祗益口耳所謂何思何慮同歸殊途百慮一致亦必不能深信而自得也人具七尺之軀除了此心此理便無可貴渾是一包膿血裹一大塊骨頭飢能食渴能飲能著衣服能行淫欲貧賤而思富貴富貴而貪權勢忿而爭憂而悲窮則濫樂則淫凡百所為一信氣血老死而後已則命之曰禽獸可也子之養其親期於適焉耳茍至于適雖聖人不能以有加也遑問其他具足乎內者無所待乎外性於天者無所事乎人又非但事親一事為然也七情之發惟怒為遽衆逆之加惟忍為是絶情實難處逆非易當怒火炎以忍水制忍之又忍愈忍愈勵過一百忍為張公藝不亂大謀其乃有濟如其不忍傾敗立至忍字贊天道不言四時行百物生焉往而非時之妙用會而通之一真自如故能樞機造化開闔萬象不離乎人倫日用而見鳶飛魚躍之機知廣大髙眀不離乎日用求之在我毋泥見聞優遊厭飫久之然後可及也夫人生幾何徒以難得之嵗月供身外無益之求弊弊焉終其身而不知悔惜哉以無著之心行於天下亦焉往而不得哉朋友求可與言者不可得世味之移人者不少大者文章功業然亦為道之障為其溺也古人棄糟粕糟粕非真傳眇哉一勺水積纍成大川亦有非積纍源泉自涓涓至無有至動至近至神焉發用兹不窮緘藏極淵泉吾能握其機何必窺陳編學患不用心用心滋牽纏本虛形乃實立本貴自然戒慎與恐懼斯言未云偏後學不省事差夫毫釐間寄語了心人素琴本無弦答張東白白髮孤燈坐青春二妙來若無天度量爭得聖胚胎至樂終難説真知不著猜濛濛煙雨裏歸思若為裁贈黎蕭二生别賢聖低佪久千年想一臨希顔非樂道疑孟失求心逸駕行應速寒泉汲務深嘗聞根本學不盡泰山岑再示諸生半屬虛空半屬身絪緼一氣似初春仙家亦有調元手屈子寧非巨眼人莫遣塵埃封面目試看金石貫精神些兒欲問天根處亥子中間得最真不著絲毫也可憐何須息息數周天禪家更説除生滅黃老惟知養自然肯與蜉蝣同幻化祗應龜鶴羡長年吾儒自有中和在誰會求之未發前羅念菴曰此白沙無心於言也信口拈來自與道合雖欲靳之有不可得閲窮載籍終無補坐老蒲團亦是枯定性未能忘外物求心依舊落迷塗劉念臺曰只無欲二字直下做到聖人濓溪是已後到白沙亦于此有得白沙詩曰無極老翁無欲教一畨拈動一畨新時時心氣要調停心氣工夫一體成莫道求心不求氣須教心氣兩和平收斂一身調息坐要貪真靜入無為脫然心境俱忘了一片圓融大可知羣賢列聖無他適百偽千邪向此消須向一原觀體用靈根著土發靈苖工夫須用寬而敬魚躍鳶飛在此間不用苦心求大迫轉防日用自生難飽厯冰霜十九冬肝賜鐡樣對諸攻羣譏衆詆尋常事了取男兒一世中羅念菴曰此詩自敘在成化癸巳嵗時先生四十有六蓋其自得久矣顧收斂歸靜若初入室然者晦不久則光大不固先生進道之因也今學者既乏靜専又易發露欲與古人上下烏可得哉嵗有薦辟援詔不行曰漆雕開以孔子為的者也茍其未信師不能強吾自知甚眀惟有飭厲素履庶幾丘園之義少禆眀時耳及門之士有嘉魚李承箕番禺張詡增城湛若水東莞林光皆能紹明之臨沒謂其徒曰道止如此無他求也張詡稱先生之學繇知而好繇好而樂而承箕銘其墓曰虛以立本動而能神凝而涵之天飛淵淪李承箕字世卿為諸生已厭科舉之學矣所司迫蹙不得已就試成化中與其兄承芳同舉鄉薦久之承芳登進士授官大理承箕獨不肯會試從白沙受業涉江浮海水陸萬里往見者四白沙與之登臨弔古賦詩染翰投壺飲酒終不及為學之方久之辭歸白沙送之文曰天地間耳目所聞見古今上下載籍所存吾無不與世卿語所未語者此心通塞往來之機生生化化之妙待世卿深思而自得之也承箕為人凌邁髙逺讀書山中故超然有混濁寰宇之意及歸自白沙日坐一室洗滌身心不以著述自見曰近世箋注繁蕪郢書燕説鼎沸絲棼思一剗去之不得而更推波助瀾乎客至與劇飲賦詩醉起更書斜整無不如意其為文辭出入經史縱橫跌宕滚滚不休久之承芳謝歸大理相與日聚黃公臺更唱迭酬伯仲間自相師友學者稱承芳曰東嶠先生承箕曰大崖先生年五十餘無疾終儒林記張詡字廷實登成化甲辰進士養晦六年部檄起之乃授户部主事復謝病歸從白沙學亦受其詩法白沙與語每喜其玄微有會為人清虛髙邁忘已無欲論學以敬畏為宗曰無所事乎畏則怠而入于忘必先有事乎此然後浴沂風雩在勿忘勿助之間者可漸至而深得也辭疾隱居二十餘年既用薦起南京通政司參議辭歸林光字緝熙成化中領鄉薦任襄府左長史初不即仕誅茅欖山杜門而求朱考亭之學白沙與語終日乾乾收拾此而已矣此理包羅上下貫徹終始都無分别都無盡藏會此者天地我立萬物我出而宇宙在我矣曾點浴沂風雩正在勿忘勿助之間光恍然有得白沙書其所記以貽賀欽而畨禺復有何廷矩者棄諸生業率諸士首先事白沙在白沙門徒中長而且賢其厲學若負重進進而不敢懈休又有廣州布衣李孔修字子長南海謝祐字天錫皆白沙弟子霍韜曰白沙抗節振世之志惟子長張詡謝祐不失湛若水甘泉先生文簡公陳白沙弟子字元眀廣東增城人𢎞治乙丑進士仕至兵部尚書從白沙先生遊即以隨處體認天理為宗白沙曰此子參前倚衡之學自是潛心默會日有所得赴南雍祭酒章懋試睟面盎背論甚竒之乙丑會試學士張元禎楊廷和主考撫其卷曰此非白沙之徒不能為擢編修時陽眀王公在吏部相與倡道京師學者稱甘泉先生嘉靖初升南國子監祭酒開講院與諸生論學刻心性圖説升禮部侍郎先後有勤聖學疏凡數十上總為獻納編又倣大學衍義補作格物通以進遷南兵部尚書致仕所著有遵道録樵語古文小學四書測等書平生志篤而力勤無處不授徒無日不講學從逰者殆遍天下所論以自然為本體以勿忘勿助為工夫大抵得之師門為多白沙嘗謂曰人與天地同體四時行百物生若滯一處安能為造化之主善學者常令此心在無物處便運得轉耳學以自然為宗不可不理會又示以詩曰天命流行真機活潑水到渠成鳶飛魚躍等語其得于指授者如此卒年九十五有大星隕于廣州之河南其聲如雷云先生嘗曰昔年讀書西樵山曽聞士大夫多宗象山象山宇宙性分同此心同此性等語皆灼見道體之言以象山為禪則吾不敢以學象山而不至于禪則吾亦不敢蓋象山之學雖非禪而獨立髙處夫道中而已矣髙則其流之弊不得不至于禪故一傳而有慈湖慈湖真禪者也後人乃以為逺髙于象山吾以象山過髙矣慈湖又逺髙之焉是何學也學者欲學象山不若眀道或問曰心不同乎曰否曰立心有異乎曰然然則心有內外乎曰心無內而有靜心無外而有動故動者外之機其流也為人靜者內之機其實也為己為人者務外為己務內務外者妄動之謂也務內者主靜之謂也動靜之機內外人己之門也然則如之何曰動乎動而不離于靜故不流如何曰靜乎靜而不離于動故能實藏心于晦發而愈眀神之貞也役志于明久而滋晦神在外也夫道無內外內外一道也心無動靜動靜一心也故曰知止而後有定夫茍至于有定則動亦定靜亦定而內外忘矣人之有心莫不有知覺不能不動而為情外物觸其情而交焉莫知所止天理滅矣人之有形不能無視聽言動也在勿之而已故終日酬應而吾有主焉非置其身于無物之地而後能靜定也若惡動以求靜則有時而動矣何者動係于念不係于事也知此斯可以悟性矣是故與其習靜以養動不若慎獨以養靜慎獨以養靜不若動靜之皆忘時靜時動察見天理而存養之此豫之所得力也羅整菴曰嘗得湛元眀所著書數種觀其詞氣格力甚類揚子雲蓋欲成一家言爾然元眀自處甚髙自負甚大子雲豈其所屑為哉區區之見多未合恨無由相與細講以歸于至一一隂一陽之謂道吾夫子贊易語也元眀云自其一隂一陽之中者謂之道然則聖人之言亦容有欠缺處耶殆不然矣困知記下同格物通近方見之不意其侮聖言一至于此嘉靖初上經筵講疏曰聖學之大莫過求仁易曰君子體仁以長人仁本以天地萬物為一體者也伏惟聖眀全體物之仁玩取身之義立大公以普天下疾痛疴癢無不相關使天下後世頌為至仁之主臣不勝願望一日侍經筵進講大學先慎乎德章退復申眀要旨以勸聖學謂聖學莫大知要臣所講章其詞雖多不過止在體認天理四字至為簡易易行體認天理即所謂慎德大學一書盡在是矣時朝廷初政方新讜言日進而近習漸幸災變頓仍公疏言陛下龍飛水國習知舟事臣請以舟喻諺曰同舟共濟天下一大舟也人主一心舟之柁也公卿賢士輔𨗳之臣運籌指方舟之長年三老也百僚宣力篙師榜人為之左右也內臣外戚附舟之人也天下民臣實為邦本君之寶貨在載也附舟之人與寶貨之利害在舟舟之安危在柁柁之張弛在長年三老之操縱而篙師宣力與否也舟危則凡在舟者無不危舟安則凡在舟者無不安恃寵壞法以敗人家國如同舟之人鑿舟而破之自以為安鮮不先溺今陛下不急親儒學之臣不聞正心之術乾剛未奮宰制不施初政漸衰近習蒙蔽天戒屢見不實修省臣工交章未或舉行臣恐柁漸弛矣左右親信之人蠱惑上心不引以聲色則引以異教親戚希無厭之賞近幸奪法司之獄刑賞僣差紀綱廢弛是同舟之人鑿舟而破之者也大臣見斥則將相繼求去如尚書林俊孫交者百僚視之人懷危心是猶長年三老篙師榜人引去而誰與宣力者天下萬民其誰與濟臣實痛心渺乎不知舟之危也升南國子祭酒陳言六事大率不離科舉之制而本之以德行道藝寓之以鄉舉里選闢觀光館居四方來學公退相與論學其中升禮部左侍郎時上方稽古制南北分祀禮成視榖西苑祗先蠶壇位公獻聖主躬肇農桑頌及西苑賦因進天德王道疏君臣同遊雅詩精誠懇切必欲啓沃上心勉行敬天勤民之實興道致治以回三代隆平之風上覽疏多溫旨嘉納佳按甘泉在當時即不為羅整菴諸先生所許所著聖學格物通其訓格物取扞格物欲之義言致知在所養養知莫善于寡欲此説已經朱子駁過辨之或問甚詳則大指已誤餘尚何論哉余尤不喜其所至建書院也史桂芳惺堂先生字景實江西番陽人嘉靖癸丑進士官至兩浙鹽運使初嶺表鄧德昌白沙弟子也以其學授傅眀應先生讀書白鹿洞傅一見竒之曰子無事豪舉為聖門有正學可勉也手書古格言以朂先生戄然嚮學之意自此始其後交近溪天臺在歙又與錢同文為寮講于學者日力為南京刑部主事晉郎中時談者以解悟相髙先生取行其所知而止不輕信也其學以知恥為端以改過遷善為實以親師取友為佽助若夫抉隱造微則俟人之自得不數數然也天臺曰史惺堂苦行修持人也天臺督學南畿先生過之卒然面質曰子將何先天臺曰方今為此官者優等多與賢書便稱良矣先生厲聲曰不圖子亦為此鄙語也子不思如何正人心挽士習以稱此官耶拂衣而起天臺年家子宜黜而止先生曰此便是腳根站不住天臺行部值母諱日供張過華先生過見之勃然辭去謂天臺曰富貴果能移人兄家風素朴今改觀矣其直諒如此先生守汝寧與諸生論學諸生或謁歸請益即輟案牘對之刺刺不休談畢珍重曰慎無辨髦吾言也激發屬吏言辭慷慨遂平令故有貪名聞之流涕翻然改行郡有孝女不嫁養父先生躬拜其廬民俗為之一變其守延平七日憂去而盡革從前無名之費若先生者不徒講之口耳矣賀欽醫閭先生白沙弟子字克恭世為浙之定海人以戎籍𨽻遼義州衛成化丙戍進士仕至參議少頴敏沈厚好學不倦偶得近思録朝夕玩讀得其旨要遂厭俗學而學焉授户科給事中成化四年旱災抗疏極諫謂此時逰樂是為樂憂復以言官曠職召災自劾一介之饋非義不受取孔子鄙夫之言題于壁上數拉僚長言事僚長不言乃自言之白沙在太學先生見其論學嘆曰至性不顯寶藏猶霾世即用我而我奚以為用遂執弟子禮事白沙上疏解官去既别畫像懸室中事之甚謹白沙嘗謂曰君言議侃侃無露鋒鋩乎要須和平沈深先生輒用自戒遍書其語于目前必期至是乃己泰陵初薦授陜西參議以老病母憂上疏懇辭且陳四事一資真儒以講聖學謂今日急務莫先于講學而經筵勸講之官所謂師友之臣尤當訪求真儒以充其位二薦賢才以輔治道謂陳獻章天性髙眀學術醇正誠當世之大賢為士大夫之矜式宜以非常之禮起之或任內閣俾參大政或任經筵使養君德三曰遵祖訓以處內官內官不可使職掌奏牘得預大政外不可使鎮守地方掌握兵權四曰興禮樂以教化天下謂陛下紹基之初寵黜浮屠妄誕之邪舉行朱子喪葬之禮但初政之施方發其端而頺敗之俗尚仍其舊乞申明正禮之當行革去教坊之俗樂疏入報聞允公辭有邉將詐誘殺為陳獲者見先生即吐實曰不忍欺也正德己巳逆瑾括民田東人思亂義州以守臣貪故遂先發衆縱火行劫城中大擾然相戒曰母入東街驚賀黃門先生聞往諭之曰渠輩知悔乎眀日體勘人來須乞求生耳慎無殺人己而鎮撫人果至俄聞發軍捕勦衆復呼噪再往問之先生曰城中被爾等擾亂若此其發兵固疑兵雖至爾等第不殺人無害也衆即羅拜而泣曰吾父也遂解散數日竟如其言城中不傷一人先生稟學白沙遂淡然于富貴故天下議白沙率人于偽牽連而不仕則以先生為證搆小齋讀書其中隨事體驗未得其要潛心玩味杜門不出者十餘年乃見實理充塞無間化機顯行莫非道體事事物物各具本然實理吾人之學不必求之髙逺在主敬以收放心勿忘勿助循其所謂本然者而已故推之家庭里閈間冠婚喪祭服食起居必求本然之理而力行之久久純熟心迹相應不期信于人而人自信嘆曰萬古聖賢惟此一理深契力行同歸無二遂推所得以淑諸人先生真切懇到専讀五經四書小學靜思默識反身實踐佛老莊列不以寓目其虛懷誠受見善不及人人愛而敬之冠昏喪祭遵用家禮每教人讀白鹿洞規小學鄉人由是興于行義老更好易究心象數手不釋卷正德庚午卒年七十四鄉人祠之凌溪釣臺言行録賀醫閭篤行淵雅確乎不易亦管幼安之流亞與教人惟主小學逹序矣松窗晤言白沙與書曰三十年妄意古人之學衆説交騰如水底撈月恨不及與克恭論之詩教先生最喜教童子曰為其染俗未深而去道不逺也見間録賀克恭在憂中辭參議之命不受極論內侍力薦白沙幾至得罪而浮議已紛紛矣鄒智與劉汝德書陳士賢初擢御史賀克恭初擢給事中皆辭不願受以難盡其職也後二公竟做出好來楓山語録嘗曰學之無成政教之不舉風俗之不美世道之不泰皆由本蹶實喪而崇事虛彌耳其由朱子以入孔顔之途真謂學脈可尋而正大光眀之心篤信謹守之意可質鬼神而無疑者也陳白沙與先生書曰歸去遼陽杜門後可取大學西銘熟讀求古人為學次第規模實下工夫去做黃卷中自有師友惟及時為禱按白沙後來勸克恭讀佛書克恭不答克恭子咨有書疑辨白沙亦未之答湛甘泉問白沙曰克恭篤信謹守人也别二十年其守如昨又問白沙曰吾子不聞程子謹禮者可令讀莊列之書乎與此書不類白沙又詩曰一封初展制中書萬里遼天見起居何處江山還著我斯文今古正關渠傷心入夜思賢母老眼當年識鳳雛濓洛諸公傳不逺風流衣鉢共團蒲佳按衣鉢團蒲雖喻言畢竟雜引未妥又寄乃子咨詩曰耳目無交不展書此身如在太清居雪消爐熖冰消日月到天心水到渠一一園花都傍暖飛飛江燕未將雛好春好伴須行樂束起松根七尺蒲公子咨博學篤行領鄉薦嘗陳王政十二事不報終身不仕先生言行録曰白沙後有書來謂其前時講學之言可盡焚之意有不自滿者門人於衢路失儀先生曰為學須躬行躬行須謹慎隱微小小禮儀尚守不得更説甚躬行于顯處尚如此則隱微可知矣下俱輯醫閭先生言行録有來學者學些人事也好先生曰此言便不是矣人之所學惟在人事舍人事更何所學善惡雖小須辨别如覩黑白問靜極而動者聖人之復豈常人之心無有動靜乎曰常人雖當靜時亦不能靜此理無處不有無時不然人惟無私意間隔之則流行矣古之政事學問一貫事耳令人學自學政自政判而為二故所學徒誦説而已未嘗施之政事政事則私意小智而已未嘗本之學問也故欲政事之善須本之學問為學之要在乎主靜以為應事建功之本讀書須求大義不必纏繞于瑣碎傳注之間世風不善豪傑之士挺然獨立與俗違拗方能去惡為善人於富貴之關過不得者説甚道理驕惰之心一生即自壞矣今之讀書者只是不信故一無所得事之無害義者從俗可也今人以此壞了多少事先生每言後世之人知遷善改過即可與之有為嘗欲取古人改過成身者録為一帙以化鄉閭竟未果也一人欲行家禮乃自疑曰我家無秀才奈何先生曰家無秀才無人倫乎若用佛教則家有和尚乎其人遂服或以吳文正學統學基為問先生曰聖賢氣象不如是也觀論語可見韓文公上宰相書亦甚陋矣謝疊山却還稱他善占地步已是放倒旗槍更説占地步耶問古人數世同居者其廟制當如何曰此不難處既立繼髙祖之宗所奉祀之廟於中却于其旁其後别立祠堂以為其餘繼祖禰小宗等奉祀使之各主其祀外則合為一垣四時之祭以次行禮如此方為得宜若只合祀于一處便只是茍且將就必不能得停當矣因論為學之道嘆曰人須是信方可望不信則心不相符決無所成草廬看來只是聰眀博學躬行切實意思少故其出處著述皆有可議今要躬行須先以敬為主今後放曠之言放曠之事便須收拾起方可望進鄒智立齋先生白沙弟子字汝愚四川合州人成化丁未進士謫吏目公生而頴敏過人年十二能文章經史一目即不忘嘗居龍泉菴貧無膏油掃樹葉焚之以照讀書逹旦如是者三年文思警拔千言立就改庶吉士翰林會星變應詔陳言極論隂陽之理言少師萬安持祿怙寵殊無厭足少保劉吉附下罔上漫無可否太子少保尹直挾詐懷姦全無亷恥世之所謂小人也南京兵部尚書王恕託志忠勤可任大事兵部尚書致仕王竑秉節剛徑可寢大姦直𨽻巡撫右副都御史彭韶學識醇正可決大疑世之所謂君子也乞盡斥小人而進用君子又言君子所以不進小人所以不退大抵宦官隂主之疏入不報並鄭端簡名臣記𢎞治三年御史湯鼐劾萬安劉吉尹直萬尹去劉留恨鼐御史魏璋附劉啖璋能去鼐升僉都御史璋即草疏署陳景隆等名劾鼐與夀州知州劉概妄言朝政嫉公者因入公名下詔獄公身親三木僅餘殘喘神色自若無所曲撓獄官苦訊公公書詞曰智與今湯鼐等來往相會或論經筵不宜以大寒大暑輟講或論午朝不宜以一事兩事塞責或論紀綱廢弛或論風俗浮沈或論生民憔悴無賑濟之䇿或論邉境空虛無蓄積之具當事恨公坐公鼐槩妖言惑衆罪死刑部侍郎彭韶辭不判徐文靖公亦力言吾輩不可使朝廷有殺諫臣名獲免左遷廣東石城所吏目鼐謫戍河西公既謫毅然就道衣結屨穿幾不能存親識饋遺堅却不受至石城視事甫兩月廢政􅊖舉總督都御史秦紘檄遣董鹺修書得居廣城友白沙順德令吳廷舉于古樓村建亭居之扁曰謫仙其父來視責以不能祿養箠之泣受四年十月暴疾卒年二十六廷舉治其喪所著有立齋遺稿佳讀先生欽崇天道諸疏其毅然必為君子無疑矣惜當時不能用之而卒竄身以沒悲夫要之先生能出之以深潛養之以沈厚早得白沙而從事焉其年與德當不止是也夫吏部尚書王恕徴至京公曰三代而下人臣不獲見君事多壅蔽願公勿受職先請見君厯陳政事可否于前庶其有濟一受職再無可見之時矣端毅善其言卒莫能用也崔銑撰傳公鄉舉會試道經三原時尚書王恕致仕公見之且曰治道在進君子退小人方今小人在位羣邪肆毒此行非但會試正欲上疏天子使進君子退小人則天下其庶幾乎恕笑而不答通紀公詩人到白頭終是盡事垂青史定誰真夢中不識身猶繫又逐東風入紫宸又進朝詩盡披肝膽知何日望見衣裳只此時但願太平無一事孤臣萬死更何悲孝宗即位眀日當朝御史湯鼐侍班糾儀公告曰祖宗朝御史糾儀得面陳政事得失近年遇事惟退而具本此君臣之情所由間隔不通也公以言官奏對幸直大政維新之日請效故事此太平機會也鼐不能用見聞録公慷慨負竒一時御史湯鼐中書舍人吉人進士李文祥皆與公善並以進賢退不肖持論見浮沈世事輒叱罵之敬皇帝登極舊政一新鼐等劾免萬安尹直遂誇詡謂君子已進小人已退劉吉嗾魏璋去鼐等會左庶子張升劾吉十罪璋與給事韓重交劾升坐左遷更日夜伺鼐因掇拾鼐概所言夢誣以誹謗因入公名王恕何喬新皆為概訟得減死公與文祥等謫戍佳按此則端毅不答其言正所以抑其躁也先生奉書白沙曰克修書來問東溟幾萬里江門未盈尺妄以道沖而用之不盈之意答之未知先生之意果然耶不然則作者為郢書解者為燕説矣京師事智自知之但先生所處是陳太丘栁士師以上規模晚生小子腳根未定不敢援以為例耳然亦當處之際不至露圭角也朱子答陳同父書顔曽子以納甲推其命正得震之九四先生所推與之合耶果若此爻其于朱子何所當耶幸教過閩蔡介夫清贈詩曰此行如逰學十年觀造詣炎荒無友生神交方遜志方居石城有順德人鍾曉師事之後厯御史知府卒有立以風節稱陳茂烈白沙弟子字時周福建莆田人𢎞治丙辰進士仕至御史以母老乞終養旌為孝亷公先世浙之瑞安人戍藉興化遂居郡梅峰公髫年喪父繼戎役勵志邁俗不與羣兒伍晝入公署夜歸讀書祖母憐其孱弱亟止之乃韜燈默誦不少輟年十八慨然嘆曰善學聖人者莫如顔曽顔之克已曽之日省豈非學之法與作省克録以自考登進士奉使廣東所司以故事致贐謝曰吾窮時嘗授徒兩臬司尚不規利于人况今日耶往拜陳白沙執弟子禮白沙與語纍日甚喜告以為學須靜一退作靜思録終身佩其教為吉安推官持大體開至誠通以民彛之懿豪家利寡婦財誣許婚斷從守志夫制于悍妻嫁有娠妾既生子歸承其業族人爭之驗與姊類爭者愧服時守張本以嚴擊豪強徐輔以寬當道尚深刻徐開解為霽信孚上下考績歸至淮乏寒具凍幾絶所知覆以敝裘得不死為監察御史袍服朴素借騎一牝馬身若無官者有尚書似公子受賂崔志端以道士起家皆根植自固言者屢劾不動先生再劾似去而崔猶留遂以母老乞終養灌園萟蔬大守閔其勞遣二力助汲閲三日往白守曰是使野人添事而溢口食也還之力供甘旨短床敝席不辦一蚊帳身治畦一蒼頭給薪水出則自執小油蓋妻子服食粗糲皆人所甚不堪而泰然自足日坐斗室究極五經四書之旨體驗身心隨得隨録常曰儒有向上工夫詩文特土苴耳林俊撰墓志正德中吏部以公養母清苦奏改為晉江教諭資其祿疏辭不拜既又援侍郎潘禮例奏給月米制曰陳茂烈清苦可嘉著有司月給米三石以資孝養又疏辭曰陛下隆孝理之化長清白之風下逮微臣亦荷收恤豈獨臣一家之幸而已苐念臣家素貧寒食本儉薄故臣母自安于臣之家而臣亦得以自遣其貧非誠有及人之亷盡已之孝也古人行傭負米皆以為親臣之貧尚未至是而臣母鞠臣守貧居寡艱苦獨至臣雖勉盡心力之義竟未酬涓滴之恩且臣母年已八十有六來日無多返哺至情固欲自盡資養月米心竊不安奏上不允制曰朝廷以孝治天下陳茂烈既家貧親老月米資養不準辭公以母年九十未有嗣息日夜為憂方抱疾而母卒強起號哭寢地疾轉亟卒林見素治殮且立其族子逺揚為後都御史王應鵬薦公亷約如石守道而所養獨純孝行如徐仲車而所處尤困詔表宅里曰孝亷恤其家見素曰陳公領悟既深而充養亦熟隱衷粹行對天地質鬼神鄉國敬服殆黃憲管寧之流也名臣言行録鄭端簡曉論曰黃伯固鞏陳時周茂烈二公皆莆産忠潔足以明志孝亷足以存節究其用經濟才也孰非人臣孰非人子觀者能無深省乎韓貫道嘗問林待用以莆田人物曰從吾謂彭方伯韶也又問曰陳時周時公方為諸生韓太息曰人物如莆君再屈指詎乃一書生耶林曰時周俊每接晤言躁慮消釋宿疾為頓愈寶善類編公清苦剛狷貧甚自操井臼有人候之見其自運榖入室其妻妹夫林某歸宦槖頗厚茂烈過之林曰君見吾室宇得無笑之耶公曰吾貧公富皆命也吾安吾命而已何笑為稗史彚編陳白沙曰韓退之稱孟東野無田而衣食事親左右無違混混與世相濁獨其心追古人而從時周有之矣又謂時周平生履歷之難與已同而義過之求之古人如徐節孝者真百錬金孝子也何維柏端恪公字喬仲廣東廣州人嘉靖乙未進士仕至南京禮部尚書少遊三水庠見同舍生臨祭而謔輒引避以為辱已衆皆愧服嘗慕西樵泉石之勝負笈讀書其中值湛文簡若水霍文敏韜亦山棲與語多所默契選庶吉士授御史疏止沙河功德二役省費百萬再疏罷征安南極論毛尚書伯溫奪情上亦納之尋病歸西樵與劉模王漸逵王激衷往來論學復補御史按八閩賑恤飢民存活計數十萬因條救荒十䇿著為令首發少師嚴嵩罪狀比之李林甫廬杞上震怒遣官逮繫所過士庶遮道攀留緹騎持之益急諸生大哭公謝曰此豫慮定而後發人臣之義自當如是何哭為逮至幾死杖下竟削籍歸屏居僧舍聚徒論學隆慶改元復原官屢遷至左副都御史協理臺務萬厯初轉吏部侍郎前後疏請修聖德勤聖學飭羣工語多切中會少師張居正遭喪奪情衆議保留尚書張瀚私叩之答曰天經地義何可廢也語泄見忌出為南京禮部尚書次潞河遂乞歸角巾野服恣逰名山闢天山書院聚講發眀白沙宗旨薦紳之士即皓首猶北靣就弟子列卒諡端恪所著有易學義禮經辨太極圖解天山存稿及編陳子言行録行於世眀儒言行録卷三
