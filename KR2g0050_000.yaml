body:
  text: 明儒言行録傳記類三總録之屬提要臣等謹案明儒言行録十卷續録二卷國朝沈佳撰佳字昭嗣號復齋仁和人康熙戊辰進士官安化縣知縣是編仿朱子五朝名臣言行録之例編次有明一代儒者各徵引諸書述其行事亦間摘其語録附之所列始于葉儀迄于金鉉凡七十五人附見者七十四人續録所列始于宋濂迄于黃淳耀凡五十九人附見者九人佳之學出于湯斌然斌參酌于朱陸之間佳則一宗朱子故是編大旨以薛瑄為明儒之宗於陳獻章則頗致不滿雖收王守仁于正集而守仁弟子則刪汰甚多王畿王艮咸不預焉其持論頗為謹嚴初黃宗羲作明儒學案採托最詳顧其學出于姚江雖于河津一派不敢昌言排擊而于王門末流諸人流于猖狂恣肆者亦頗為回護門户之見未免尚存佳撰此録蓋隂以補救其偏鄞縣萬斯大宗羲之弟子也平生篤信師説而為佳作是録序亦但微以過嚴為説而不能攻擊其失蓋亦心許之也學者以兩家之書互相參證庶乎有明一代之學派可以得其平允矣正不必論甘而忌辛是丹而非素也乾隆四十五年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀眀儒言行録原序暇時嘗與開先赤師昭嗣燕集偶論史事見開先言諸史甚􅊖余言向有十七史今又增五史矣設復如宋人制科出題兼十七史不亦難乎記誦繁多足為心纍亦目力鮮及吾人史學大抵通鑑綱目與文獻通考兩書足矣既又念古人嘉言懿行在于諸史者甚富不可不知唯宋朱子有名臣言行録一代偉人載之為詳若得友人有心者取歷代言行各編成書則其餘逆亂之紀諧笑之資皆可廢矣是時諸友頗以為然余歸家思言行一録在漢為易在眀為難明時雖有為之者其去取登削無甚發明又向無全史諸書難備余家寡書為之少力唯漢人言行􅊖在班馬范陳四史就而輯之為功差易余為之粳粃庶有是其説者從而繼之乎因是輯之歷年苦于繕寫竟未迄有成一日見昭嗣袖中出書則明儒言行録也余不勝驚喜以為余雖言之而行之未力昭嗣默然不言而書已告成凡事類如此及觀其書有正集有續集去取之間至慎也大約以敬軒為宗而諸儒繼之有所不足仍載先儒之言以為斷甚不得已始出已説以微示其旨至陽眀之學則行之已久其中從是興起力行可畏者不乏其人仍兩為存之録緒山念菴而不録龍溪心齋皆有深意可謂簡嚴矣然余猶懼其少以為不若稍增載之使後無可加則尤為備矣昭嗣以為然更博採諸書以􅊖論之嗚呼此書既成而復有經濟節烈名臣繼之則一代之言行豈有遺憾乎抑昭嗣之為此書非徒如余意存史而已殆如伊洛淵源蓋以為力行理學之先劵也余于此又有感焉有明承宋理學既明之後一代能文之士不少如王唐瞿薛理學非不善言也而是録之所載曽不之登則儒者之所貴不亦大可見乎昭嗣之發余多矣應撝謙序蓋聞通天地人之謂儒則儒也者雖為學者之通稱而實聖賢之極則苐以學者之所學在是故凡為學者亦得以儒命之余嘗上下古今而嘆儒者之於世蓋因時而為救者也堯舜禹湯文武儒而君者也皋夔稷契伊傅周召儒而相者也其時道統尊於上德化翔洽民風湯穆害道者無或一出其間故虞夏商周之書所記者皆其政治而歷聖之道法以存不必多為之説也世降而衰以至春秋王迹熄霸術興功利中乎人心道統之傳不在君相而在學士學士遂専以儒稱而其時之儒亦遂有君子小人之别孔子聖人不得位為師以授及門恐弟子之或入於小人也故謂子夏曰女為君子儒無為小人儒又若逆知後世有邪説者出以亂吾儒也故為之戒曰攻乎異端斯害也已蓋欲嚴其訓而立其防以維斯道於不墜故論語一書較諸書而已詳然猶未深為之辨也以至戰國百家橫流楊墨滋甚孟子生其間獨學孔子辭而闢之堯以來相傳之道由是大著故孟子七篇較論語而加辨嗚呼詳與辨聖賢因時為救之心聖賢之不得已也後之儒者有心斯世其立言也能如聖賢之不得已焉則詳可也辨亦可也漢氏以來佛老熾興歷魏晉五代學士大夫迷惑溺沒莫知底止唐之時韓子辨之下及于宋其始也周程張諸子辨之其繼也朱陸二子辨之凡皆發明聖道排黜佛老庶幾聖賢不得已之心自是而后朱陸分門互爭同異黨死護朽相為詆訾鄉者辨佛老兹且辨朱陸夫朱陸之末流固不當無辨要必平心觀理勿執偏私深得乎吾之所以是精晰乎彼之所以非後以吾説衷之則詞不繁而理自勝不然而徒勦口耳嘵嘵然負氣爭勝辨説雖紛究於聖道何補朱陸復生將咎其言之已甚矣嗚呼若是其辨也不如其無辨也有明一代儒者後先踵起或尚躬行或崇解悟皆因時為救故其發眀聖道排黜佛老其功直與宋儒等然以所見異同其末流之相譏如朱陸之紛紛者迄今而益甚嗚呼羣言淆亂折衷諸聖惟善學者精思慎擇使先儒不得已之苦心得之萬死一生之餘者昭然于載籍之間天下有志之士得就其質之所近從其所可從學其所當學一軌於正而勿納於邪亦庶幾發眀聖道排黜佛老之一助也吾友沈昭嗣素志理學飭躬修行於宋儒業窺其奧慮眀儒之説紛莫可紀乃彚群書纂為眀儒言行録有正有續出入謹嚴採擇詳慎今年過從之暇出以相示且命序之因念我髙王父鹿園公宗陽眀之學録中若東郭南野緒山念菴諸子皆先生友也先考履安公與吾師黃太沖先生皆及蕺山子之門余不幸背棄先訓方從黃先生讀蕺山遺書以上溯先儒而頺惰自安未有以窺其萬一莊誦斯編既深嚮慕須切愧悚不揣固陋為述從來儒者因時為救之説以復於昭嗣其尚有以教我乎昭嗣名佳仁和人萬斯大序明儒言行録豫弟進士昭嗣之所輯也肇自洪武迄於崇禎釐為十卷又續編二卷登是編者一百七十餘家諸家先紀號諡爵里以著其世而裒撮言行之要者以明其學自遺文羣籍以至史録志乘各編罔勿搜考其去取必慎至異同得失之介每出已意論定之罔勿折𠂻嚴正指歸畫然海內學者先後纂輯不一要無及此書者以屬豫序之豫乃喟然太息以起也敘曰儒者之道未有盛於有眀者也亦自古未有艱且惕於有明者也魯鄒肇統當道崩墜百家爭凌厥統不尊不専沿及漢唐誦法者猶號曰孔墨曰孟荀儒林之傳即經眀行修未識原本下逮有宋厥統始尊始専時宋興已百年方師弟源流相承未幾而戕者蝟起汴祚移而中原文獻僅一線嗣江左然且獝狂競吠至曰狂怪曰浮誕禁網與偏安相終始尋魏國臨川稍延舊物于存亡間由是觀之儒之于曩載其植之也短其撥之也長獨有明三百年間自始迄終儒之統煌煌綿綿未有晦而息之之日也故曰未有盛於有眀者也然往代蠧蝕之興廟堂猶知别白即若編管奉祠踈斥之斯替矣猶不至辱也明則洪建而下刀鋸三木禍偏中於儒賢其極也見僇滅於璫嬖而宫庭不知當此而言不辱得乎然而承之愈危砥之愈堅故曰未有艱且惕於有明者也惟其獨盛於前也譬諸繁星麗天其大者如五緯之耀芒而餘若嘒然以眀者勿敢後也惟其艱且惕于前也譬諸危峰障瀾其峻者如三門之砥柱而餘若岌岌以當其衝者勿敢避也夫其勿敢後與勿敢避儒者任道之心則然乃其卓卓樹立於天下所以邁流俗救俗學天下共尊信之安在哉曰言行二者而已顯則言敷于朝行孚於國晦則以言淑諸其徒以行善諸其身是豈有毫髮之可偽而飾者哉雖然言行之辨蓋綦嚴矣明初百年之間天下所尊信為儒者之言未有二於宋五先生者也自白沙出而其言一變當其時而不變者胡敬齋章楓山羅一峯也姚江增城出而其言再變當其時而不變者羅整菴吕涇野蔡虛齋也萬厯中鄧定宇李見羅鄒南皋主乎調停學脈而其言又若一變繼之以涇陽少墟儕鶴景逸主乎澄清世道而其言又若再變有變而異者有變而離異為同者夫言之異則可憂也為夫一二言之異而足以亂吾儒也而考其行之大端則未始不同是故一代諸儒或為中行或為狂狷而必無鄉願之賊如禹光之經行楊子之明哲得以隂竄其中或以異而疑同或以同而救異而未有同室之戈如伊洛之孽在門墻紫陽之孽在講習起而陽叛其下嗚呼此明儒之所為凛懍焉守之艱以惕而其道之長獨盛于前古有以也豈偶然哉雖然學者考論前儒言行非以侈見聞資口耳蓋將式型先覺使言無口過行無怨惡樹坊表於世斯善耳昭嗣天資和粹早嵗勤學好道於儒者之傳辨之明守之正力行孝友與人應事必恭必誠鄉邦莫不敬愛之第進士歸閉門授徒足不及官府於先儒言行奚愧乎行出筮仕將以致君澤民表見風采為當世所依賴吾道所光大其楷模效法此一編足以盡之更何他求乎豫也夙志於學倀倀寡所得今老且衰即不敢頃刻忘學問顧省身克已言行滋疚多矣對先儒遺範不覺愧汗時流離而下敢為昭嗣朂諸沈珩序
