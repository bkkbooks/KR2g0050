body:
  text: 明儒言行録續編卷一安化縣知縣沈佳編宋濂潛溪先生文憲公字景濂浙江浦江人國初以聘起仕至翰林學士承旨兼太子贊善先生在妊七月生兒時苦多病六嵗入小學授李瀚蒙求一日而盡九嵗能詩呼為神童稍長受業於聞人夢吉得春秋三傳之旨兼通五經時吳淵穎先生萊方內儒宗金華胡翰出其門致書招曰舉子業不足溷景濓曷來同學古文詞乎欣然從之未幾悉得其閫奧吳既辭去即代講席鄉先生柳文肅公貫黃文獻公溍深禮重之歎曰吾鄉得景濓斯文不乏矣莆田陳公旅稱其文沉鬱簡嚴能兼二公之所長歐陽先生玄則曰非才具衆美識邁千古安能與于斯遂以文名擅天下主於鄭氏者且二十年而是時俗尚波靡獨其鄉猶傳考亭東萊之學考亭一再傳為何王金許四先生稱朱學滴沠心慕效之間因許氏門人究其説而又念東萊之傳且墜每與人言深慨然歎思振其統蓋志在聖賢讀其書想見其人自任之重有不求人知而求天知者朱平涵史槩至正己丑薦為國史編修固辭會世亂益韜閟入小龍門山著書二十四篇曰龍門子凝道記又著孝經新説周禮集注等書劉誠意稱其主聖經奴百氏遊戲佛老譬猶飫梁肉而兼茹荼飲茗彌成其大庚子上徴入見問世亂奈何對曰願明公不嗜殺人上甚悅語必稱先生除江南儒學提舉授世子經壬寅召講春秋左氏傳公曰春秋孔子褒善貶惡之書遵而行之賞罰適中天下可定歸省甲辰改起居注侍左右明年上論石公三略且口釋之公進曰尚書典謨帝王大經大法靡不畢具願陛下留意講明之以疾還家賜贈有加箋謝上書奉太子願進德修業上悅洪武二年徴總修元史除翰林學士知制誥兼修國史時甘露屢降召賜坐上執金杓煉湯于鼎以露投之手巵注而賜曰此和氣所凝能愈疾故與卿共之因問災祥之故對曰受命不于其天于其人休符不于其祥于其仁上姪文正得罪公乃婉言請全親親之誼從之上詔丞相李善長歸江西軍所掠牛於其民無牛者官給之勿取租丞相退上顧先生曰向所言事當乎對曰民富則君不至獨貧民貧則君不能獨富捐利于民實興邦之要道也言行録上嘗祀方丘患心不寧先生進曰孟軻有曰飬心莫善於寡欲審能行之心安而身泰矣上嘗言古帝王當晏安之餘多好神仙朕孜孜政理國治民安心神恬康即神仙也對曰漢武帝好神仙而方士至梁武帝好佛而異僧集使移此心以求賢才天下有不治乎遷國子司業上問帝王之學何書最要先生請讀真德秀大學衍義上立取覽悅之令大書揭兩廡壁六年上坐西廡大臣侍坐指衍義中司馬遷論黃老事令講講畢復言曰人主能以義理飬性則邪説不能侵興學教民則禍亂不能作刑罰非所先也上曰朕上畏天地下畏兆民則禍亂不能作兢兢業業不敢自逸公頓首曰皇上愼終如始天下幸甚升侍講學士兼資善大夫令集歷代姦臣事為辨姦録分賜太子諸王侍上觀穫上問三代以上所讀何書對以載籍未立不專誦讀而尚躬行又命序祖訓纂大明日厯七年日厯成凡一百卷序進稱上度越前王者六挺身南服統一華夏功高萬古一也避亂民間初無異念憫民塗炭始取之羣雄之手得國之正二也百戰百勝未嘗摧衄治政詰戎文武將吏仰成算而已獨稟全智三也動靜起居森若神鑒禮行郊祀存於心目有赫鑒臨惠鮮小民恐一不獲唯墨吏黠度是刑是威敬天勤民四也后妃宫中不預一髮政外戚戢戢循理閹寺給掃除而已家法之嚴五也大帥佩印領兵以從征伐凱旋上章歸士單身還第兵政有統六也復與詹同樂韶鳯言日厯藏天府人不易見更倣唐太宗貞觀政要輯成四十類為皇明寶訓上之其他禮樂律厯之制勳臣名卿焯德耀功之文上並使先生編摩潤色既侍上久有問陳説直諒不務文飾上喜曰卿可參大政對曰臣少無他長徒以文墨議論待罪禁林臣之榮極矣一旦受職任事不效將負陛下頓首力辭上愈厚之每燕見坐賜茶詢舊章講治道甚條析至問廷臣臧否第言其善者不置又問否者為誰對曰善者與臣友故知之否者縱有臣不知也時命賦詩為文必寓忠告性深密不泄禁中語有奏輒焚稿嘗大書溫樹二字室中或問朝廷事指二字不對開國臣傳上嘗與先生飲先生素不勝杯勺舉觴即醉上強之飲醉歡笑賦楚詞一章命侍臣咸賦醉學士歌曰俾後世知朕君臣同樂也上稱濓事朕始終無異口無偽言背不毁人真儒者也夫九年除翰林學士承旨上曰朕起布衣為天子卿自草萊列侍從為開國文臣之首俾世世與國同休不亦美乎令太子選賜良馬又為良馬歌賜之時有上萬言疏者上怒其迂將加罪問羣臣有阿意者言當誅召公問對曰彼應詔而來本效忠無他也上復覽疏頗有足采者召罵阿意者曰若等激吾怒何異以膏沃火向非宋學士幾不誤罪言者上嘗廷譽先生曰古之人太上為聖其次為賢為君子若濓事朕十有九年未嘗有一言之偽誚一人之短寵辱不驚始終無異其誠所謂君子人乎匪唯君子抑可謂之賢矣鄭楷撰行狀十年歸賜緡綺御制文集太子贈衣三襲上曰朕最愼賞嘉卿忠誠故以賜卿卿今年幾何曰六十八嵗上曰藏此綺三十二年作百嵗衣公頓首謝辭行請嵗一朝是年九月入朝上廷問公屢矣及至大喜賜敕褒諭禮部致酒米殽果日侍上遊覽便殿侍食至暮始退上歎曰純臣哉爾濓方今四夷皆知卿名卿自愛日本使奉敕求文獻百金却之上問故對曰天朝近臣受小夷金非所以崇國體上然之嵗盡辭還既行數日上語璲曰朕疇昔之夜夢爾父談笑如曩時璲曰非陛下垂念臣父切至何以形之夢寐明年再至賜賚慰勞彌厚公嘗曰古人為學使心正身修措之行事俯仰無愧而繁辭復説道之蔽也尤篤于倫品與人交和易任真內誠外恕一見信服汲引後學如恐不及平居布衣蔬食無異貧士或勸為子孫計曰富貴豈一家物哉吾乃所以遺之也自少至老未嘗一日去書致仕居青蘿山閉門纂述人不見其面視近甚明夜然燈于几卧絺帷中閲蠅頭小字一黍上能作十餘字皆可辨性踈曠賔客不至纍日不整冠幘悠然自樂十三年冬孫愼坐法論死公罪且不測太子力救得釋安置茂州十四年五月行至夔卒年七十三門人方正學曰當元之衰國朝始興也地大兵強據名號雄視中國者十餘人皆莫能得士太祖定都金陵獨能聘禮太史公論道上前授經太子未嘗不言仁義天下既定上方稽古制治凡郊廟山川祠祀律厯禮樂夷裔貢賚諸禮文大政皆太史公裁定太子寬大仁明天下歸心愛戴太史公之功居多海外諸國朝貢接國門至必問太史公安否其為人推重如此公墓初在夔永樂十一年孫恪以蜀獻王命遷葬華陽置祀田正德中諡文憲朱國禎曰先生篤行真修學有本原文歸爾雅遭際聖神大𢎞制作守先王之道而見之行無道學之名而有其實收宋儒未竟之功開我明大成之運決當從祀孔廟而先生既不自名亦無有名之者乃後來追崇大約以著述講授為主推曰先儒謂足接有宋君子之後而於先生未聞談及太祖固常評之矣躋其品曰賢蓋在聖之下君子之上此千古不可易而汶汶至今良可歎息史槩先生臨財亷非其分不取大書於門曰寧可忍餓而死不可茍利而生君子以為名言太祖一日問劉基曰我朝文章何人為首基對當以宋濓為第一又問其次乃曰其次則臣不敢多讓青溪暇筆春日載陽列宿繁張江漢湯湯是為先生德容之粹文名之高學問之長安夷輔夏復我綱常功在萬世曷其敢忘彭韶撰贊歸有光曰宋之季世何文定公得黃勉齊之傳其後有王會之金吉甫許益之世稱為婺之四先生益之弟子為黃晉卿而宋景濓王子充皆出晉卿之門高皇帝初定建康青田劉文成公實與景濓及麗水葉景淵龍泉章三益四人首先應聘而至當是時居禮賢館日與密議浙東儒者皆在蓋國家興禮樂定制度建學養士科舉之法一出於宋儒其淵源之所自如此震川文集方孝孺正學先生忠烈公字希直一字希古浙江寧海人洪武年以薦召為文學博士父克勤為濟寧知府先生其仲子也生之夕有大星墮於其所幼精敏絶倫雙眸炯炯日讀書積寸為文雄邁醇深鄉人呼為小韓子十四五侍父宦遊齊魯間歷覽周公孔子廟宅問陋巷舞雩所在遍尋七十子遺蹤喟然曰世無尼父安所瞻依七十子中如顔閔固未可企及他遊夏輩假令共遊孔氏之門亦當比肩伯仲聞者以為狂曹公李文忠見之期以國士從宋濓遊同門多天下名士一旦盡出其下先輩如胡翰蘇伯衡皆自謂勿如比于歐陽少師蘇長公先生顧末視文藝恆以明王道闢異端為己任世咸以為程朱復出嘗卧病絶糧家人以告笑曰古人有三旬九食窮豈獨我哉朱國禎遜國臣傳從宋濓入京濓侍宴受命作靈芝甘露頌歸家醉卧已忘之先生度未能興密代為之比明宋愕曰死矣先生慰曰無恐某已屬筆未知有當否宋閲甚喜即携以入上覽曰此非學士筆也宋具實對上曰良勝汝即召見試以一論五策立成上改容謂吳沉揭樞曰孝孺孰與汝對曰十倍於臣因嘆曰誠異才也賜緋袍腰帶猶平巾使往見東宫宴禮部使人試攲所坐几以視之先生必正乃坐洪武十五年吳沉揭樞曰可大用召見上喜其舉動端整謂皇孫曰此莊士當老其才輔汝諭遣還家吾學編按枝山野記云往禮部宴命宗伯陪之復遣覘焉公據上席岸然上曰斯人何傲因不留俾為蜀王教授語懿文曰有一佳士賚汝今寄在蜀其人剛傲吾抑之汝用之當得其大氣力景濓告歸復來侍庚申辭歸景濓贈詩惜别因敘其素有之善朂以逺大之業且曰豫所許者不獨在文二十餘年當信豫為知言其秋景濓徙蜀先生欲往省不獲為文籲天願以己之夀年輸委乞延師命壬戌秋在郡城會葉林張陳四君子登巾子山絶頂縱談千古竟夕不寐先生自謂此樂乃蘇子瞻死後三百年所無也杜門著述不出為仇家所連籍逮至京上見其名曰是方生耶釋之令奉祖母葉挈妻子還二十五年以薦召至入對上方重賞罰以其志存教化曰今非用孝孺時除漢中府學教授日與諸生講明聖學蜀獻王聞其賢聘為世子師每見必陳説道德王喜甚尊以殊禮召對不名講經論文無虛日名其讀書之廬曰正學史槩皇太孫即位召為翰林侍講學士先生德望素隆一時倚重凡將相大政議輒咨先生上好讀書每有疑即召使講解臨朝奏事臣僚面議可否必命先生就扆前批答嘗作書事詩曰斧扆臨軒几硯間春風和氣滿龍顔細聽天語揮毫久携得香煙兩袖還又曰風軟彤庭尚薄寒御爐香繞玉闌干黃門忽報文淵閣天子看書召講官時大召名儒修太祖實録及類要諸書為總裁會改謹身殿名正先生獻銘作凝命神寶又獻頌皆規正君德比定官制改文學博士北兵起日召咨議詔檄皆出其手先是文皇發北平僧道衍送之郊跪而密啓曰臣有所托江南方孝孺者素有學行圍城之日必不降請勿殺之殺之天下讀書種子絶矣上頷之兵既度淮及江上畫策堅守誓死社稷建文遜去先生即持斬衰服晝夜哭為鎮撫伍雲等執以獻不屈繫獄一日遣人諭再三終不從又召草詔及見悲慟聲徹殿陛上降榻勞曰先生無自苦豫欲法周公輔成王耳曰成王安在上曰渠自焚死曰成王即不存何不立成王之子上曰國賴長君曰何不立成王之弟曰此朕家事先生無過勞苦顧左右授筆札曰詔天下非先生草不可大批數字云云投筆於地大哭且罵且哭曰死即死詔不可草上大怒叱曰汝焉能遽死朕當滅汝十族以刀抉兩口旁至耳復繫獄以俟拘其宗支及母妻族等示且脅之執不從上既怒甚乃使朋友門人廖鏞等為十族誅之然後詔磔於市慨然就戮為絶命詞曰天降喪亂兮孰知其繇姦臣得計兮謀國用猶忠臣發憤兮血淚交流以此殉君兮抑又何求嗚呼哀哉兮庶不我尤時年四十六復詔收其妻鄭鄭已先經死二女溺淮水死宗族坐死者八百四十七人先生和粹貞諒事親孝處師友篤恩義父守濟寧被誣謫戍江浦上書乞以身代不報景濓葬夔州自漢中走荆榛往祭墓且言之蜀王軫恤其孤嫠備至每私居念及或見其手迹或對客談及輒交淚不能止死時去景濓正二十年矣與林右王紳郭濬劉浩葉見泰諸名士友善切磨道義被薦時王叔英與書大率以時措之宜為言深然之及與政輒慕古王政即欲見諸行事以故多紛更卒無成效其文章大類蘇氏而正論過之嘗謂道於事無乎不在列為二十八針又作雜誡三十八章以自警謂化民必自正家始作宗儀九篇謂先王之法先德禮而後政刑作深慮論十首以篡臣女主僭竊雖一天下不可為正統作釋統三篇多先哲所未發四方夷裔得一字寶於金璧所著有遜志齋集四十卷又有周禮考次大易枝辭武王戒書注帝王基命録宋史要言諸書逸不傳死後遺骨門人廖鏞王稌等瘞之聚寶門外洪熙初仁宗嘗謂羣臣曰孝孺輩皆忠臣詔姦臣黨與從寬典因立祠祀公後王稌輯遺文為侯城集成化中謝方石鐸黃文選孔昭搜集遺文始行萬厯初詔許褒録建祠於是南少宰李廷機建表忠祠於朝天宫祀諸死節者首先生司務余飬蒙建顓祠於聚寶山之木末亭魏典史澤字彥典溧水人有學行纍官刑部尚書謫寧海典史時方逮捕孝孺族黨澤悉力周旋藏其幼子後過孝孺故居為詩曰筍輿衝雨過侯城撫景令人感慨生黃鳥向人空百囀清猿墮淚只三聲山中自可全高節天下難居是盛名却憶令威千載後重歸華表不勝情聞者皆壯澤之義謝文肅贊曰我台之學考亭是師逮於愚庵實聞而知愚庵之子是曰正學益擴而宏上泝伊洛如麟在藪如星在辰旁觀一世絶類離倫心實希聖自視欿然盤銘書紳雜誡惓惓家人有針宗儀有紀謂道之行莫先於此學以氣充磅礴四行孰顧孰忌禍福死生歷宋迄元士氣益下有復古初不在作者佳按史稱愚庵先生敦儒行元末隱居教授國初仕至濟寧太守為政務先德化晚年進修益力晝所為夜必白之於天俯仰無愧怍宋景濓謂其學問得諸考亭宜其生有正學先生也欲向西風酹一尊乾坤何處著英魂百年事過風前燭千古名留海上村香火半龕誰地主孫枝一葉是君恩夕陽滿地傷心淚付與江流自吐吞謝文肅公過侯城詩蔡虛齋曰使正學先生當日得行其志伊周格天之業疑亦不遠痛言及此真使人有追憾天地之心佳按太祖神謀睿斷制作三十年規模宏遠繼之以讓帝仁心為質先生從容密勿申明祖憲確守成畫開寬大之恩需垂裳之治仁漸義摩效伊周格天之業則三代之盛不難致也惜乎求治太鋭紛更定制違時措之宜卒致大業不終豈可盡諉天命哉文廟實録是三楊諸公手筆於方孝孺等直著其抗命之迹可也乃曰孝孺叩頭乞哀上命執之下於獄嗚呼是何心哉議者專罪楊文貞恐未必盡出文貞手弇州别集彭惠安公有哀江南詩曰後來姦佞儒巧言自粉飾叩頭乞餘生無乃非直筆嘗聞宋景濓先生過佛寺方公實從先生見佛拜參公不為禮或以為請先生曰後來未到老夫田地故耳水東日記何司徒曰孝孺平生傑然必為君子也賤文章而貴道德耻刑法而尊教化慮無不發明聖訓敷陳王道當是時天下皆以孟軻韓愈復生亦自以遭遇時君當世無二奮然謂三代仁義禮樂為必可師井田必可興閭必可比刑必可措何其勇也哉自待如彼其高遇主如彼其信所著深慮治要官政民政諸篇誠救時之良藥惜乎好古太堅求治太鋭欲以一人之身挽回數千年之世道狹小前人紛更高皇帝之制夫先王之道仁義禮樂莫大乎親親在廷諸臣可以得建文君者宜莫孝孺若也於此操縱可以少紓而刻削太驟坐生蕭牆之禍謀及行間割地而始窮又何踈耶佳按此不可議先生也藩封大廣而不即定制自高皇帝之世已然葉居升死而無敢陳言矣以文皇之雄武坐擁強籓所謂削亦反不削亦反者也於先生乎何尤抑天之所廢雖有善者無如之何哉建文君既亡斬衰晝夜哭觸犯嚴威刑七日乃亡宗族親戚朋友坐誅者千有餘人古今成仁之禍烈未如此也嗚呼文皇英武宏達求士如飢渴令孝孺與三楊蹇夏諸人樹勳當時固將列彜鼎勒景鐘又令稍掩剛懻以存堂陛之詞亦可及身而止死者垤於市矣猶然轟雷霆赴水火如枕席其心有所必然也孝孺死浙東之仕於朝者以身殉建文君獨多於天下故夫行有勸而德有風孔子曰志士仁人其斯人歟其斯人歟史槩王紳曰天之生斯民也又必生聖賢為之依歸以裁其有餘以補其不足必使暗者資之明懦者藉之強然後天地位而萬物育也然而伊周孔孟之徒不世出者非天之惡生聖賢也蓋聖賢者靈和純粹之氣之所鍾實未易逢茍生矣則將行道於當世垂訓於方來雖其一身之微其功已被萬世之遠矣夫當世之後有讀伊周孔孟之書而慕效之者可不謂之豪傑之士乎雖然聖賢任道之心雖一而行道之勢則不同伊尹周公得志而見於功業孔子孟子不得時而托於空言其事雖殊要其歸則一也後之學者不察其心而離於二心專功業者則詆立言者為空文務立言則謂必藉是以明道傳習之久而弊愈甚於乎世有不惑於衆人而致力行之功者其殆有志於聖賢者歟天台方君希直負精純之資修端潔之行考其學術皆非流俗所可及其言功業則以伊周為準語道德則以孔孟為宗會其通而不泥於一志乎大而不局於小實有志於聖賢者也嗟乎聖賢之不作久矣斯道之微若晨星之在太空光彩不耀者數千百年至宋諸大儒出始續其不傳之緒而繼之然後學者有所宗師今去宋又二三百年矣斯道之晦亦久矣天之閔斯民而望後人者亦甚矣方君以出類之才如此其意必有在矣而君又烏可不自力也紳不敏幸忝同門之列於君之志竊有與聞焉故特著其説於文稿之首王仲縉遜志齋集序林佑曰流而不可止者勢也習而不可變者俗也與勢俱往與俗同波者衆也知勢俗之所趨而能確然以聖賢自守不浸淫於其中者君子也非惟不為勢俗之所浸淫而吾一言一行之所達天下之勢皆隨以定天下之俗皆隨以化譬若烈風震雷鼓撼上下無大不摧無幽不入雖有強梗自撓亦餒焉委靡於其下此非聖賢豪傑之士不能當周之末孔子之徒已沒楊墨之説盛行於天下孟子慨然於布衣中修明仁義之道而楊墨之説以廢孟子以來更歷秦漢既遭坑焚之禍天下學者不見全經而老佛之徒唱為私説鼓舞天下天下之人皆相與師而尊之曰此當今之聖人也使三綱淪而九法斁其害有甚於楊墨者雖以韓文公之雄才竟不能為天下變至宋程朱諸子者出一掃陋習頓回天下於大道之中天下之人幡然而改曰吾道固在是也然後老佛之説為無用嗚呼當其肆為邪説乘吾道之無人戕賊其間根蟠枝散固植人心漫不可拔天非生程朱於天下則天下之人終日昧昧如瞽者之宵行何由覩青天而見白日也哉故曰能定天下之勢化天下之俗非聖賢豪傑之士不能也有如雲之舟方能適無涯之海有烏獲之力方能負千鈞之重有天下之才方能剖天下之事才不足於天下而欲剖天下之事猶乘小舟以適海驅孱夫以負重不待識者皆知其不可也是故不患天下之勢不我定天下之俗不我化惟患我無蓋天下之學耳彼郭林宗王導之徒屑屑衣冠之間猶能使天下之人效之況吾佩服聖賢之學而謂天下之勢不我定天下之俗不我變哉惜乎當今之學者則異於是但聞前朝之故習竊成説為文辭雜老佛為博學志氣汙下議論卑淺齪齪然無復有大人君子之態吾友方君希直奮然而起曰是豈足以為學不以伊周之心事其君賊其君者也不以孔孟之學為學賊其身者也發言持論一本於至理合乎大道自程朱以來未始見也天下有志之士莫不高其言論將盡棄其所學而從之嗚呼豈非豪傑之所用心也哉常嘆世生豪傑之士不多見而於吾希直見之又豈非吾之願也哉希直之文吾評之矣譬若春氣方至真液之色充滿廣宇飛潛動植之物各有生意天下之人莫不信之此特其一事耳要其大者不在此也雖然文所以達志也不觀其文何以知其志之所存余故又序其文云佳按佑字公輔臨海人元亂不仕洪武初為中書舍人與希直交莫逆後進春坊大學士命輔導皇太孫以事謫中都教授尋挂冠歸聞希直族誅為位哭於家永樂戊子島夷訌海上台被其毒監司聞佑才請為閭里計不得辭勉起視兵督郡子弟平之上以此知佑遣使召不赴令武士械至京師猶冀加録用對云罪人逃死已久藉令可仕當與方孝孺同朝矣上大怒命曳出劓之後人輯其遺文鄉人陳龍山復為之傳佑節始著王褘華川先生忠文公字子充浙江義烏人國初以聘起纍官翰林待制奉使雲南死節幼秀爽竒敏及長長身山立有偉度習古學師事黃文獻溍時溍為文章宗工天下所師仰然性介特愼許可見公所業獨深器之即屬以斯文之任至元戊子為書七八千言上之時宰嫌其切直格不以聞臨川危素濟南張起巖等屢薦不報時有齊琦者明數學推言天人興衰甚驗見公歎曰子充異代人物也公亦知世道終不可為乃歸隱青巖山中著書深自晦匿若將有所待者戊戌太祖取婺或以名聞遣使徴之公幡然喜曰吾聞大亂極而聖人出齊琦之言良足徴乎即詣行在上見大喜署中書省掾商略機務上每稱子充而不名間與論文章稱善因命採故實為四言詩授太子鄭濓溪行狀辛丑進平江西頌上覽頌喜曰吾固知浙東有二儒卿與宋濓耳學問之博卿不如濓才思之雄濓不如卿癸卯授江南儒學提舉司校理外艱服闋除侍禮郎兼引進使時當創國之初禮制多所裁定遷起居注丙午出同知南昌公披榛莽建府署撫瘡殘集徙散收廪賢士搜除姦蠧經理廢壞郡得安集賜黃金帶以寵勞之丁未召議即位禮忤旨降漳州通判上疏言臣聞自古帝王定天下成大業必祈天永命以為萬世無疆之計所以祈之者在乎人君修德而已君德既修則天眷自不能已者書曰皇天無親惟德是輔此之謂也人君修德之要有二忠厚以存心寬大以立政二者君德之大端也昔周家以忠厚開國故能垂八百年之基漢室以寬大為政故能傳四百載之業簡册所載不可誣也欽惟陛下負不世出之姿奮大有為之志艱難十年大業已成周之文武漢之高光蓋無讓焉臣竊聞之人君莫先於法天道莫急於順人心夫上天以生物為心故春夏以長飬之秋冬以收藏之皆所以生物也其間雷霆霜雪有時而搏擊焉有時而肅殺焉然皆暫而不常向使雷霆霜雪無時而不有焉則上天生物之心息矣人君體上天生物之心故一動一靜之間務合乎天不然則天必示之變異以警戒之人君誠能修德則豈不足以當天意而成天眷哉此臣所以願陛下之法天道也夫民恃君以為生故人君視民之休戚必若已之休戚以君民同一體耳古者藏富於民言取之有節也取之有節則民生遂而得其所陛下近發德音減茶課免軍需蠲邊郡之租稅民生咸悅幾得以遂其有生之樂然今浙西既平租稅日廣科斂之當減猶有可議者此臣所以願陛下之順人心也法天道順人心則存於心者自然忠厚施於政者自然廣大祈天永命之道不越此矣名臣經濟録洪武二年召修元史為總裁官徴逸士汪克寬胡翰宋僖陶凱陳基趙增曾魯高啓趙汸張文海徐尊生黃箎傅恕王錡傅著謝懲十六人為纂修官開局天界寺公史事擅長裁煩剔穢力任筆削書成拜翰林待制同知制誥兼國史院編修官公與宋濓同為總裁筆削之勞一無所委一日在史局渴甚謂宋公曰得昨上所賜梨漿吾渴濟矣中官竊聞之言於上即命齎賜之三年預教大本堂公經明理達善開導每召對殿庭必賜坐從容宴語未久奉使土畨尋召還五年以翰林待制奉詔諭雲南六月至諭梁王曰皇上聰明神聖隆啓大業作君萬邦皆天命人心之所歸爾宜亟奉版圖歸職方即身名全不然天討旦夕且至不聽館之别室然以公名儒雅敬之數日又諭曰朝廷軫念雲南黎庶不欲殱於鋒刃故令使臣開諭曾不聞元綱解紐諸雄割據天兵四征不五六年天下大定今王自度謀勇悍鋭孰愈誠諒兵土利廣孰愈中國度德比義孰愈天朝推亡固存孰愈天命天之所廢誰能興之天之所與誰能禦之今以區區一隅之地逆天犯順與天下抗為此謀者不亦誤乎梁王駭服有降意即為改館會元遣使托克托至雲南覘梁王有二心欲迫殺我使以固其意梁王持兩可不決匿公民間托克托偵知之質諸王王出公與托克托相見托克托欲屈公公罵曰天訖汝元命我朝實代之汝如爝火餘燼尚欲與日月爭光耶我將命遠來豈為汝屈有死而已顧梁王曰汝朝殺我大兵夕至矣六年十二月竟被害瘞地藏寺北年五十二子紳字仲縉博學能文洪武二十九年走雲南求父遺骸不得述滇南慟哭記建文時為國子博士請恤典諡文節成化中加贈翰林學士諡忠文公慷慨有奇氣人初見之若不敢即及一言之入則情誼藹然恨相知之晚於經史百代無不究其極其為文宏麗沈雄機軸貫綜自成一家言天下士大夫爭誦習之所著有華川前後集玉堂雜著續東萊大事記各若干卷藏於家翊運名賢録公事上十餘年服勤報效左右開陳非仁義之言勿道也教子慈而有法有官還書教之曰寧人侮我毋我侮人故二子克自樹立皆能世其家學紳年十三穎敏過人宋濓一見奇之曰華川有子矣洪武十五年蜀王禮聘教授蜀郡紳痛父遺骼未返丘隴白王走雲南慟哭行求不能得即奠死所仰而一號絶而復蘇滇人感愴稱王孝子時雲南布政使張紞重紳純孝為作弔王翰林文建文即位以薦召為國子博士預修高皇實録與方孝孺友善嘗尊孝孺為百代儒宗建文元年紳上言父死節狀下翰林定議降制特贈諡開國以來文臣有諡自褘始時蹇義被拔擢而好與時浮沈紳上書勸之曰執事負天下重望治否安危實繫於進退去取之是非而所任非其所長所職非其所事位高於器則有覆餗之患才過於職則有積薪之譏非其才而強委之至於僨事則是執事欲為尋常無聞之人而不可得況敢望其逸樂優遊而與時上下乎義得書極感之建文二年卒年四十有二子稌字叔豐少有志行壯力學問性至孝紳痛念父歿食不兼味稌遵教子孫相承數十年不變父母喪三年酒肉不入口卒年五十九門人私諡曰孝莊先生徐自幼潛心勉學博覽羣書受業於方孝孺以文行重於士林及孝孺被刑狼籍人莫敢收稌與鄭恂潛至聚寶門外求其骸骨以歸坐逮繫獄文皇念禕忠特宥之且用稌稌辭疾終其身讀書青巖山下稌與童景庸書言痛念遜國名迹日就湮沒欲執事與令兄商確搜輯其學行幽潛生卒始末為家傳行狀以傳同志有愛慕之心者自能默識而謹藏之矣稌遂輯方氏遺文為侯城集後百年始傳稌踈髯偉貌出必儼然古冠服人爭覩之曰此王先生也所著有青巖稿聖廟文纂金華賢達傳續文章正宗黃珏菊東先生字玉合浙江餘姚人八嵗始能言言即中節母喪哀毁如成人力學不間寒暑初習春秋改學蔡氏書諸公爭延致授館者且四十年屢試不售棄去晚年喜玩邵子皇極經世書嘗曰天人之理微邵子能推其極帝王之道大蔡氏能解其全然非朱子訂定後人何能窺見仿佛蓋其學至勞而益勤至博而守之以約有獨窺其深者同母兄璧庶母弟瓊瑶玠庶母行譖遂失愛於父而孝友益篤終始無間父沒分産悉推善者曰此遺志也有冨人庶弟欲訟兄者引大義切責得止兄聞來謝却之洪武三年卒年七十一史概朱子之學既行四明猶守楊文元沈正獻二家之説及慈溪黃文潔稽考經史一折衷於朱子方翕然向風文潔沒其弟戇庵彥實以家學接續于宋元之間及門之士甚多而卓然有立則菊東其最著者菊東其别號也開國臣傳郭檟字德茂浙江太平人洪武初薦授饒陽知縣少勤問學比壯特有所悟由伊雒上遡洙泗求聖賢用心燕居獨處衣冠修整即祁寒暑雨危坐終日及與人接和氣滿容雖居貧常有以自樂其所涵飬專用靜中功夫應接事物一循乎禮邑士人多從之遊其為教謂必先收放心方見得吾道端倪即聖賢言語方有歸著又曰學者若不懲忿窒欲則自家都壞了此是大切要處父沒會兵荒不克葬十餘年茹蔬抱戚迄葬始御酒肉母疾衣不解帶浣衣滌席凡六閲月終不以人代與其兄友愛尤篤鄉里化之終元世隱居教授嘗作感秋酷熱詩以寓意洪武初用御史李時可薦始就饒陽知縣三年邑大治以從兄故坐免邏者察諸途搜篋中惟所著易説雜評暢庵稿數十卷及爪髮一束以聞太祖嘉其亷賜紗幞銀帶寶鈔以旌之既歸貧益甚課其子熙躬操井臼一日諸生及門聞打麥聲視之乃先生也卒年六十二門人私諡曰貞成先生俞貞木初名楨以字行别字有立南直吳縣人洪武間薦授知縣祖琰元末老儒邃易學著書百卷公少聰敏善屬文年十五篤志問學欲以力追古人既冠念學業未成勿肯娶從永嘉陳公麟受易多所開悟及陳公宰慈溪不遠千里復往卒業值元季兵亂始辭歸杜門不出研精雒閩探奧羲文間居十餘年視天下榮利泊如也洪武中始以薦授樂昌令尋丁父憂服闋改都昌令甫下車即捐俸修周元公朱文公祠因以禮教其民翕然從化未幾政舉惠行郡將上其績於朝丁母憂歸以親族犯法例勿起遂屏棄世事間作詩文以自娛公資稟誠確潛心為巳之學故其與人處雖甚和易而中峭厲不可犯晚節益樂恬靜安陸姚善來守蘇郡折節下士數延致于庠行乞言禮值靖難兵下勸善舉兵勤王文皇既立被逮至京以疾卒有遺集藏於家胡翰長山先生字仲申浙江金華人國初聘授衢州府學教授幼聰睿甫七嵗志氣即與凡兒異一日於道中得遺金守不去坐候遺者至而還之遊蘭溪從吳真文公學博覽經史又登許文懿之門學益淵時黃潛以文章名天下天下師尊之見公文大驚稱贊之不容口而公謇然不為之屈也遊京師羣公交譽之或勸之仕不應還過廣川弔董子謁曲阜拜孔子墓而歸已天下亂避地南華山中著書洪武初大臣交以才行薦召見時方籍金華民為兵公從容進曰金華民多業儒不習兵籍為兵徒糜廩粟耳上立為罷已上憫翰老儒不欲煩以事授衢州學教授會修元史召入局纂修書成賜金綺辭歸卜居長山之陽學者稱曰長山先生公高名卓絶慕程邵二先生之為人也所飬甚深出言簡奧不煩而動中繩墨極乎博而守則約務乎大而不遺乎細於人鮮所推讓而所許者衆必以為賢於言不輕發而所言者人必以為當其所著衡運井牧皇初正紀諸篇皆覃精名理窮極造化而為天下之大綱正法焉吳公沈以為如五曜麗天芒寒色正朱絃在廟肅然其音云公文簡峻清潔性嚴毅寡酬未嘗輕有所毁譽暮年請文者踵門不茍隨也朱升楓林先生字允升南直休寧人國初以徴起授翰林學士初師陳櫟剖擊問難多所發明櫟深器之至正癸未偕趙汸從黃楚望講道明年歸作經書傍注登鄉貢進士戊子授池州學正以身立教士皆興起秩滿歸蘄黃兵至徽避兵奔竄往往閉戶著述不輟丁酉大明兵下徽被旨召見上問之對曰高築墻廣積糧緩稱王上嘉其朴遂參密議尋辭歸吳元年徴拜侍講學士知誥詔同修國史上親製誥詞有曰眷我同宗之老實為耆哲之英於開國諸公好得其實無何以學士張桱為直學士特免朝謁優禮之七月領樂舞生入見設雅樂閲視上親擊石磬命升識五音誤以宫音為徴音上不懌賴熊鼎解之得止洪武元年二月上御東閣顧謂升曰觀周禮有所謂六夢者朕嘗感異夢厥兆維何對曰人之精魄上通於天此陛下受命之兆也軒轅夢逰華胥天下大治帝王之興自有天命蓋振古如兹矣三月命儒臣修女誡又諭升修齊之本遂受命纂輯二年三月復命撰齋戒文是月請老歸石門居梅花初月樓上親灑宸翰以賜庚戌卒年七十二學者稱為楓林先生著有易書詩周禮儀禮禮記孝經四書小學旁注及書傳補輯諸書傳解行于世朱善文恪公字備萬江西豐城人國初徴士仕至文淵閣大學士九嵗通經能文元末隱居纂述孝事繼母高帝既定天下設學校時豐城尚為富州州守強憲中請善為訓導南昌守許方復聞善於朝授郡教授洪武八年徴赴京廷試第一除翰林修撰署院事兼知制誥以奏對失旨改典籍復謫教遼東行至徐州妻卒藳葬路傍而已尋遇赦還鄉十七年召授翰林待詔上疏論婚姻律曰臣聞國重世臣家重世姻今民間婚姻之訟甚多兩浙江南尤甚問之皆舅姑兩姨子若女蓋以法不當婚故為仇家所訟或以聘而見絶或既婚而復離至婚家已久兒女成行有司尚爾逼奪使伉儷分離子母永隔寃憤抑鬱感傷嗟嘆議律不精禍一至此按律尊屬卑幼相與為婚者有禁若謂父母之姊妹與已之身是謂姑舅兩姨皆名尊屬已不可以卑幼匹之若已為舅姑兩姨之子彼為舅姑兩姨之女門地相耦長幼相若嫌靡尊卑美儷鈞敵為子選婦為女選壻宜莫先此昔成周之時王朝所婚不過齊宋陳把數國而已故當時稱異姓大國曰伯舅小國曰叔舅列國之君齊宋魯衛陳鄭秦晉亦各自為甥舅之國降及後世如晉之王謝唐之崔盧潘楊之睦朱陳之好無不世婚為重其顯然可證者如溫嶠之玉鏡臺此以舅子娶姑女也呂榮公夫人待制張昷之女而待制夫人即榮公母之姊此以小姊子娶大姊女也若此律不明訟獄繁興風俗凋弊甚可傷憫願陛下下臣奏議弛禁章帝然之明年授文淵閣大學士帝與羣臣論治善曰致治在任人擇衆賢為耳目則視聽周任衆知為計慮則澤施溥今天下太平選任賢才宜留聖慮他日講心針家人卦皆稱旨以疾告歸卒所著詩經解頤集行世正德中賜諡文恪宋訥文恪公字仲敏直𨽻滑縣人國初以聘起仕至國子祭酒公承家教矩矱自檢性持重齒胄館師友切磋學問該博元至正癸卯進士令鹽山兵亂隱居洪武二年中書省徴儒士十八人纂修禮樂公與焉事竣不仕而歸五年過元故宫作詩傷之説者謂其合於箕子衍疇之義也十三年四輔官杜斆薦之召至當上意授國子助教橫經發難擊蔀廓蒙學者歸向同諸儒應制撰敕文援筆立成上大稱歎拜學士時建太學上幸學博士龔斆執經祭酒吳顒進講上喜召公至奉天門令為太學碑賞賚上每觀書或論用人必與擬議皆稱旨改文淵大學士時年逾七十上親製誥詞引尚父興周八百為比蓋自宋濓詹同而後惟公時被召對既感知遇日有補拾甚見親信擢公為祭酒嚴繩準推恩義身言並教寢食學署不復家宿一時士皆適用上猶慮功臣子弟有不率者以曹國公兼領監事由是貴胄肅然一日公病遣中使諭卿稟天命之性發仲尼之誠施已之幽德修道教人所以疾不病而速差以其有神也又嘗言宋祭酒骨格必夀命畫工圖像上問昨公服坐堂上何以有怒色對一生獻茶踣而碎其甌念臣不才失於教敬中心自訟不意為陛下所知上喜慰出畫像示之以老召其子侍飬十八年久雨求直言獻安邊䇿曰備邊在乎兵食足食又在乎屯田屯田之制必當法漢本始年中胸奴帥十餘萬騎南向欲為寇趙充國乃將四萬騎分屯緣邊九郡單于聞之引去夫以四萬騎分屯九郡而充國統制其間則當時籌畫區分槩可想見我朝諸將中勇知謀略豈無如充國者陛下宜選其尤者數人隨其遠近高下立法分屯所領衛兵以充國兵數斟酌損益率五百里屯一將布列沿邊之地遠近相望首尾相應耕作以時訓練有法遇敵則戰敵去則耕此長久安邊之䇿也又何必勞師萬里求僥幸之功以取無用之地哉上嘉納之令邊軍皆屯田著為令吏部尚書余熂不喜公以事逐公去上怒誅熂慰公復位二十三年公疾革其子麟及屬官懇請還家厲聲曰是何風雲氣少男女情多況在丁社兩祭齋戒中耶三日丁酉祭畢舁歸抵暮卒年八十上為文遣官致祭故事文臣四品無給喪費者給自公始其後太學生有連舉大魁者上曰此宋祭酒訓迪之功也諸生守官稱職者多出公門上每舉為教國子者法三十年以張顯宗韓克忠署祭酒司業事上因思公坐奉天門諭太學生曰宋訥作祭酒司業事學規嚴肅秀才循蹈規矩向學中用朝廷以故得人訥善終朕禮送回鄉葬又令沿途有司祭訥近年老秀才做祭酒懷異心不肯教誨改廢訥學規今年少秀才署學事違犯學規重罪投沒頭帖謗師長者首人賞銀百兩犯者凌遲沒産正德中諡文恪公家西南三里即瓠子堤忠肅構亭曰西隱公更築白雲茅屋其間所著詩文二十卷號西隱集史概佳曰高皇帝嘗敕侍郎張智等曰古之儒者務學以明體適用窮則忠信篤敬以淑諸人達則忠君愛國而澤被天下朕自御宇以來擢用儒士布列百司得人稱任而卒少見效良由師道不立故成材罕聞又曰凡為儒者必恪遵古先聖賢之道以修已教人毋徒尚文藝云其留心學校人才至矣故當時大學士皆適用稽古禮文彬彬多循謹修飭者流而一代之儒術由此懋焉嗚呼盛哉卓敬忠貞公字維恭浙江瑞安人洪武戊辰進士官至户部侍郎性孝且敏年十五讀書寶香山晨昏定省之禮雖遠不廢嘗風雨夜歸迷失道得一兕牛憑之歸比入門引燭放之乃黑虎也公於天文地理律厯兵刑靡不究悉尤邃性理著書五十卷發明周子通書邵子皇極之藴登進士第除給事中嘗言諸王服飾逾制宜早辨太祖笑而納之遷宗人府經歷進戶部侍郎建文帝即位燕王來朝敬密奏曰燕王智慮絶人酷類先帝夫北平者強幹之地金元所繇興也宜徙封南昌以絶禍本夫萌而未動者機也量時而為者勢也勢非至徑莫能斷義非至明莫能察帝覽奏大驚袖之翌日召見榻前曰燕王至親卿何得及此對曰楊廣隋文非父子耶帝默然良久曰卿休矣事竟寢及燕師入京公不往迎首以姦黨捕至抗聲不遜下之獄文皇猶憐其才使人諷之受官姚廣孝銜其素薄已力勸殺之遂不屈而死臨刑從容歎曰變起宗親略無經畫敬死有餘罪神色凛然經日猶如生遂誅三族所著遺書詩文共一百卷門人購而藏之他日文皇嘗曰國家飬士三十年惟得一卓敬門人黃朝光作年譜行狀後朝光子飬正携其小像併書至京求傳侍講安福劉球為作傳且以忠貞私諡之崇禎末補諡忠貞王叔英靜學先生字原采浙江黃巖人洪武二十年薦召仕至翰林院修撰博學有氣節洪武間與楊大中葉見泰方孝孺林佑同徴至京辭還鄉後辟為仙居訓導升漢陽知縣有惠政嘗遇旱虔禱不效遂絶食天大雨復祈晴遂霽己卯召為翰林修撰上資治八䇿曰務學問謹好惡辨邪正納諫諍審才否慎刑賞明利害定法制皆援古證今鑿鑿可行且曰太祖皇帝除姦剔穢抑強鋤梗不啻如醫者之去疾農夫之去草急于去疾則或傷其體膚嚴于去草則或損其禾稼固自然之勢然體膚去疾之餘則宜調燮其血脈禾稼去草之後則宜培飬其根苗亦自然之理也識者知為經濟遠器金聲玉振集與同郡方孝孺相友善孝孺之被召也欲行井田先生與之書略曰凡人有措天下之才者固難能自用其才者尤難如子房之於高祖能用其才者也賈誼之於文帝未能自用其才者也子房之於高祖察其可行而後言言之未嘗不中高祖得以行之賈誼之於文帝不察其能而易言之且又言之太過故大臣絳灌之屬得以短之於是文帝不能獲用其言方今明良相逢千載一時但天下之事固有行於古亦可行於今者如夏時周冕之類是也亦有行於古而難行於今者如井田封建之類是也可行者行之則人之從之也易難行者行之則人之從之也難從之易則民樂其利從之難則民憂其患此君子之用世所貴乎得時措之宜也後孝孺於法制多所損益泥古難行者果如先生所言靖難師起公奉命募兵廣德未幾文廟渡江郡人皆散走兵部尚書齊泰來奔公以泰為二令州人執之既至泰告以故乃釋泰圖再舉知事不可為乃沐浴具衣冠書絶命詞曰人生穹壤間忠孝貴克全嗟余事君父自省多過愆有志未及竟奇疾忽見纏肥甘空在案對之不能咽意者造化神有命歸九泉嘗聞夷與齊餓死首陽巔周粟豈不佳所見良獨偏高蹤遠難繼偶爾無足傳千秋史臣筆慎勿稱希賢復書於案曰生既久矣愧無補於當時死亦徒然庶無慙於後世遂自經死聞者悲之死後妻金死于獄二女死于井或上其所賦詩上曰彼食其祿自盡其心耳置不問初先生將死時貽書天台道士謝希年曰葬我祠山之麓希年收葬之墓在州城西五里許正統中楊士竒題其墓曰嗚呼故翰林修撰王公原采之墓後廣德知州周瑛封植表識其墓嘉靖中編修安福鄒守益謫州判官立懷宗祠祀之太平知縣曾漢才又建忠節祠以祀又有貞烈祠祀妻及二女在黃淡嶴上崇禎末補諡文忠先生以孝稱既仕好奬拔善類楊士奇其所薦達也方正學嘗稱其立言溫粹文章敷瞻紓徐有作者風士奇言先生學純行正子道臣道終身無一毫之茍忠孝二字蓋足以當之又為文以祭之曰先生之學聖賢是師先生之行綱常是持先生之心金石其貞先生之志霜雪其明論者以先生不愧其言云後祠學宫謝文肅公鐸贊曰武王放伐微子已歸千載而下孰敢是非特立獨行惟孤竹君子不惑衆見百世以俟豈其周粟食薇乃甘我餓以死惟義之耽昌黎有頌特筆莫繼我再拜公痛哭流涕表忠録先生自號靜學有靜學集林佑方孝孺嘗序之以傳先生殁後竟無遺稿革除遺事先生云余在衆中往往聞孝子友弟義婦事未嘗不為之感激流涕欲録傳以為後世勸尊聞録周翠渠瑛墓記略云原采死無後墳墓凌夷鞠為丘莽所可識别者僅有楊公之碑而已瑛初為進士時嘗聞其事於其鄉諸縉紳及官廣德余特祭於其墓繼而訪諸故老得其遺事為詳云原采入廣德未幾車駕渡江郡人皆出走原采募丁壯畨上遇齊泰來奔皆潰歸原采以齊為二令州人執之既至告以故其夕原采引決原采死時年未四十蓋其見義之明殺身之勇處死不亂良由有所養非若一忙迫失據計出無所而自經於溝瀆者之比也因念其行義之篤且悲其無後而為修治其墓拜述其事以告後人或議之曰原采建文臣子子不為諱而表章之非罪耶瑛曰不然也自古忠臣義士各為其主耳原采仕建文朝故忠于建文若仕于太宗朝其忠于太宗也必矣況兩朝天下皆太祖高皇帝所經營兩朝臣子皆太祖高皇帝所培植之人物也譬如天地分為四時凡禽鳥感時而鳴者雖春秋之異要皆造化中物未可舍此而取彼也議者謝曰子之言是也麗牲有石其鑱諸朝野彚編君子學古貴乎達權書論分井知公無偏藏裾題案從容絶命二貞雙烈望祠知敬應嗣寅遜國諸臣贊楊文貞微時館漢陽村落中公行部過之聞讀書聲曰兵革之後久不聞此矣異之入視焉文貞避去見案上詩文一編係其所作題曰此公輔器也邀致薦為府學訓導交以文字相推重後審理之除實由其力後文貞訪公之門人張璣詢公有幼子在戍所文貞以百金與同鄉孟範訪得教誨甚篤卒無成文貞曰奈何抱之痛哭復與金若干遣之遂不知所終璣為涿定二州同知孟範後為治中亦文貞所薦公不負國文貞亦不負公人兩賢之遜國臣傳程本立巽隱先生字原道浙江崇德人國初舉明經秀才仕至僉都御史系出伊川上世徙杭再徙崇德少有大志讀書不務章句與海鹽沈夀康友善夀康喪父母葬祭以禮敦行誼南臺論薦與官力辭不就鄉人稱為孝隱先生嘗執手告本立曰世之學者爭務科舉以經學為名而無實吾所不取子之質近厚年且富當志於聖賢之學公遂篤志修檢遜國臣記聞金華朱彥修兄弟得考亭之學於許文懿公乃往就學造詣日深備遺録更從同邑鮑恂貝瓊遊資其開發洪武丙辰舉明經秀才擢秦府引禮舍人召見奉天門下賜馬匹楮幣以母艱去官庚申服除補周府禮官從王之國大梁丁卯從王朝京師被纍謫雲南馬龍他郎甸長官司吏目留家大梁以一僕之任所部百蠻叛逆公單騎深入論順逆利害諸酋落咸感悅歸附西南當王師初靖餘孽尚驕時西平侯沐英布政使張紞屬公統領守禦部內飢即便宜賑恤曰吾為王官禦邊圉豈可以文法自諉坐視夷民生患假令死即死我一身耳救則救此一方民也遂不避艱險山行野宿自楚雄姚安以逮大理鶴慶麗江永昌咸賴其撫綏安輯自是民得安業軍得著伍公之力也戊寅奏計京師應天府尹向瑶學士董倫薦公學行政事宜留中朝徴入翰林充纂修官修太祖實録升都察院左僉都御史食正七品俸辛巳以失誤陪祀調除仍留翰林纂修明年實録成改江南按察副使未及行適靖難兵渡江公遂自經詔追奪恩典家無遺資時稱清御史所著有巽隱集十卷僉事吳昂刋行於閩而林廷㭿序之稱為今之夷齊云革除遺事黃潤玉字孟清浙江鄞縣人舉鄉薦仕至湖廣按察司使生五嵗侍母病夜不就寢家人異其知孝孰師坐立屹然不與羣兒狎書過目成誦孰師竒之十嵗行道上見遺金不拾永樂初詔徙江南富民實北京父艮當行公時年十三輒涕泣詣求代官少之對曰父去日益老兒去日益長少長不庸愈於老乎卒行扺北京受廛都城外十里所沙漠寒沍無人居與同役築室成比閭傾資給徭賦墾圃種蔬以為生人不堪其勞而泰然安之稍隙輒肆力於學以心為嚴師以聖賢為矩矱擇然後言揆然後動間為文辭不作組麗嶄刻之語而理致淵永兩浙儒碩名賢傳都城有富翁獨一女與居招與同賈辭或問何也曰瓜田不納履耳於是里中子多從之學舉鄉薦授學訓導用薦拜監察御史出按湖廣斥藩臬郡縣之不職者數十人威望赫然以楊文貞薦為廣西提學僉事屏浮薄奬賢俊士風丕變改湖廣按察使時巡撫都御史李實張甚藩臬皆折節下之公無加禮而連黜貪墨屬二人皆實鄉戚也實大恚劾之謫和州含山縣惠利有恩已請老去鄧濳谷皇明書公之學知行並進而祈造於聖賢其言曰學聖人一分便是一分好人又曰明理務在讀書制行要當謹獨自少迄耄老不懈性剛介寡交所稱許四方士若李文毅公時勉薛文清公瑄不過數人而已與人言惟理道文辭一語未嘗及世故蓋篤行之儒云鄧潛谷居家簡出日惟玩味經義無厭足平生著述甚冨以朱子嘗欲編禮記附儀禮乃取儀禮分為四卷而以禮記比類附之又以五禮獨缺軍禮因取周官大田禮補之而以禮記諸篇載田事者附焉别為一卷通為之注釋總曰儀禮戴記附注以小學四書諸經注家或遺或誤撰經書補注以大學中庸旨皆淵奧撰學庸通旨以禮記深衣制十有二幅鄭氏誤注為裳遂撰考定深衣古制嘗因安遠侯柳溥問古兵法為注孫子其他備論理事曰南山録雜著詩文曰南山稿皆藏之家吳訥文恪公字敏德南直常熟人永樂中薦舉仕至左副都御史自少穎敏七嵗能背誦五經及長博洽羣書永樂間以儒士薦至召入便殿奏對稱旨留侍闕廷洪熙元年侍講學士沈度復薦訥經明行修授行在湖廣道監察御史出巡浙江揆咨吏治赫然有聲仁和邑庠有髙宗御書九經論孟碑多委布行路公拾湊全楷置之殿廊李公麟畫聖賢像有秦檜為記磨而削之表陸贄奏議修嶽飛墓祠議論舉措有前賢風繼巡貴州恩威並行宣德五年升南京右僉都御史尋升左副都御史居臺十餘年敬慎亷直以老乞致仕宴勞遣之公之學由博入約自體達用以行誼為先至其為文根柢羣經波瀾遷固談及淺學後進曰此韻府羣玉秀才無足道也著有思庵集小學集解性理羣書補注而所輯文章辨體鑒别精詳正統中知縣蔣忠言訥學行醇正著書立言深通治體宜徴赴禁密以備顧問年八十餘卒鄉人以列於言偃祠追諡曰文恪陳敬宗淡庵先生文定公字光世浙江慈溪人永樂甲申進士仕至國子祭酒公由翰林拜南京祭酒美鬚髯容儀端整步履有定則望之者起敬當會食諸生稍有失儀者即待罪不輕容或有所稟嚴於對君之禮古穰雜録公為人矜嚴好禮久居太學力以師道自任嚴立教條痛革舊習日勵諸生進學成德是時瞽宗之政肅於朝廷戶部尚書關中楊鼎初發解于鄉試禮部不第疏乞入南監從公學其為士大夫所重如此名臣録淡菴陳公以南祭酒九載奏績之京時中貴有柄國者勢傾朝野素慕公人品欲致之門下適工部侍即廬陵周公忱巡撫南圻時亦在京進見中貴知其與淡然公同年微露其意周公以其言達之公公曰敬宗忝為人師表而求謁中貴他日無以見諸生中貴又遣人致綵縀羊酒求書程子四針公為走筆書之而返還其禮幣竟不往見故為祭酒十八年更不遷轉於是士大夫益高其風節云郊外農談時泰和王公直為冢宰欲以司寇之任轉升從容問曰老先生久居司成將以司寇相轉何如先生起揖曰某託公為知己豈有與天下英才終日講道論學而顧以桎梏之徒見辱何哉王公頓服卒寢之前輩風節巖巖有如此客座新聞佳按王公於是乎失問矣朝廷任賢授爵亦顧其才何如耳豈有問其所欲而後加之哉先生正言以謝之是已先生遇僚屬諸生極嚴有懷忿而訟之者法司請逮理周文襄謂先生當具疏申悉即為屬草未免有遷就之辭先生見之驚曰無乃誑君公笑曰在法惟奏事不實不果上事亦白水東日記正統間王振擅權聲勢烜赫自劉忠愍公之死公卿大臣多出其門無不望塵趨拜恬不知愧巋然自重不為所屈辱者魏文靖陳祭酒薛文清三數公而已紀聞楊士竒請聞過於先生先生直語焉士竒謝曰公真吾師也先生師道卓立名重一時六館士殆千人凡升堂聽講會饌儀矩整嚴時襄城伯李隆居守於先生最所敬重過其第必留宴宴或出家姬作樂談笑竟日未嘗一目之常以拇指搯中指自持雖酩酊言貌儼然若未嘗飲者其檢身之功如此雜記公剛正介潔不見喜愠官太學二十餘年諸生多位至卿二公獨久不調時北監祭酒李時勉約束諸生身教亦嚴世稱南陳北李景泰元年致仕公德望文章名聞朝野既退家居不輕出入别號淡庵居士有淡庵集十八卷行於時天順元年卒年八十三初與古亷李公同在翰林袁柳莊嘗曳二人並列曰二公他日功名相埒時公儀貌魁梧而古亷頗短小聞者未之信後公以方嚴肅下古亷以公恕得士並著聲太學行方而嚴學優而粹勢利紛如頺然無纍抑抑德隅人望知畏詞林重輕卜其進退師於國子身以為誨朋來是樂不懈于位時有古亷於公作配彭惠安公韶撰贊古亷先生李時勉江西安福人永樂甲申進士仕至國子祭酒先生少負大志甫成童每自勵曰顔曾希聖四勿三省長勤於學問窮性命道德之奧於書無所不讀永樂十九年三殿災求直言條上十五事未幾讒搆下獄二嵗以學士楊榮薦復職洪熙改元公以時政違節乃上疏諫上怒縛至便殿命武士撲之金瑵十八折其脅幾死改御史上章復有規切語又下詔獄宣德元年上恨公言戇觸仁考怒令縛時勉來朕面鞫必殺時勉已又令王指揮縛時勉斬西市王指揮出端西旁門公已為先輩使者縛入端東旁門門中相左王指揮至獄知公入亟走還縳公送西市公已得見上上顧憐時勉忠臣能直言立脫公桎梏復其官預修兩朝實録書成升侍講學士正統初上御經筵命公兼經筵官每當進講必盡誠敬冀有所感悟上亦為之傾聽聞者莫不稱善以為范淳夫其人也上至史館撒賜金錢諸學士皆俯取公獨正立上使前出餘錢賜之先生為祭酒崇亷耻抑競奔别賢否一勸懲士習一變待諸生恩義兼盡貧不能婚病不能醫死不能葬者節縮餐錢力為贍給督諸生讀書寢興有常燈光達旦書聲不絶王振惡先生守正搆以罪荷校國學門諸生石大用上章願以身代哭號奔走闕下請赦公者數千人以故得解尋乞致仕去諸生走涕泣送觀者塞途商賈為罷市又明年聞北狩北面頓首號慟遣其孫騏詣闕上疏言選將練兵奬忠節正名分數事溫旨褒諭卒年七十七諡文毅成化中贈禮部侍郎改諡忠文忠義之事其道鏗鍧百代而其基則係於飬非可以聲音笑貌為者飬盛則建天地質鬼神榮利當前而不瞬卒然臨之而不驚不得其養始慷慨一事卒不能不墮其生平或矜持大間不能不濶略細行故能讓千乘見色豆羮能却萬鍾垂涎一介此庸人之所忽而智者之所察嗚呼微矣豫最有慨於李忠文公不拾金錢一事嘗設處公之地未嘗不懾于天威寵臨不能不俯首以拜君賜也公斯舉也有至意焉人君使臣以禮置金於地令諸臣拾之如嬰兒之取搏黍非所以教臣禮人臣必有不辱之節而後人君有不容不加之禮公以禮期其君則必以忠致其身所謂榮利當前而不瞬卒然臨之而不驚者非公耶元首可喪溝壑可老纓緌可脫公之謂矣昔武帝於黯不冠不見然內嚴憚之公雖袖手上取懷中金與之亦冠而見黯意公卒不得大用有由然矣長老傳公歸田角巾敝履委蛇田間樵𥪡不知公故祭酒家無擔石又時時寫墨竹數本易粟嗚呼今有之乎鄒南臯撰李忠文公祠堂記魏驥文靖公字仲房浙江蕭山人永樂中鄉舉官至南京吏部尚書父希哲洪武中薦知上高縣鋤強扶弱德威並著公以鄉貢士登永樂四年會試乙榜授松江府學訓導尊嚴師道教而且愛學舍諸生有夜讀者身擕茶粥往慰厲之滿九載考諸生詣闕乞留復任三載召修永樂大典以吏部尚書師逵薦為太常博士成祖曰劉履節九年御史先帝方授此官命從北征宣德元年升行在考功員外即轉南太常少卿正統三年召試行在吏部左侍郎踰年實授公為人好分别是非或時面折人而當官亷勤祇慎雖王振亦重之嘗遇振于塗不避車贄振方帕而已居官舍苐擕一蒼頭他日帝御殿召問孰為吏部侍郎公前對帝問公事從容陳奏帝慰是之被命往南京考察所贏俸金臨行莫寄頓有里中同年子為刑曹郎便送付之不復識鑰郎請公怫然曰何待前輩之薄也郎有女壻從郎官如其輕重贋易之比歸召工鑿金金則贋公歎息而已工私公蒼頭曰向有某官舍人託我為贋金無是耶蒼頭入告公曰毋泄寧亡金豈可失歡已郎出知郡謁公求教公曰君為人練事治司空城旦書精審何郡足為苐須簡敕舍中雖在至親不可易忽郎居念公言已郎舍中人稍稍露女壻贋金事郎大驚及入覲如數償公公駭不受曰金具在無易者公為人長厚類如此八年以老辭調禮部特改南吏部尚書己巳之變率諸司條陳討賊䇿畿內瑞麥白之祥悉却勿奏天旱命恤刑有男子某呼寃法司以其年少欲緩之公曰閲獄辭巨憝也天旱正為此何得姑息為獄決而雨景泰元年至京引老請休大學士陳循公門生也詣公曰請需之亡何且以北冢宰處先生公曰君位輔臣當進賢為天下奈何私我耶竟致仕去去乘小舫時阻於津關其子稍立仗舫頭公曰藉重此耶命去之居家二十年時首笠課田與傭畯雜處嘗至郡城舫衝官舟官問之從人曰魏公也官不審公曰第應之曰魏驥尚不審公曰第應之曰蕭山魏不言尚書也年九十八卒先十日大星隕其鄰公就枕口占曰平生不作欺心事一點靈光直上行遺書子完勿請營墳擾勞鄉里既卒而復言辭不亂倏然就化是為成化七年先是監察御史梁昉疏驥有德有夀請如漢故事優禮之憲宗命禮部遣行人存問賜羊酒有司月給米三石敕未至公已卒有司請如例祭葬營墳之使來公有老妾趣完曰爾忘父言乎完詣闕辭免帝若曰老臣清儉身後尚爾遂許辭公朴不勝衣而好學不倦孝友刑家信義動衆居官為良吏典教為明師門生舊屬多有顯人達官自餘方州學職不可勝數諡曰文靖公汲汲成就人才務令以真知實踐為學人咸感激自奮家居布袍粳食不别治生性好吟咏矢口適情不求雕飾自有雋永味既髦年事其兄教諭騏愈恭謹按陳敬亭善杭州府志曰余聞之鄭端簡公曰太祖曰吾取士欲得經明行修博古通今文質得中名實相稱者若文靖輩庶幾近之行誼足以帥人文章足以華國問學足以明道才諝足以濟務隱約足以徼時所謂先進於禮樂者非耶而今不得見之矣知言哉知言哉余道湘湖湘湖人談公遺行多懷思者為企慕久之及過西湖積慶山之原瞻公先世墳墓皆荒廢不治又增餘慨矣朱平涵史概夏寅止軒先生字正夫直隸華亭人正統戊辰進士仕至山東右布政使公幼而岐嶷有巨人志日記數百言稍長益肆力于學擢進士初除南京吏部主事日取羣經及百家言讀之久之發為文章淵閎奧密脫去流俗自成一機杼聲稱蔚然由稽勳郎中拜江西按察副使專董學政崇實黜浮鑒别悉允復文信國祠葺白鹿洞書院修陶侃讀書臺以風勵學者升浙江參政處州民有苦虐政走聚山谷者招之不聽曰須夏參政來乃可公檄至即散還復業進山東右布政使敬簡以容愛民節用有屬以興作者不聽曰勞而不怨斯可公平居以諸葛武侯范文正自期待留心當世聞朝廷政令善喜形於色或有他則不懌終日嘗疏論國家之勢在離合合則安離則土崩今兩京並建其勢宜當合以制天下徐州地連山東飢饉無聊宜在賑恤臨清乃南北咽喉或暫梗焉為害不小宜選大臣有望實者鎮守二邦訓兵屯田示天下形勢廷議是之出內金四萬兩賑徐州命都御史賈俊鎮臨清吳中旱飢公投書巡撫發粟二十萬石糶十萬石三吳併獲以濟他所論列若文廟禮樂之數正風俗立紀綱崇文化作人才之類皆切于政本雖不盡用識者韙之平生誠心直道無黨無援自筮仕為郎二十年為副使十六年未嘗以淹屈降志並華亭志嘗語客曰君子有三惜此生不學一可惜也此日間過二可惜也此身一敗三可惜也聞者以為名言政監跋止軒先生讀書數行並下每試諸生日暮納卷畢則閲卷亦畢當晚衙入揖即一一别言之次早吏胥謄牘以出矣藻鑑人才多在驪黃牝牡之外楊亷撰文集序所著有紀行集備遺録政鑒東遊録史咏等書後學稱止軒先生黃孔昭文毅公字世顯浙江太平人天順庚辰進士仕至南工部右侍郎公體貌嚴重不躁語戲笑沉靜自守厚倫睦族年十四父職方公瑜與母相繼殁哀毁骨立既長執友建寧守賀浤知其賢舉為松溪訓導不果公嘆曰士有志用世乃藉人薦舉耶讀書刻苦至忘寢食吳文定公撰傳清介有守自舉進士即著亷名為文選即持銓清慎汲汲以人才為慮常曰國家之用才猶農家之積粟粟積于豐年乃可以濟飢才儲于時乃可以濟事自頃人矯沽名以閉門謝客為高天下人才何由知之公退客至輒見詢有得必書于册量其才隨其地望參之輿論薦用各當其才或因勢家干請欲私用其人輒力言不可即不能盡沮後其人多自敗衆始服公之正在文選者十五年浙學宗傳公不妄交遊陳恭愍謝文肅獨以道義相好侍即林公鶚既殁念其子孱弱為經紀其喪復輯其事行傳之奉詔舉異才薦應天府尹樊公瑩福建按察僉事章公懋蓋公素所賢者士論以為得人公少刻志勵學畫粥為虀而以米飯食其弟妹好學不倦公暇輒手一册日求古書多自校正讀書尚理致尤精詩格所自著有定軒集若干卷謝文肅言公在文選每見其喜則知賢者之得進見其憂則知小人之不得退如是者蓋十有五年始終一節不少變升南京工部右侍郎三原屢薦公竟未及柄用而卒張莊簡稱公學純志潔公正剛直重如山不依勢以動介如石不逐物以移嘉靖中贈禮部尚書諡文毅吾學編公自始仕以致卿二未嘗一至勢要之門雖禁近中有宦官欲招一揖公亦莫之顧定軒遺録公謂用人莫要于提學得人則能培飬天下之才斯足取用每欲推薦周時可周梁石陳士賢張時敏胡希仁諸公次第用之雖不及盡舉亦可謂知務矣三臺文獻公平居所為不事表暴其深識遠慮能見人所未至如朝廷有某事公私計曰後當爾果皆爾吾哻文山先生字景端浙江開化人舉鄉薦仕終教諭通書易春秋方正端嚴動由規矩以鄉舉入太學與蘭溪章懋安福劉戩四明楊守址交責善輔仁多所裨益既而諸子皆舉進士位大僚而公久不調太息曰親老矣尚可擇祿為耶就江浦教諭迎其父就養教人講學為文而以敦本力踐為先務學東有隙地因沮洳鑿池種蓮亭其中曰求樂與莊行人昶日淪浹道德灑然於吟風弄月之趣相樂也提學御史及按史之賢者並以有道賔禮之久之乞終養歸朝夕養志不違及執親喪一於禮老猶毁頓與弟暕怡怡友愛始終無間言追復遠祖祠田嵗時祭掃為宴集胥訓誥以聯合之有貧乏則加以周恤鄉鄰有忿爭不平之訟皆化息焉日以詩書課其子姓無一毫外慕意獨每聞邊患及郡邑旱潦則憂形於色視公家弊政民所不堪則憤悶太息云章楓撰墓表公學專為已嘗類集朱子讀書法以存心主敬為先致知力行為務不溺於記誦詞章之習自江浦歸家食餘二十年郡邑子弟及四方來學者屨常滿嘗書太極西銘以示為學本原及舉管子思之思之又重思之之語為窮理之要又謂學者曰學貴有用然須是養氣氣充天下何事不可辦故從之者隨其分量各有所得學者即所居稱文山先生鄧潛谷篤行傳御史余亷主事林沂潘府皆薦其才行可大用格不報楊文懿公在吏部欲用為提學亦不果寢疾度不起謂人曰消息存亡之理吾見之已審即死何憾索筆書遺命數條命子孫以耕讀為業忠孝為本喪葬母徇俗為禮既革遷正寢而終所著有五針解朱子讀書法周易傳義會同還山稿諸書楓山章公表其墓有曰其學為已其仕為親有卓其行有蔚其文人之所惜何蕃劉蕡子之所志茂叔伯淳黃潛以字行末齋先生字仲昭福建莆田人成化丙戌進士仕至江西提學僉事公授編修甫三月有旨命翰林賦煙火等詩公與同官章懋莊昶議以為翰林固以供奉為職若鄙褻之詞豈宜進於君上況吾人荷國厚恩恆恐曲學阿世無以補報於萬一又何敢為此鄙詞以自取侮慢不敬之罪哉因上疏極言不可奉旨杖二十斥補外公得湘潭知縣時刑科給事中毛宏等疏救乞復其原職改南京大理寺右評事南京諸司直堂守門𨽻卒皆入月錢公謂既以直堂守門為名而收其月錢以充私用是亦義所不當得者也縱上下相安無有以為非者其於心安耶悉却不受其讞獄務以抑豪強伸寃抑為主有御史縱子弟強取人財物子女者刑部曲為隱蔽公卒駁之有強盜共掠一婦而復轉與人刑部止以強姦坐為首者公必欲皆正其罪卒從所駁公連居父母喪四年不離苫塊食惟蔬果酒不入唇終喪以二親皆逝無為祿仕遂引疾乞休家居十年𢎞治改元以御史薑洪薦起江西提學僉事至則嚴教條以身倡率之勢宦子弟未嘗假借凡經識拔皆一時名士如羅欽順劉玉汪偉陳鳯梧皆是乙卯遂上疏乞致仕再疏始得請公惟以著述為事撫巡藩臬嘗請修志如八閩通志延平郡志邵武郡志皆出公手筆云並事述楊亷撰贊曰挾䇿滔滔藝焉為事獨於名理早所耽嗜翰林供奉豈專文字誰生厲階曲學阿世席未及溫三已三仕經濟抱中多未展試何以見之閩中諸志理學名臣傳章楓山嘗致書曰自先生江西歸後不通音問又幾越寒暑矣直道難行而羣吠紛紛古之君子所不能免先生豈以是為榮辱哉惟求無愧於吾心而已楓山文集張東白曰始君提學命下當道者延見首以得士子悅不任怨為戒扺任勢囑一不徇有所許及有所行亦稽留動踰時或卒不舉意在抑奔趨耳鄉識及下人或乘之有半君殊不疑不恤雖以吾間及之亦不謂然顧或自呼其人靣質之曰張東白云有是曾有是哉蓋其立心無愧而篤於自信如此佳按已心無愧而被人乘間欺了亦是力量不透徹處宋端儀字孔時福建莆田人成化辛丑進士仕至廣東提學僉事幼嘗侍父助教公較文江右時御史陳選監場屋因私試以文深器之授禮部主事歷主客員外郎凡四夷朝貢之使以方物贄見一毫不茍取其或有所求請必條舉典故辨晰開諭使心服而去久之遷廣東提學僉事自其少時已有志泛覽羣籍尚友古人凡鄉之先輩皆考究而知其邪正賢否郡守青田潘琴以郡學所祀鄉賢多勿稱典禮發策詢諸生惟公所對策考論精審潘大加歎賞在禮部署清務簡尤留意程朱正學嘗考正宋史道學傳進程氏門人呂大臨謂其深潛縝密當不在劉李尹謝遊楊之下又以程氏師友淵源朱子已有録以示後學而朱子門人亦多哲士尚未有表著之者因集黃勉齋以下及私淑有得如真文忠諸公凡若干人為考亭淵源録又嘗修祠部典故廣東通志略宋行朝録皆未脫稿其修道南三先生遺書朱子事類鄉賢考證莆陽遺事莆陽舊事偶録立齋間録立齋稿高科考宋氏族譜等書行世儲巏柴墟先生文懿公字靜夫直𨽻泰州人成化甲辰進士仕至南吏部侍郎公幼頴異善屬文年二十餘尚未有家母病刺股求活既卒父欲為娶公頓足呼天足指俱碎家貧無資極力營葬每旦伏哭冢上夜歸苦讀臣林記公淳行清修與物無忤而自守介然在考功出入三年臧否不淆交遊稀寡𢎞治初疏言臣守京陪簡務竊祿無所仰贊邇聞陛下軫念先朝之臣若林俊強珍賀欽等皆起改官資布列清要遠邇傳説莫不欣忭切見前中書舍人丁璣潛心理學刻意躬行效法古人耻隨流俗主事張吉學博行端諳曉政務當李孜省用事之日吉亦鄉人獨不與通且陳數其惡前進士敖育元賦性介直學問深長主事王純議論惇篤負義鯁直此四人者求之時輩蓋不多得上天生才難矣君人者長養成就猶恐不足乃棄之嶺海蠻夷之間與死為伍臣竊痛之臣又見前進士李文祥當陛下御極之初正文祥釋褐之始乃能倡衆敢言補益新政而當時大臣隂行挫抑邇者陛下增補諫官無非欲博聞讜論臣謂五人者既直言徇國於前肯變節辱身於後與其旋求敢諫之士不若先用已試之人伏乞取置風紀論思之地言論丰采必有可觀耿裕在南京時知公而重之及轉吏部尚書奏改為其考功屬一時士人竦然戒曰儲君陽秋可畏也公核一官下考得實裕欲改之公堅不從且曰如公所執何異王介甫時裕與二亞卿在坐大慙良久曰我故知渠非我莫容後為尚書者李裕亦欲有所改考功注貫曰嫌涉堂卿鄉人亦遂不改擢太僕少卿丁繼母艱起補舊職尋升本寺卿孝宗末數召對諸大臣公上疏言起居舍人紀注備録宜實足以傳信貽之來兹在廷臣僚曾蒙召問者且録一時諭對之詞宣付史館有如事干機密不宜宣露進御既畢仍行封識委謹密之臣庋之深嚴之地此貽謨垂憲之基也正德二年擢右僉都御史總糧南京疏糧儲四事皆切時弊明年入户部侍郎公清癯骨立操履不渝劉瑾亦重之居一年以疾乞休其冬仍起左侍即不就居一年復起舊職尋改南京吏部左侍郎卒于官公好賢惜才所交皆正人君子不善人不得一至其門與學士大夫語必及政事文章與家人言居常引賢孝貞烈故事否則端坐竟日而已為文簡古沖淡有晉唐之致平生鬚髮爪甲不敢棄遺沒以殉斂其謹身慎行可類推也初顧璘舉進士邵寶語之曰子持身當以儲公為法自是璘尊事公公無子臨卒時父八十在堂召璘與王韋屬以後事舉筆作國恩未報親養未終八字泣數行下嘉靖初諡文懿時李夢陽何景明等倡古文辭執政者嫉才欲擯斥之公以文章復古為國家元氣故於李何極其扶植得不傾陷公性行淳謹風度詳雅義色法言不可犯干博通古今自宋金元季及國初遺言故迹旁詢博訪歷歷能道欲采輯為一書病未脫稿其言曰知古非難知今為難通達國體者古難其人而況今乎其所述作託諸縑楮金石者皆公之餘耳邵二泉柴墟集序劉玉端毅公字咸栗江西萬安人𢎞治丙辰進士仕至刑部侍郎授輝縣知縣力拯凋弊嵗飢請賑不待報發粟已而郡官閲廩民恐為令纍爭先歸粟擢御史因天變陳六事曰端治本清化原親大臣勵庶官擇內侍攘外患武宗嘉之復疏劉瑾等八黨煽姦宜置之法而顧命大臣劉健謝遷當委任疏入瑾大怒罰輸粟四百餘石旋逮詔獄閲四月釋歸瑾誅起為河南督學僉事轉福建提學副使敦本黜浮表揚靖難之節招降山海之冦遷大理寺少卿改南京僉都御史提督江防聞寧藩變傳檄致詞以舟師往援安慶濠尋就擒嘉靖改元以平濠功擢右副都御史晉刑部侍郎大獄事起下詔獄罷歸卒於家其學一主於誠嘗味齋戒二字謂動靜無間而誠乃可得故終身無浮詞詭行居家孝友信讓時靡間言在官一志奉公守正亷潔之操始終不渝所居僅蔽風雨博通羣籍長於天文地理至軍謀師律儀章法制亦莫不詳究其本末隆慶初贈尚書諡端毅著有疏稿文集行於世劉瑞字德符四川內江人𢎞治丙辰進士仕至南禮部侍郎十嵗能詩文父時斆鍾愛之為作五清書舍期以聖賢之學入翰林授檢討屢有建白武宗初立疏陳十事正德丁卯劉瑾擅政朝廷嘗言事者咸得罪自度不免即上章謝病既出京之明日瑾矯詔斥大學士劉健以下五十三人為朋黨勒令致仕與名其中聞之恬然奉其母行值嵗暮峽險至澧州依親以居時太和陳鳯梧視學湖南檄諸郡邑士子從講學既而臨江蔡潮續視學因以州後間舍更為澧蘭書院延講授院中尋鳯梧參湖藩復檄辰守創崇正書院請主之四方來學者甚衆壬申起浙江提學副使毅然以復古明道為己任其造士先德行而後文藝有一行者必旌以廩食若行檢虧缺文雖工必黜定冠婚喪祭鄉飲鄉射之儀著名宦鄉賢之祀教以釋奠歌舞之節教化大洽會宸濠不軌鎮守太監潛通逆謀其勢洶洶爰與按臣藩伯共定捍守之策兩浙以安用薦歷升南禮部侍郎甲申元日地震條六事以進言極剴切時大禮議起羣臣以諫下獄謫罷者殆數十人復率南九卿諍之草疏極論帝王受命受終之道大宗小宗之義及漢唐宋以來入繼大統之典引經援史凡數千言簡明深切上雖不能從亦未加罪未幾卒年六十有五其學以程朱為宗以居敬存誠為本以窮理致知為要病世之以心學名者空自大而卒流于禪也故操存嚴密德器深厚平居無戲言惰色食無兼味衣無鮮綺尤清心寡欲好學至老彌篤惟痛絶佛老異端之説每遇國有齋醮輒疏諫止性至孝早孤事母愛敬備至既沒哀毁踰禮家廟時祭悉遵禮制持族人服視禮為隆殺近世士大夫未之及也魯鐸文恪公字振之湖廣景陵人𢎞治丙辰進士仕至國子監祭酒改庶吉士授編修謝絶交遊沈潛學問以清節著聞正德初為國子監司業東陽生日其僚長趙永約鐸往夀公曰公何將曰兩方帕公曰當如君入索帕無有躊躇久之曰記有枯魚即取魚往家人曰已食其半矣公攜半魚與永俱東陽欣然沽酒烹魚與飲三人大歡罷以父老乞歸養尋丁艱邑有犬而骨衆共質公公曰兵象也亡何劇賊大起嘯聚劫掠顧相戒無犯魯公家鄉里人依之存活甚衆五年起復職復得告復被命起歷南北祭酒公蒞官虛心約已端飭自勵清慎教士重力行抑奔競而憂時濟世尤為惓切又復請告嘉靖初元起復舊官復以疾辭許之刑部尚書林俊言鐸清約渾晦志尚真純道足鎮雅黜浮學足訂頑起懦請如孝宗用謝鐸故事即家敦促一時撫按臺省先後論薦五推卿佐皆不應命作園曰已有居之造臺闢洞俯仰礙巾幘非稔交深誼不得而造也而與童子俱讀書哦詩以自娛年六十七卒詔諭祭賜諡文恪故事四品文臣無諡公以清節得之先生辭華耽寂養正明恬雖功不及康濟而休風令節激昂貪鄙位不及卿相而榮名重望歆仰物情王廷相字子衡河南儀封人𢎞治壬戌進士仕至兵部尚書丰姿竒秀讀書日記千言十二嵗為邑庠生文有英氣詩賦雅暢選庶吉士與李夢陽何景明崔銑號為四傑授兵科給事中條論時政不避危忌父疾疏歸既沒哀痛踰禮正德中起服謫判亳州升高淳知縣選御史巡鹽山東裁勢豪私販諸弊巡按陜西憲度益振禁革鎮守太監之煽虐者提學京畿中官賄屬事焚其書中官憾甚合力誣搆下詔獄謫贛榆丞升知縣屢遷副使提學敦士節振萎習諸生翕然化之嘉靖初升湖廣按察使李見招亡納叛拒殺軍人捕獲絶其患升副都御史巡撫四川纍升南京兵部尚書改左都御史兼兵部尚書領十二團營以臺政分條類奏帝允行之考滿加宫保亡何郭勛坐罪下獄帝詰其領營敕事因責廷相黨附不行白奏革職為民給事中劉繪疏救不允公歷事三朝以忠誠不欺為先遇事之當為毅然必行自謂大舜雞鳴而起周公坐以待旦不豫過也博古通經究諸實用禮樂律厯象緯醫卜靡不穿通所著有禮樂雜論四十篇夏小正解十三篇答天問一篇雅述慎言十五篇自言志道以來仰觀俯察二十餘年言積數萬其於仲尼之道衛守之嚴不敢異端雜之蓋竊附孔氏之徒云胡鐸支湖先生字時振浙江餘姚人𢎞治乙丑進士仕至太僕寺卿選庶吉士尋改給事中忤逆瑾出為河東鹽運司運副皭然不染瑾敗纍遷福建提學副使其教士一以理學為先而尤邃於易所著易説至與蔡虛齋氏並稱公平生坦易無城府然自守甚介不可干以私身殁未幾子孫至不能舉火姚人稱為真道學云孫文恪升嘗語人曰吾姚仕宦而清貧如寒畯者三人胡中丞東臯宋中丞冕胡太僕鐸時號為姚江三亷云所著有典學説約支湖文集異學辨諸書其異學辨曰象山異其所學好靜厭動是內非外心不盡而欲其存性不知而覬其養此學之所以為異也是以老太極墨西銘蔽錮伊川支離晦庵又曰昔列禦冦託為孔子告顔淵之言曰用志不紛乃凝於神欲其不分所以不用也不用則不知而自以為無不知也象山亦曰人須要用不肯不用又須要為不肯不為而又繼之曰人皆可以為堯舜可以不用不為也孟子曰奚有於是亦為之而已夫不用而不知以用近于二故不用也不知而不為以為近于用故不為也其功惟在於不用而已謂之知行同功可也謂之知行合一不可也然非吾儒之學也堯性之者也名其德者但曰克明之而已舜於禹始以惟精惟一告之大學之格物致知即惟精也傅説之告高宗又以非艱惟艱别之孔子之告哀公又以三行三知别之是固顯然而明較者烏得而泥之嗚呼古之人惟恐人之不知而今之人惟恐人之有知其亦老氏非以明民將以愚之之意歟佳按先生異學辨蓋為陽明而發其所守之正於此可見明儒言行録續編卷一
