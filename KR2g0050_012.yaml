body:
  text: 明儒言行録續編卷二安化縣知縣沈佳撰邵鋭字思抑浙江仁和人正德戊辰進士仕至太僕寺卿舉禮部第一改庶吉士值逆瑾擅政焦芳劉宇深相結納芳子黃中字子仁皆為吉士未幾傳旨俱授編修公以甲第列于仁上亦併授焉恥與為列方具疏辭免會伯兄欽至以危言沮之且曰以會元而得史職亦常分耳公議自在於汝何尤尋以父喪守制歸瑾敗詔革傳奉官亦併及之言者以非其罪浙江通志兩為學使皆以變化士習為先取人必先行誼多士尊信其教翕然向風終太僕卿引疾告歸卒贈副都御史諡康僖公質任自然不為矯飾而言動必依於禮一時稱為端士獻徵録平生於天人顯微道器上下罔不研究宅心制行超絶時俗獨恥於近名不立門戶而暗然日章咸服其為真道學云通志公內行純備其學無所不窺與崑山魏校相友善貽書往復皆聖學精微時政機要沒之日笥無數金田僅百畝語其子勿乞身後之澤人益髙之康僖魁禮闈逆瑾方柄政同年多請往謁公毅然却之曰可使天下後世謂進士謁中要自鋭始邪卒不往及吕仲木為狀元亦不往輿論並髙之玉堂叢語林次崖序公文曰公年少以文魁天下顧不欲以文自見其克已省身致力於道汲汲如也觀其筮仕幾三十年起詞林歷藩臬以至卿寺債負莫償身死之日無以為葬非於道有得乎督學閩楚所至以道師諸生稱盛德者至於今不衰豫嘗與同官見其接人雖在造次無疾言遽色事當喜怒雖甚亦不形可謂有養矣端峯存稿序為學務培本原循蹈正脈嚴理欲之辨嘗勉人曰此心天理只怠惰失之提起此心便是天理放倒此心便是人欲夫安於所未安此學者病根茍病根不除理欲交戰雖學無益也公好論天下事有逺識多格言今天子勵精更化羣哲刮劘公與當路言勉以寬大是崇貽胡端敏書曰大臣義欲有為必其信任日専幾會可即援引善類布列要地俟君志大定國是不搖徐議興革庶保克濟否則恐有異議乘之不惟無益且啓不靖而黨事日滋矣桂文襄公萼為武康令時與公厚善及居政府嘗貽公書竟不答首相聞其名數欲見之卒不往有以相意來風公者第答曰有命按閩時持法不撓後為有力者所銜以是妨于柄用儉庵梁公遷按察使公勉之曰大吾心胸以集衆善廣吾耳目以宣羣情贈韓僉憲汝節之言曰充之以量罔有勿容守之以謙罔敢不服林見素復召胡端敏還司馬咸以進止之義世道之責針之李立卿為方伯贈以言曰風之厚也而後可以負大翼水之厚也而後可以負大舟學之至也而後可以勝大任先民所以建業於商周者蓋可識矣立卿拜而謝之徐咸名臣言行續集黃鞏字伯固福建莆田人𢎞治乙丑進士官至大理寺寺丞官給事中時武宗有南巡之命諸大臣莫敢言者鞏上疏曰陛下臨御以來祖宗紀綱法度一壞於逆瑾再壞於佞幸又再壞於邊將之手至是蕩然已天下知有權臣不知有陛下陛下勿知也恐後知之晚已先儒周敦頥曰聖人定之以中正仁義主靜立人極焉又曰吉凶悔吝生乎動者也吉一而已動可不慎乎故聖人主靜君子慎動陛下盤遊無度流連忘反過動矣古之明王用人之言而顯其身後世不用其言又加罪焉今也又不然臣僚有言時政者左右權臣往往匿不聞言權臣則留中不出而以他中之使其不以言獲罪而以他事獲罪臣故恐陛下知之晚也孔子曰名不正則言不順言不順則事不成陛下無故自稱威武大將軍鎮國公自輕如此則誰為陛下者天下不以陛下事陛下而以將軍公事陛下天下皆將軍公之臣矣古天子有號為獨夫有欲為匹夫而不得者臣切為陛下懼也近者復有南巡之命南方之民流離奔踣爭先挈妻避去即今江淮飢父子兄弟相食天時人事如此重以蹙之幾何不為盜賊也姦雄窺伺待時而發變生於內則欲歸無路變生於外則望救無及陛下斯時悔之後矣居位大臣用事中官親昵羣小豈有真愛陛下之心哉陛下宜翻然悔悟下哀痛之詔罷南巡撤宣府行宫發內帑以賑江淮之飢散邊軍以歸卒伍斥不御之女使還其家夫自古未有小人用事不亡國喪身者也江彬行伍庸流凶狠傲誕陛下賜姓封伯托以心腹付以總督京營使其外挾內擁此騎虎之勢亂之道也天下切齒唾罵皆欲食彬之肉陛下何惜不謝天下哉陛下春秋漸髙前星未耀祖宗社禝之託懸懸乎無所寄方且逺事觀遊屢犯不測收置義子布滿左右獨不豫建親賢毗承大業臣謂陛下倒置也伏望豫選宗室親賢養於宫中待他日誕生皇子之後俾就外藩宗社無疆之休四海之望也帝怒甚下鎮撫司嚴治三加訊杖坐繫一月除名為民歸杜門著述貸米留客日中未爨晏如也嘉靖改元起大理寺丞尋病卒行人張嶽言鞏趨向至髙學術甚正有定心養性之功故氣節剛徑而不激有格物窮理之學故論議持正而不詭加以清修之苦才具之優使天假之年效忠未量不幸數奇身亡中外相弔伏望博采公論量豫恤典士氣民風必有所補詔贈公太理少卿公體質清羸沈敏好學疾病支離手不釋卷林俊比之美玉精金云王思字宜學江西泰和人正德辛未進士仕至翰林編修八嵗能詩十嵗能文弱冠舉於鄉及卒業南雍手書矯輕警惰四字於座求朱子遺像奉以出入丁外艱葬祭不愆於禮成進士入翰林每試必先同官獨不喜為應酬文字甲戍上疏以為孝宗敬皇帝之子惟陛下一人當為天下萬世自重宜親享太廟孝養兩宫總攬乾綱緝熙聖學豈可嗜酒以荒志好勇以輕身惟是任喜怒移威柄弛紀綱摧士氣召天變言極痛切忤旨貶潮州三河驛丞便道省母至貶所郡守闢景韓書院以居之一時士人咸從之遊陽明王公鎮虔臺檄使贊軍議公即偕通衢驛丞李子庸行會寧藩變作褰裳宵赴軍門功成亟歸口不言勞庚辰再入潮請業者益盛諸生録其語嘉靖改元召還翰林補編修預修武宗實録同考會試充經筵講官甲申大禮議起與同列爭疏不報既而曾祖文端公直諭塋有水患得請改葬將歸七月之望復預伏闕號諌下詔獄杖朝堂十四日而斃無以為殮公卿僚舊共賻而斂之以歸年四十有四沈霽字子公南直華亭人正德辛未進士仕至貴州副使從胡敬齋章楓山講程朱之學歎曰此道學正脈也何以詩賦為遂専心正學至忘寢食嘗值江南病水區畫水利六條達於俞都憲行之以利吳民授行人擢御史分司留臺按視江北路出全椒辨寃獄疏請發粟賑飢活者數十萬逆藩謀不軌先露章劾之不報逮駕幸南都屢疏請回鑾言極剴切更念儲嗣未定疏請建宗室之賢以係天下之望諸若備邊任將修德省愆親賢逺佞前後百餘疏時論偉之遷副使肅清海道化盜為民改貴州兵備引疾乞休優旨加參政致仕居家十七年屏絶人事潛玩義理驗之身心務為踐履實學又積數年始知道理皆具於吾心不假外求徒求之紙上而無得於身心非學也又曰某每夜就枕必思所行之事合於理則安寢或少有未合即睡卧不安天明即更其失如事已處而不可更者則書此事於壁後不敢再失也其刻勵不自恕如此卒年八十有五毛憲字式之南直武進人正德辛未進士官至拜給事中疏劾大臣怙勢為姦利者數人內外肅然又嘗申救諌官竇明極陳邊防軍政之壞災異水旱之憂直言不避禍害尋以疾在告久之起居册使荆湘見民被水災即具疏馳奏及論先儒陳澔有功禮經宜從祀會大駕西幸久駐甘肅人情􅍅􅍅特疏請回鑾不報惟時儲嗣未建舉朝諱不敢發首疏請建儲亦不報後武廟將回京有帑賜近臣公獨疏辭不受因謝病歸與同志講求理學考濓洛關閩論説同異會而通之大都以不欺為主以恕為用以克巳為工夫然以克巳為難自謂檢制二十餘年褊性不能盡除晚年匾其書室曰三近齋蓋退然以困勉自勵也其立身治家悉有規格嵗時祭祀一遵家禮置義田義學教養鄉族施愛孤弱自以祿不及親匾其堂曰永思終食不御重味與人有要雖風雨寒暑勿爽於朋徒死生患難之際情誼更篤郡守陳實建道南書院延之主教一郡欽服稱為古庵先生年七十有七卒有司表其里曰崇賢所著有諌垣草古庵文集毗陵正學編毗陵人品記等書行於世王道字純甫山東武城人正德辛未進士仕至吏部右侍郎選庶吉士時山東盜起將奉祖母避地江南疏改應天教授召為吏部主事歷文選郎中大學士方獻夫薦其學行醇正可任宫僚擢春坊左諭德引疾固辭曰朝廷以名器為重不輕假人以不次之官人臣惟義分是安當致謹於非分之獲凡三疏始得旨以病歸而聲望益重居一嵗遷國子祭酒拜吏部右侍郎僅閲月疾卒公英敏絶人精擇強記于書靡不究其要指已由博返約紬繹聖經不欲標門戶自表著久之神解渙然自信所著有易詩書春秋大學億持論多前儒所未及兩掌胄監端軌申約六館諸生翕然向風人比之宋仲敏贈禮部尚書諡文定熊浹字悅之江西南昌人正德甲戍進士官至吏部尚書博學精易成進士授禮科給事中宸濠之將反也錮御史熊蘭及浹至親為質公與蘭以宸濠反狀密授御史蕭淮奏聞世宗即位奉使四川松藩副總兵張傑故倚江彬內援大肆殘墨所箠死千戶以下五百餘人誘殺熟夷上功率家丁遮擊兵備胡澧公疏傑坐褫職邊人快之大禮議起公持論與張璁合吏部惡公出補河南參議而世宗識之召修明倫大典居一年擢右僉都御史歷轉左都御史掌院事公雖以議禮受知顧未嘗附上意旨嘉靖八年京師民張福者自殺母誣告里人柱東厰以聞下刑部坐柱不服福有姊與福鄰人皆證福自殺母刑部請覆審以命郎中魏應召改坐福東厰執奏帝怒三法司及錦衣鎮撫逮問應召覆按福柱事公如應召所改坐再上之帝意公徇庇禠職下應召等考訊侍郎許讚以下皆惶恐謝罪給事陸粲劉希簡以為言帝復怒粲等不待問報先事妄瀆俱下錦衣考訊其後讚等竟抵死柱如原擬應召及鄰證俱發邊充軍杖福姊百以公嘗贊議大禮姑更革職間住十八年車駕謁山陵帝與近直追論舊臣諭吏部起用公尋升南京禮部尚書明年改南兵部尚書二十三年召入為兵部尚書兼右都御史復掌院事踰年為吏部尚書以母年九十求去帝固留之賜粟帛存問帝營箕仙臺公極言仙妄先是楊爵周怡坐諌仙祥禱祠繫獄者久之箕言爵怡於帝帝釋之至是見公言大怒立返爵怡繫獄如故批公疏示大學士嚴嵩嵩為婉解乃罷蓋爵怡出獄方三日爾然帝尚公加公官太子太保兩月坐推舉事一再奪俸公內不自安會加陶仲文伯爵豫恩蔭復疏爭留中遂稱病求退帝怒奪職為民錦衣官校押回原籍當差尋卒公篤好程朱厭術數之學居官恆以不保晚節為慮在田十年足迹不入城府聞朝政失體四方災變輒憂形色穆宗登極復舊官賜諡恭肅金賁亨字汝白浙江臨海人正德甲戌進士仕至闕提學副使為人清粹醇和剛介端毅得於天稟既知學問大指毅然以聖人為必可學動止作息語默酬應務與學俱嘗愛橫渠一時放下則一時德性有懈初學當以心為嚴師及伊川整齊嚴肅則心便一之語日用工夫莊敬嚴密言動有記細過必録及留曹謁告屏居數月取明道延平書反復潛玩乃知工夫過苦責效太迫反入於鋭進助長之病其於澄然真體似未有悟入處於是默坐澄心體認天理一意涵養公居官行政大抵主於崇禮教敦俗尚端蒙養維世淑俗之意惻如也在揚舉行祀禮修釋奠新樂舞斥大僚之冒祀鄉賢者黜無行士之夤緣援例者在閩發明晦庵之學乃闢道南書院以崇祀五先生復詮次其人如明道之表裏洞徹莫見瑕疵如龜山之終日不言嗒然而飲人以和如豫章與人並立而使人化有若春風之發物如延平之氷壺秋月瑩徹無瑕如晦庵之心度澄瑩無渣滓特為表章參驗考證源流明揭書院中具疏請祀羅李二先生於文廟在江右優選志行之士於白鹿書院親與講論聖賢為學次第成就甚衆居家則百行醇備巨纎不茍後學咸稟其身教焉是時新學盛行鄉人方假其名以張聲焰先生存誠守正一宗程朱嘗答應容庵以觀未發一語為程門相傳指訣又作主一辨大指謂如昔人讀書不覺麥漂乃是心役于物不可謂一凡學者須是收其放心易曰無思也無為也寂然不動感而遂通天下之故其一之本體歟孟子曰心勿忘勿助長也其一之要道歟子思子曰篤恭而天下平其一之全功歟曰無適主不往也曰無欲客不入也舍兹而學髙則虛卑則支不足言一矣因自號其居曰一所學者稱一所先生所著有學易記學庸議道南録台學源流及詩文集定海縣志行於世汝白諸父隱君子教汝白以舉子業每嘆曰可惜可惜假令得狀元亦是枉過一生其後汝白舉進士以書督責之曰汝得一第吾不為喜而以為憂此後必駸駸放肆可録逐日言行寄我汝白曰吾終日在側豈不我知而憂我放哉試問一老家人曰比舊漸不同矣乃警懼置一簿録其所為試自簡點其過不可勝書乃大激勵為學卒為善士王述古答金世龍書舒芬字國裳江西進賢人正德丁丑進士第一仕至翰林修撰公幼岐嶷峭穎異凡兒甫成童入郡學嘗作赤雁賦郡守竒其才謂當魁天下家貧清苦不與人羣雖於書無所不讀實勵聖賢之學不屑為博物洽聞之士入對大廷敷奏詳贍忠義奮發賜狀元及第授翰林修撰名臣録時武宗不時巡幸公憂之戊寅春二月孝貞皇后崩踰月即欲往視山陵又革一應儀衛公度其且至宣府遂上隆聖孝疏謂三年之內當深居九重無復外出雖釋服之後儼然煢煢在疚如成王免喪朝廟之時既而又上車服疏謂天子等威莫大于車服而下同于庶人甚非所以辨上下定禮儀也時虞有意外之變故每疏之中三致意焉遂乞恩終養凡五上疏不允己卯春車駕議南巡先是江西宸濠久蓄異謀又結陸完錢寧輩為內應都下人情洶洶危懼公乃慷慨曰車駕出必不利此社禝安危之所係也約諸同志上疏乞留駕言甚激烈有親王倡吳濞之計大臣懷馮道之心復痛刺閣中謂一切危亡之迹不苦言以救而聽主上之自壞時陸完出危言以沮之公邀考功夏良勝儀制萬潮太常陳九川舉酒酹曰匹夫不可奪志吾輩乃為大臣所奪乎遂連疏以入時號江西四君子已而部院寺屬諸僚亦各上疏上大怒車駕不果出下諸臣錦衣獄命跪午門外五日未辰而入終酉而退公嚴整不異平時復褫衣廷杖公以疏首杖特甚神色不異唯口呼髙廟之靈冀以感動上心杖畢幾斃裹瘡卧院中掌院者懼禍使人摽出之公屹不為動曰吾官於此當死於此遂謫福建市舶副提舉即日就道或勸俟痊曰死吾分也敢少留耶時死杖下者十有一人名臣録既至閩布德宣威逺人心服暇則講學不倦生徒日衆初羅一峰劾大臣遭喪起復亦謫此官比公歸閩人宗其道德風節乃立祠以祀二公云未幾宸濠果反公時以外艱歸而鄉多濠黨抄掠不已有請避之公泣曰父柩在堂避將焉往堅卧苫塊中不為動理學名賢録世宗初詔起公復官修撰會議興獻王禮公疏凡三上伏闕待罪再杖於廷明年丁內艱疾作卒所著有梓溪集平生酷好周禮詳加訂正作五官序辨五卷六官圖釋一卷剔偽一卷既乃校定正經六卷共十三卷題曰周禮定本於五經嘗疏論數萬言闡其微旨大抵皆有功於聖門幼以聖賢自期嘗悼異學之謬曰空言無補不若修其本以勝之因取周子學聖有要數語書之座右顧而力行之曰此可遡洙泗之源矣最喜濓溪嘗稱為中興之聖因著太極釋義通書釋義又作易箋問七十餘條一時深於理學者無不推服焉居常溫凊定省出於誠篤比列侍從即委身於國曰此太史公教也至於以犯顔廷諍為説親之實以不愧屋漏為無忝所生之實凡宗社大計如諌南巡之類綱常大體如議大禮之類勤勤懇懇必要諸大道而不敢以末世茍且之説雜焉通籍十年義氣激發諌而杖杖而竄又復諌又復杖而絶無一毫得失之心死生利害之念與朋友相劘切無幾微矯飾尤喜成就後學與之講論事理惓惓於心術之正嘗語曰士當爵祿不入於心溝壑不忘於念平生不事生業家無立壁巡按御史儲良材為小築省城以居其妻孥言行略公始生士人泊舟野江夜半聞曰狀元姓舒沒之前夕門生諶楠夢垂白簾中有六字忠孝狀元止此沒之夕大風雷電伐木鳥巢覆屋其關係如此泰泉黃佐序公文集曰江右大魁惟一峯以道鳴世先生實繼之其䇿名清時同令德榮問同官止修撰抱道而終又同雖儕之伊洛諸賢可也夫豈徒以文傳者哉於天文尤精每言厯象古太史職也中星以日為主七政以嵗為主凡盈虛朓朒伏逆遲留如指諸掌觀望星氣占則必應佐勿能及也又曰先生之為人也其死忠勇其孝感誠其從善敏其自治嚴其禔身潔其處貧樂故能合內外貫天人名理如程朱詩文如韓歐而多所自得然則先生進退存亡其為天下國家所關係豈細故哉佳按先生風節髙天下而其集中有議程正公語豈其於窮理之學有未至歟時方尊王守仁之學公曰必窮天地之髙厚必參百王之憲章必極禮樂之中和語鬼神之情狀與夫萬變之所以應萬物之所以名然後可謂之道問學此則有不可偽為者矣今才智之士飾虛聲鼓後進則尊德性之説易掩覆也黨陸者特竊其末節異朱者未覩其大全非心為道者也公兼知天文曉音律香山黃佐嘗與陵陽梅百一論武王伐殷嵗在鶉火通考象緯不載因推步之嵗自鳥帑旅於龍首我聖祖殄平為漢丁未改元星紀吳分也壬午靖難析木燕分也福德所在其應如響百一歎曰向見舒國裳亦論及此其後佐入史館見公握手曰識公於梅百一久矣自是過從甚歡公語佐曰心術學術相符者也懷居懷利相因者也怠勝敬欲勝義則其心死其學偽吾儕格君其豫在是佐恆衣其德言復言鍾律度量所以治厯明時邵康節粗得大意而不能建律運厯將舉禮樂必也周官乎觀大司樂則厯律備矣佐深韙焉名山藏按黃佐字才伯香山人正德辛巳進士纍官少詹事佐問學該博所著有典禮樂學士張治見所作樂典歎曰簫韶九成可復聞也講學泰泉之墅其學以博文約禮為宗一時士大夫主覺悟而斥絶經書者盡目以為孤陋之人鄭世威字中孚福建長樂人嘉靖己丑進士仕至刑部侍郎方總丱題其齋曰志樂顔瓢貧甘范甑弱冠舉於鄉既成進士會臺臣闕詔從諸進士推擇衆競趨之公曰才脫章句躐司耳目耶授户部郎丁艱改刑部出為廣西按察僉事尋改廣東丁內艱復除江西貴溪夏言再入相諸司往賀開角門延入公便却退呼閽者曰相國固尊然奈何令卿大夫縮縮旁趨還吾刺去爾門者開中門乃入言未子也巡撫汪元錫偕言有事上清宫名為祝釐公從諸司往拜視祝詞乃知為相祈子怫然不拜出轉浙江布政參議言再相過武林公復不與諸司郊迎也轉江西按察副使時分宜嚴嵩代言族黨暴暴張於言矣公輒用三尺繩治有抵重法者獄具巡撫傅將改論公持不能奪也熊副使者嚴姻也以輕直占廢寺田千餘畝公鬻以賑飢熊持相手書求救不得遷四川參政念嵩終螫已投劾歸歸而薪粲不贍耕鋤自力且十年嵩敗中外交薦起湖廣參政南京右通政隆慶初擢都察院右僉都御史華亭相徐階為王守仁學廷議有舉守仁從祀者公言王守仁治世能臣也謂其紹周程宗孔孟則平生庸德有不足矣且其率天下徑趨直行使聖門講學明理之功屏不用將有毫釐差千里失者與守仁同時講學者泰和羅欽順惠安張嶽世稱賢大夫兩相指擊其謬守仁辨不能絀蓋守仁以名勝欽順嶽以實勝實之與名相去逺矣階不是然其事亦寢轉南京侍郎改刑部侍郎會有詔採珠及珍石公疏納忠諌崇節儉不報遂乞骸歸歸而耕鋤如故里中不知侍郎云公在浙江條畫鹽法減無名課數千緡公副使江西時議請贖鍰備庾賑且謂升石而徵之筐篚而縻之是姦國法也取盈於公廩而尾閭於權門是奪民命也纚纚千言讀之痛切至有鍥以傳者通籍數十年朝野參半自對大僚臨下吏與農民處一本之至誠其學一以濓洛為宗取六籍及儒先語日誦繹之録其精者獨證於心曰心嚴毅為師心直諒為友展也宋儒實獲我私年八十二卒禮官言其歷官權貴之鄉媚竈是恥辭榮寂寞之野杜門是髙人謂盡之賜祭葬贈尚書諡恭介史概司冦之學近宗河東逺宗考亭宜乎與文成左也夫文成獨行其是而偽者逃焉司寇內潔心而外潔行力排羣議即逆知已而不恤此豈茍焉而已者臺山葉氏周怡字順之南直太平人嘉靖戊戌進士仕至太常寺少卿少負竒氣居常以邱壑不忘自礪聞鄒文莊倡道南都徒步從之遊兼師事龍溪王公第進士授順德推官以治狀徵拜給諌疏論內外大小臣工幾數千言而大旨則劾嚴嵩翟鑾市恩修怨私訐背詆大敵在前而文武搆釁非國之福上恚疏中有陛下日事禱祀而四方水旱未銷語嵩以重螫已間入詔廷杖下錦衣獄偕御史楊爵員外劉魁同繫五載乙巳採箕仙語釋之閲月復被逮丁未二殿災復釋之既歸猶及事母湯藥數日永訣人謂忠孝所感嵗丙寅居陽山中時與二三知己商訂學問隆慶改元召用擢太常少卿遣祭嶽瀆瀕行疏陳定君志重詔命敬大臣擇左右勤朝政五事忤旨調山東僉事轉南國子司業明年進太常少卿提督四譯館未任卒於家其論學以大同為旨以至誠無息為宗以不愧屋漏為要而尤以曲成後學為萬物一體之驗居恆未嘗特立門户即以忠諌顯卒未嘗自居其名嘗言吾讀孟子尹士語人章羡其惓惓愛君之心直是無已彼一激而去者不過尹士者流耳即斯言以推蓋其忠義之氣駸駸至道矣卒後御史張佳胤郭莊檄縣建祠祀之郡人私諡曰莊簡學者稱訥溪先生有訥溪文集二十七卷行於世王樵字明逸南直金壇人嘉靖丁未進士仕至南京右都御史憲副臬之子留思經術注力躬行授行人奉命出使却餽遺不受負亷望冡宰欲識之終不往見遷刑部主事日讀律勿輟嘗歎曰士大夫専以留心案牘為俗吏文墨詩酒為風雅夫飽食官祿受成吏胥謂之風雅可乎數以執法與分宜相抵牾出為兖東道僉事值嵗大祲奉詔行賑嚴督屬吏躬詣村落人核之里胥姦不行民被實惠引疾歸十四年不起萬厯初起分巡浙西入為尚寶卿御史劉臺極論張江陵罪禍不測上疏請全諫臣以安大臣觸江陵怒即以星變自陳歸里江陵敗起鴻臚寺卿謂上深居獨斷非所以振國勢而收人心疏請勵精聽納急宗社大計歷南京掌院事右都御史致仕素恬默簡於酬對接大僚嚬笑無所徇至與之談經學及星候則斐亹不倦林居謝絶交遊閉門獨坐手未嘗釋卷窮經考義字比句櫛浣衣脫粟朴遫如寒士徒步里中逢負擔爭道無忤容卒年七十九贈太子少保諡恭簡所著有周易私録尚書日記春秋輯傳四書紹聞編方麓居士集讀律私箋等書行於世子肯堂登進士入詞林歷大參負氣敢言好竒博藝亦著有論語義府尚書要旨律例箋釋及醫科證治凖繩類方等書嘗作學記曰明道先生所謂正學者以為其道必本乎人倫明乎物理其教自小學灑掃應對以往修其孝弟忠信周旋禮樂其要在誠乎身而適乎世用自鄉人而可至於聖人具有節序愚以為師以是教弟子以是學然後可以成人材而厚風俗濟世務而興太平公卿百官皆得其人如其不然而卑者溺於章句髙者騖於懸虛經賊文妖如晦庵朱子之所斥勤一生以求道而拾先賢所棄以自珍反肆詆焉如近日整庵羅公之所言是謂教非所教學非所學一旦居於民上非舉其辨髦而盡棄之則以其學術為人害也謂如父母師保之義何哉願吾黨之士勉焉無蹈斯戒周思兼字叔夜南直華亭人嘉靖丁未進士仕至闕僉事知平度州值大祲徒步行賑且設法撫定鄰邑民掠食為亂者逺近悅附擢工部郎督厰清源河將決募民囊土築隄隄成三日秋漲大發民賴以全出為湖廣僉事有五將軍者席藩封探丸殺人遂縛其黨置之獄五將軍臂匕首入因捫其臂曰毋妄動吾為足下百口計足下乃為此曹死耶立却之而條上其罪詔置髙牆其所奪田宅子女悉判還民以疾告歸朝夕専心問學與同邑陸宗伯樹聲西吳唐比部樞相切磋務反求為已以徇外為人為恥嘗自敘中年多疾始知學道有所聞見恐其遺忘輒手録以備諷詠然舉筆即欲搆思語言而為外徇人之私乘間發焉非初志也朱子詩云藥病還須考自知和根斬斷為人機吾欲斬斷此機宜如之何謹之密之勿以示人可也嵗甲子補浙臬旋改為督學使不赴是年卒年四十有七先生雖與龍溪楚侗及禪客往還而信服程朱有素自云某若非旁求顛踣而歸豈能心服朱子之髙又曰陸氏之論驟而聽之似若可喜以身體之茫乎無所用意者治心之要别有其道而未之顯言耶抑朱子之學真有所依據而未可忽也可謂擇之精矣學者稱為萊峰先生私諡曰貞靖所著有學道紀言五卷家訓一卷行於世溫純字希文陜西三原人嘉靖乙丑進士仕至左都御史除壽光知縣下車殱巨冦馬天保以經術飭吏治行勘故大司空朱衡河役費核得其實徴拜給事中發巨璫陳洪不法事雪故經歷沈練寃直聲大振陜西通志時髙新鄭當國出參外藩告歸萬厯初起官太常卿復與張江陵相左告歸建學一草堂引名士講關閩之學因自號一齋江陵殁復起晉理卿纍遷僉都御史兵部右侍郎開府於浙改漕折減織造復陂池人情大悅團操軍聚居會城與居民相嚙牙公諭之以移屯汛地咸聽命軍中老弱疾病有故者勿補遂合九營而為七而兵不知汰轉户部侍郎晉左都御史劉哱之亂畫坐困火攻二䇿遣行間卒破平之嘗請行考選罷礦稅釋逮繫諸臣疏十四上不報乃約諸大臣伏闕泣請上震怒問誰倡者臣純也上亦霽威神廟偶違和詔所司悉舉時政所急如罷稅等公恐中變謀即日奉行頒示天下而司冦以釋繫須再請乃果中變人服公先見妖書事起給事錢夢皋受沈一貫指欲陷少宗伯郭正域正域先以楚事去官而或誣歸德相沈鯉匿之事叵測公力白其誣且言楚宗無反狀守臣文致之以為楚王地耳時公奉命掌內計竟斥夢皋而調鍾兆斗於外皆四明私人也二臣尋被中旨留用廷論譁然二臣乃借楚事訐奏以自解于是少宰賀燦然兩抨之公致仕歸前後三忤執政大節皎然築縣北城建石橋立義田百畝創宗祠著雅約以化俗所著疏草學一堂全集杜詩一得諸書卒贈太子少保諡恭毅柯維騏字竒純福建莆田人闕進士除南户部主事時年二十六即移疾歸烏石山中聚舊業而紬繹之别淆亂訂是非會萬於一及門之士先後至四百餘人傳授靡倦要以躬行為先慨近世學者樂徑悟而憚積纍竊禪家之説以掩孤陋作左右二銘明其意著論纂二卷以辨心術端趨向為實志以存敬畏密操履為實功而其極以宰理人物成能天地為實用至於為學次第懇懇致意於誠之一字謂心與理一之謂誠言與行一之謂誠終與始一之謂誠録所答問釐為心解學解經解上下傳解史解六卷多儒先所未發著宋史新編以宋為正統以遼金附且升瀛國二王於帝紀正亡國諸叛臣之名以明倫先道學於循吏以重道釐復補漏擊異訂訛共二百卷閲二十載而成書作史記考要十卷續莆陽文獻志二十卷其論人謂求道德之士於三代之下必欲如古聖賢難矣但能忠信亷潔以禮義為進退以名節自砥礪此其根本也根本既立雖乏功業文章不足為病根本一喪即富貴功名鄙庸人耳何足取哉别著詩文集十卷續集四卷雜著二卷居常絶迹不入官府力耕節用躬韋布之素有餘則推以佐親黨遇倭亂廬毁於冦鬻田以築小室日危坐其中接人無戲言無茍笑聞人之短蹙然必為之諱期功不與飲燕日惟疏食菜羮而已卒年七十八學者稱希齋先生鄧以讚字汝德江西新建人隆慶辛未進士仕至吏部右侍郎公自幼簡默常聞父與人論學輒牽衣尾其後間出語類宿儒而復勤學習靜斗室神情瑩然官編修不妄交遊慎取豫茹荼飲水吟咏自若江陵當國欲重用公公時有所匡拂江陵勿喜遂請告歸丁丑強起至武林念太夫人未偕遂歸時與王龍溪張陽和約論學龍溪問曰子何功對曰此體無止即以無止為功又問曰信得良知否對曰新建云萬死一生得來豈敢置疑惟是以知是知非為良知竊恐學者妄認耳龍溪業心服而學者咸以公能光明絶學已江陵専甚公遂不出朝夕依太夫人側交遊俱迸有以用世進者曰學不到舍我其誰終非天民書屏几曰天則不言而信神則不怒而威吾儒用世須令天地變化草木蕃始為不負然其功實基於潛如龍不在能見能飛而在能潛倘乘雲霧上青天窺一鱗一爪何以霖雨天下易之密書之微詩之絅皆是義也鄒元標撰志銘佳按斯言實為立心根基與中庸暗然之旨合客坐偶有齟齬者即省曰我未誠耶澄心半刻客竟易顔常曰我常虛而人不礙我不留而人自化又曰從氣上起終是乖戾從性上發自爾中和其虛明如此居家臺省剡無虛日戊子起纂修不赴辛卯起宫允疏辭已拜南大司成又疏辭不允公至有謂公宜嚴者公則純任德化士咸洗心以聽約束常示諸生曰吾非不欲求諸生愧我所無也亦非不欲諸生懼我所有也願以神情與相交勉諸生瞿然顧化公自是益信曰嚴必律身始律身勿嚴誰能悅之晉公南禮部右侍郎轉吏部秉大計人咸稱服署部事疏請建儲者至再忽有三王並封之旨公抗疏力爭上眷公獨覽公奏不置轉吏部右侍郎兼翰林院侍讀學士公復疏病辭上不得已從公請論者謂兹疏默移世軸其功甚大亡何太夫人謝世過哀感疾端坐而逝詔贈禮部尚書鄒南皋曰昔陸象山自幼即悟宇宙吾心公自少即悟心之精神謂聖至終身日化月融精密廣大髙明篤實所與諸生語及楊少宰諸士載佚稿者皆發前人未發世儒卑瑣不足論即以道自任妄以色相莊嚴去公之旨逺矣人覩公六十猶慕一生傍母輒以公至仁純孝不知公不自以為孝也覩公半生林坳退然陋巷輒以為亷靖孤介不知公不自知其為介也人知公衾影無愧一門藹藹以為內行純備不知公欿然不自足也此皆公妙明性中流行時而發之使公得大行所學以一性遍覆海宇者可限量哉墓銘又曰先生科名出處大約與楓山先生同官國子領銓曹亦以在家強起至再至三乃拜海內尊之也若威鳳祥麟共目為希世之瑞韓子云青天白日奴𨽻知其清明先生以之蓋嘗考較二先生學術章則步趨濓洛言動一遵先程矩矱鄧則澄神內照洞徹性體當西江諸儒祖述良知後既不落其蹊徑而亦不遺其精詣務求自得而已元標常窺先生退然陋巷中純誠孺慕外即几案床榻塵埃滿坐而容凝然而神穆然而心窅然有友問曰道何似曰難言再問之急曰知而言未晚絶不得窺其涯涘先生恥為纂述絶不作應酬文字與人接終日不輕吐單詞定宇先生文集序先生曰楊貞復從事於學有年矣豫方幸同官頓然請告就而問之見若眉睫之間若不得其所止而幾求之靜也鄧子曰不然夫學之為心性也靜所以攝心而非心也所以求性而非性也夫是物也在目為視在耳為聽在手足為行持安往而不存焉惡在其必靜也故古之聖賢於惻隱而驗其端於知能而觀其良要以直參其體而已然則動乎曰不然豫固前言之矣安往而不存也善乎古之人曰動靜者時也夫有時而不在非體也有時而不在非用也故功夫可以動不可以靜與可以靜而不可以動其病一也語録下同問作舉業時此紛擾愈甚何如曰作舉業原不相妨如場中七題逐一順手由破承開口做去只沒有患得患失之心就是舉業看得文字自是有力平生苦不能記即三四行書背不得只是看他意思凡書他都有箇意思所謂含其英咀其華自然得他好處非是記他的將别處用程子以琴瑟詩書皆涵養身心之助劉念臺曰近世鄧文潔公晚年學問有得其兄問之曰某近日只查已過病革謂弟子曰萬事萬念皆善都不算只一事一念不善便算劉子節要朱鴻謨字文甫山東益都人隆慶辛未進士仕至刑部右侍郎生有至性五載喪母哭極哀十五補郡庠督學潁泉鄒公竒其文延入衙齋讀書會奉詔考拔貢心屬之屆期不至後問故對曰某終不以師愛我而奪先輩名成進士除吉安推官以最擢御史方兩月間江陵不奔喪杖諸言者於廷即草疏申救奉嚴旨勒回籍遂隱於朱家莊日與馮孝亷受甫講析天人經史之藴居七年起故官巡按江西勵風軌持大體戊巳間嵗祲疏請蠲積逋減窰額俱獲允行晉光祿少卿轉太僕以會議與重臣忤拂衣歸起大理少卿擢僉都御史提督操江巡撫應天時倭事告警公命守要害飭兵器戢姦徒不妄支帑藏一錢曰吾安能以未至之倭憊久安之赤子乎久之倭寂然吳民不困召為刑部右侍郎守法公平戊戍卒貧不能具棺殮諸大臣僚醵金助之其為學一主於誠處屋漏儼對大廷待人無飾詞尊濓洛關閩矩矱如護要領嫉世之談新學者嘗與其門生鄒元標言輒相戒曰吾生平於此理校勘得深吾心不動久矣子無為所惑元標不覺下拜初中會試出趙文懿之門於文懿論國本及救郭侍御皆密有奏記及既沒始有得其稿者善不近名學惟慊已若此受甫稱之曰篤行似吕涇野清介似孟我疆風雅似楊斛山經濟似劉忠宣云沈瑞臨字夢錫浙江仁和人萬厯丁丑進士仕至四川按察僉事授行人歷司正奉命册封餽遺悉絶進南京工部虞衡司郎中尚書衷貞吉嘗稱曰安得盡職奉公咸如沈正郎者升四川按察司僉事備兵川東時楊應龍煽動先生練兵訓武以計拊循之咸惴惴帖息終先生任應龍不敢叛未幾以母老陳情豫終養杜門斂迹精濓洛之書力承絶學龍山天真書院故王守仁講學處也藩臬以名德推先生請主書院先生謝不往曰程朱之後聖學已明學者惟以踐修篤實為本飾浮名事空談非余所能也家貧不治生産巡按御史唐一鵬捐金為葺其廬督學伍袁萃重其亷以學田二十畝備饘粥俱辭不受晚年識詣超卓所著易義十卷經解二十卷探析精微學者爭傳習之稱曰約庵先生卒年七十有二子焜先卒孫從雲有學行前學使者所畀膳田無所歸復與從雲從雲曰吾不忍傷先生志也移旌德祠為祀田浙江通志鄒元標字爾瞻江西吉水人萬厯丁丑進士仕至左都御史公舉進士觀政時輔臣張居正奪情視事編修吳中行祭酒趙用賢刑部員外艾穆主事沈思孝上疏詔廷杖公視四人杖畢而疏上越二日杖八十謫戍都勻衛兩朝名臣記奏言居正才雖可為學術則偏志雖欲為自用大甚諸所設施乖張者一曰進賢未廣二曰決囚太濫三曰言路未通四曰民隱未周即使有利社禝猶大壞綱常况無利社稷若此而可留耶越五年神宗親政録言者拜公為諌官居一嵗復以言事罷是時吳門婁江四明山隂相繼執政公嘗一起為吏部郎亦隨以遷去自是棲遲林皋者三十年陳子龍撰忠介奏議序天啓初始起刑部侍郎遷左都御史與關中馮從吾講學京師科臣朱童蒙等媚璫劾之福清申救豫告歸未幾逆璫復矯旨削籍卒崇禎登極贈官太子太保諡忠介公天性慷慨毅然有難犯之色至其議論則從容以和粹然一本於忠孝公歷三朝垂五十載始終一節天下觀其進退以為治亂陳子龍撰奏疏序倪元璐劾楊維垣疏略維垣怪臣盛稱鄒元標夫謂都門聚講非宜則可謂元標講學有邪謀則不可逆璫毁書院逐正人箝學士大夫之口自元標以偽學見驅而逆璫遂真儒自命學宫之席儼然抑宣聖為平交使講學諸人而在豈遂至此趙南星曰方其弱冠通籍於言不諱犯城狐社鼠之勢逺戍夜郎幸而生還洊歷榮要復以直言再貶天下之人皆以為剛者而不知其好學也剛而不學僅足為氣節之士耳及其歸而求友聚徒著書立言闡明聖人之學人皆以先生好學而不知其所學者仁也今仁已成矣仁則靜合于太空而動緣于天倪不見其剛安有氣節淳古既逺中庸鮮能世所謂豪傑之士大都皆厲氣節以為名髙謂為極則事以終其身此先生之所鄙而不屑也鄒爾瞻文集序陳龍正曰南皋鄒氏少以直節顯後其學純尚禪而輒援四子周易以傅會之講論倐彼倐此無實見無定指自以為入神而君子嫌其多遁辭也今存其近真者諸儒語録卞編孫鍾元曰先生少以威稜氣節著稱已而投荒萬里家居三十年涵養消融歸於沖粹可謂近代之醇儒所著有存真稿願學集及奏議若干卷詩多疏直平淡有儒者之風嘗答友人曰學問中一段機權詭譎之術先賢決無此家法又曰學者不可先橫一是非同異之心在胸惟當自參自悟久之自不言而喻又曰世多虛談害道者皆由實學者鮮不足以轉移之若實學者多則虛者自消答吕新吾云足下終日省過僕竊謂吾儒之學有大頭腦頭腦既定譬之大將威望有素小小姦宄亦自滅息若終日在過上盤桓是破屋止賊滅於東而生於西終不能禦賊枉費精神耳答方鳳軒云學以培養天地元氣為主若自己身上做得光潔于他人身上全然不管此於世間稱好人而元氣亦薄矣説明德即説親民一民失所引為已責古人往往如此世人相見訴窮便是貪欲影幌這窮字斷送了多少豪傑試看先輩赫赫者大段窮人如何他便耐得今人便不耐此處不可不思徐三重字伯同南直青浦人萬厯丁丑進士官至刑部主事授刑部主事時政尚綜核獨持平恕匡矯甚多尚書嚴清知其詳慎使掌封事每有疑獄必咨度焉以疾請歸念父老遂致仕依親以居曲致孝養父卒慟絶而蘇少故博洽工詩文謝病後一切棄去心性命之學以朱子為宗操行端潔門庭肅穆坐無雜賔卒年七十有八學者稱鴻洲先生所著有庸齋日記信古餘論牖景録采芹録鴻洲雜著徐氏家則諸編行於世楊東明字晉庵河南虞城人萬厯庚辰進士仕至刑部侍郎為諸生時沈敦固絶無機械屹然有必為聖人之志授中書舍人遭父喪哀毁踰禮葬祭一遵紫陽家禮而衷以情理之安服闋補原官考選授禮科給事中神廟靜攝君臣暌隔東宫未立公疏凡數十上癸巳河決大祲齊梁淮徐之間方數千里人相食疏請賑又繪為流民圗上之神宗惻然遂出帑銀數十萬往賑以分較禮闈中式人數不如例公爭之為總裁洪都張相國所憾左遷陜西布政照磨領差歸歸而興學講道弟子執經問業者百餘人與鄒南皋馮少墟吕新吾孟我疆張陽和魏見泉楊復所往復疑義勿明勿措家居二十七載光廟御極以廷議起太常少卿升光祿卿尋轉南京通政使未行升刑部侍郎平恕明允會有挾私謂決獄無斷者引年乞休得旨歸天啓甲子卒年七十有七理學宗傳公毅然以斯道為己任其剖析性命微旨詣極超悟踐履實地則宗法文清尤於二氏教闢之不遺餘力晚年著性理辨疑興學問答論性臆言山居功課等書范文貞景文贊曰論公之心則濟世安民之心論公之志則繼往開來之志論公之學則躬行實踐之學論公之品則渾金璞玉之品進則奠安社稷退則澤被閭里真天民先覺間世真儒直接洙泗嫡傳並駕程邵諸子道全德備仁至義盡優入聖域者矣其論性臆言曰盈宇宙間只是一磈渾淪元氣生天生地生人物萬殊都是此氣為之而此氣靈妙自有條理便謂之理蓋氣猶水火而理則其寒熱之性氣猶薑桂而理則其辛辣之性渾是一物毫無分别夫惟理氣一也則得氣清者理自昭著人之所以為聖為賢者此也非理隆於清氣之內也得氣濁者理自昏暗人之所以為愚不肖者此也非理殺於濁氣之內也此理氣斷非二物也正惟是稟氣以生也于是有氣質之性凡所稱人心惟危也人生有欲也幾善惡也惡亦是性也皆從氣邊言也蓋氣分隂陽中含五行不得不雜揉不得不偏勝此人性所以不皆善也然此氣即所以為理也故又命之曰義理之性凡所稱帝降之衷也民之秉彛也繼善成性也道心惟微也皆指理邊言也蓋太極本體立二五根宗雖雜糅而本質自在縱偏勝而善根自存此人性所以無不善也蓋氣者理之質也理者氣之靈也譬猶銅鏡生明有時言明不得不兩稱之然銅生乎明明本於銅孰能分而為二哉氣質之性四字宋儒此論乃適得吾性之真體非但補前輩之所未發也蓋盈天地間皆氣質也即天地亦氣質也五行亦隂陽也隂陽一太極也太極固亦氣也特未落於質耳然則何以謂義理之性曰氣質者義理之體段義理者氣質之性情舉一而二者自備不必兼舉也且氣質可以性名也謂其能為理義也否則塊然之物耳惡得以性稱之問孟子道性善是専言義理之性乎曰世儒都是此見解蓋曰専言義理則有善無惡兼言氣質則有善有惡是義理至善而氣質有不善也夫氣質二五之所凝成也五行一隂陽隂陽一太極則二五原非不善之物惟是既云二五則錯綜分布自有偏勝雜糅之病于是氣質有不純然善者矣雖不純然善而太極本體自在故見孺子入井而惻然遇呼蹴之食而不屑氣質清純者固如此氣質薄濁者未必不如此此人性所以皆善也孟子道性善就是道這箇性從古聖賢論性就是只此一箇如曰厥有恆性繼善成性天命謂性皆是這一箇性孟子云動心忍性性也有命焉則又明指氣質為性蓋性為氣質所成而氣質外無性則安得外氣質以言性也自宋儒分為氣質義理兩途而性之説始晦佳按太極固亦氣也特未落于質耳其論甚精周子明説隂陽一太極也可見太極亦是氣但渾然不雜耳若説是理分明是理先氣後這理著在何處如何生出氣來譬之一株樹太極是根本隂陽五行是其枝葉一本所生如何根本是一物枝葉又是一物可知理氣之非二也明矣至先儒言義理之性原非外氣質而為言晉庵以為一物分為兩物而駁之亦未細審於程張之説矣略有所見輒議宋儒便是明季講學諸公通病也章潢字本清江西南昌人萬厯中徴士操履純白學問淵深早失母事父盡孝待弟盡愛萬厯壬辰聘主白鹿洞書院有為學次第八條以教學者時論擬之胡敬齋云與新城鄧元錫安福劉元卿並號江右三士關中王之士敬訪之結交而去南昌守臣范淶特疏薦以為徐稚之侣乞賜登擢上可其奏下詔徴焉著有手録圗書編闕卷凡天文地理人事禮樂刑政邊防河道以及兵機厯數巨細畢具又著大中本言周易象義春秋測義皆獨抒心得學者稱斗津先生嘗曰學不本諸身心性命而祇尚記誦博洽以相髙者無足論也然仲尼至聖猶韋編三絶好古敏求四教四科未嘗廢文學也故説命曰學於古訓乃有獲凡六經四書孰非古先聖賢之遺訓乎近之談學者棄往聖之典墳鄙宋儒之成憲一切私心自用遊談無根自任穎悟頓修標立宗門謂能使不識一字之凡夫立躋聖位不曰皋夔以上何書可讀則曰六經乃吾心之注腳而習其教者立異説侮聖言悖聖道殆不可救藥矣王述古字信甫河南禹州人萬厯己丑進士仕至山西右布政使為刑部郎中值妖書獄起司冦受四明沈一貫指囑令誣坐郭正域以及沈歸德公正色曰若是則分宜再見力持不可比會鞫無驗立具疏送大理諸人劫之再四禍且不測卒不易原疏一字疏上事得寢未幾又當楚藩之獄司冦以華越謀害親王當論死郭正域主使宗室當如越罪公徐語之曰果爾便欲駢戮數十宗室楚宗聞之勢必戕殺撫按大亂之起誰則為之司冦悟事得寢於後戕殺撫臣卒如所料甲辰出知常州守正抑邪諸上官大璫率為斂屈而與武進薛元臺無錫髙景逸共論學以艱歸補保定晉山西副使兵備陽和奉旨會議代藩廢長立幼事公言祖宗定法有嫡立嫡無嫡立長代王內助張氏不得進妾為妃次子鼎莎不得改庶為嫡且引嘉靖秦府事例雖已奉旨乞請旨改正汪中丞用其言代議遂定扯酋物故請封事起五路要賂無算不決者五年矣公力請循往例毫不增減且忠順求婚兀慎擺腰等酋求賞其情更切欛柄在我可操可縱何故倒授於人時五路擁衆城下不懾制府動色相加不懾同事者以貽誤邊疆相坐亦不懾既而忠順故卜酋款降人馮大梁以故亡去浮賞盡革諸使絶望乃帖然就封往年用撫賞八千餘金今不及三百金敘功晉按察使再晉右布政會中朝門户相軋乙卯式士之録至有云以六經亂天下者公昌言排之坐是偃蹇除目卒於陽和初好天文律厯之學後乃邃於道嘗曰四時行百物生默識之義也默識章是聖人做不了事何有於我與堯舜猶病意同又曰孟子夜氣是萬古求仁時候嘗舉六經子史疏於四書之下名曰屑考别著有易筌律筌厯筌等書一言一動皆足垂世立教學者稱中嵩先生髙忠憲公撰行狀曹于汴字自梁山西安邑人萬厯壬辰進士仕至左都御史為諸生時與盱眙馮應京以聖賢之學相磨礪講求兵農錢賦邊防水利之要訂經世實用書成進士授淮安府推官擢給事中論奏皆天下大計萬厯庚戍與髙陽孫承宗分試南宫所取多名士以吏垣掌內計佐太宰富平孫丕揚斥小人之渠率其黨相與磨牙爭之久之公與富平相繼引去泰昌元年以太常少卿起家屢遷都察院副都御史居憲府雙藤倚戶外百僚肅然有顧太康之風遲重寡言人或以衰晚目之及東警薄都城諭劄日數十下條對商確不移漏刻詰姦警備旋至立應精強少年皆斂手歎服旋晉吏部左侍郎公薄嗜欲勇辭讓進禮退義不失尺寸當推少宰時越關中馮恭定而用公小人藉是兩惎之公固讓不可不旬月堅請去旋去逆閹之難作而東林之黨禍烈矣戊辰崇􅍬改元召公為左都御史未幾閣訟起公據法守經力為糾正久之以年老乞身庚午致仕歸卒於家年七十有七公為人孝弟忠信明允篤誠立朝務持大體論人務取大節主持名教愛惜善類其天性然而於小人有所彈劾處分嘗惻然如傷有一言可採寸長足録未嘗不引而進之其或反唇相稽操戈入室惟引咎自責退而忘其誰某也萬厯中黨議播於庚戌而煽於辛亥二三小人飛謀釣謗以一網盡東南西北之君子公佐孫富平稍剪其勾萌撞其機牙而滋蔓潰決不可禁禦卒至旋出旋退以公俯仰三十年雄倡雌和黨同伐異以人國為孤注與黨論為終始天下事遂不可問矣公之學唯仁與誠仁則無我好賢疾惡皆一體也何惜乎黨議誠則無偽直內方外皆天則也何畏乎學禁公真有本之學哉理學宗傳先生答李贊宇書曰夫道無之非是無人勿足講學以明道士農工賈皆學道之人漁牧耕讀皆學道之事隆古無講學之名其人皆學故無名也國家以文學取士天下學校無慮千百章縫之士無慮萬億蓋令其日講所謂時習所謂孝弟所謂性命仁義而以淑其身待天下之用也乃人心不古遂有口耳活套掇拾粉飾以為出身之媒師以是教上以是取恬不為異非其質矣而於立身行政毫無干涉于是君子厭薄其所為而聚徒講道人遂以道學目之若以為另是一種豈不惑哉然講學之中亦或有言然而行不然而藉是以干貴人捷仕徑者而其名為道學也是有口耳活套之實而更美其名人誰能甘之則羣起而相攻而講者益寡道益晦矣大抵所學出於實則必暗然自修不論大節細行一一不肯放過雖力量不同未必盡無疵而不自文以誤人也所學出於名則有張大其門面而於其生平未純處亦曲為言説而謂其為道夫夷之隘不害其清惠之不恭不害其和然亦何必曰此隘此不恭正道之所在而陋孔子於下風乎羅近溪逢人問道透徹心體豈不可尚而濶略處亦誠其病乃學者得其濶略以為可便其私也而或多不羈誠有如止庵疏所謂賄賂干請任情執見等説是其坐女子於懷而亂之而猶侈然薄魯男子不為也而可乎但今因止庵之疏而遂禁其講是因噎而廢食夫此學乃乾坤所由不毁何可一日廢也似更當推廣而俾千百學校億萬章縫無不講以及農工商賈無不講才是而其機則自上鼓之若得復辟召之典羅致四方道學倣程子學校之議布之天下以主道教於一切鄉學社學之衆漸次開發而申飭有位之士以興學明道為先圖其學則以躬行實踐為主隨其人之根基引之入道或直與天通或以人合天或直臻悟境或以修求悟夫天人合一修悟非二舍天而言人舍悟而言修則淺近時學者知皆及此然言天矣而人尚未盡言悟矣而修且未能世豈有能致中而不能致和能正心而不修身者哉則不可不戒也大扺果能合天則必益盡其人事果能真悟則必益盡其真修堯舜文王孔子何人也而兢兢業業望道未見徙義改過沒齒以之也髙景逸曰吾見貞豫先生於長安中終日欽欽目明耳聰手恭足重叩其中空空而無適也可以證性矣夫性空言之則無朕也實證則有象也先生非其象乎故先生居鄉孚鄉立朝孚朝告君者足以定羣囂明國是告友者足以明學術闡道奧見於咏歌者足以暢天機流性藴所謂循是而動不違其則之道也此之謂性此之謂善先生致政歸設教宏運書院日講天人性命之學當時稱為明學貞豫先生著有共發編仰節堂集行於世解州志馮應京字可大南直盱眙人萬厯壬辰進士仕至湖廣僉事才髙學博早嵗知名由户曹擢湖廣按察僉事率紳士講行鄉約務以化民成俗心苦力勤值稅璫陳奉貪噬無厭先以好語諭之再嚴袪其狐鼠奉終勿悛乃疏其違旨九事未得命竟為奉黨誣傷初僅降謫楚士民伏闕交章乞還原職者以數十萬計上愈怒逮訊下錦衣獄坐以擅殺中使罪禁錮八年日與同逮襄陽司李何棟如荆州司李華鈺講學論易參研於主靜窮理之間更詳考太祖制度而表章之甲辰上感天變放還里復冠帶以疾終學者稱慕岡先生所著述有朱子録要經濟實用月令廣義等書行於世吕維祺字介孺河南新安人萬厯癸丑進士仕至南兵部尚書父心學有隱德以孝稱里閈公為諸生時即毅然以聖賢自任授山東推官以孝弟感民民為之化擢吏部郎清餽遺謝囑託當熹宗未正位人心勿定先請見於慈慶宫門抗疏調護聖躬內侍不許干預政事旋豫假省親八年居家立芝泉書院與張抱初修明濓洛之學時天下方以講學為諱逆璫銜之幾中危禍推考功矯旨另用戊辰懷宗御極起尚寶卿轉太常卿上防微八事授南戶部侍郎清核侵冒以百萬計任五年餘餉可支三年庾實不苦竭授南兵部尚書汰冗登勇兵實不濫復辟多士立豐芑大社講明正學未幾以父病乞歸集郡士立伊雒社以守先待後自責與王惺所張泰宇李虛齋王文苑孟守鍵許松麓劉澄逺諸人大會於正學書院講太極周易發明致中和之義嘗述象山之言人不可以無學猶魚不可以無水賦人之形而不求盡乎人之道虛生浪死其在富貴者適足以播惡遺臭戊寅流冦詭撫當事者議安置河汝人心洶洶如沸公力為挽止冬十二月賊勢猖獗侵窺河洛率家人分守北城罄家資勞軍士辛巳正月十九日賊抵城北縋家人殺十餘賊次日西城忽潰諸子以無守土責為言公曰受國深恩與城存亡義無可逃况讀聖賢書所學何事賊至被執曰非吕尚書耶稔知公善當謀出公艴然賊遂掖出城門賊首曰吕尚書今日請兵明日議𠞰何逼人太甚公厲聲罵曰恨無兵馬殺汝狗彘事至此止有一死賊令之跪罵愈厲北向拜闕西向拜父母與福藩同被殺觀者皆相視流涕先生嘗言一生精神結聚在孝經二十年潛玩躬行未嘗少怠每論孔曾相傳得力於戰兢十二字故曾子易簀示門人曰吾知免夫非謂免於毁傷蓋戰兢之心死而後已嘗疏進孝經請頒學宫所著有孝經本義或問大全存古篇明德堂集奏疏音韻日月燈行世嘗作石隱先生傳以自况學者稱為豫石先生弟維祮問講學為人所非笑何以處之曰講學不為世俗非笑是為鄉願講學不到使非笑我者終心服我是為鄉人講學必立崖岸欲自異於世俗是為隱怪講學不大倡其道於天下後世以承先啓後自任以為法可傳自勵是為半塗之廢鹿繼善字伯順直𨽻定興人萬厯癸丑進士仕至太常寺少卿性端方確謹巍然如斷山少以祖父為師讀王文成傳習録而契之慨然有必為聖賢之志成進士與吳郡周順昌以節義相期勉選户部主事後起改兵部職方主事壬戍孫髙陽以閣部督師公請從在師中多所經畫而口不言功功亦不及循次轉員外升武選郎中而忌髙陽者百計阻之遂與髙陽同歸家居四年學力日充崇禎初起尚寶卿升太常少卿修明職掌未三載復請告歸公之學以認理為主而言理即在事上故其言曰讀有字書却要識沒字理則公之自得可知矣丙子秋七月東兵破定興是時公移疾江村無城守之責毅然授兵登陴守七日而城陷兵挾刃逼公公不為動遂死之事聞詔贈嘉議大夫大理寺卿廕一子入監諡忠節專祠豫祭所著有四書説約認真草三歸草若干卷孫鍾元理學宗傳公亷直介立清操絶俗解官歸門人日益進每拈尋樂大旨及説約一編日與同人諄復口授先是神廟末年髙景逸馮少墟鄒南皋講學京師同志者邀公聽講既而聞相戒不言朝政不談職掌公曰離職掌言學則學為無用之物聖賢為無用之人矣遂不往後數年與景逸偶遇於朝房辨析疑義景逸恨相見之晚具疏薦公佐髙陽蔡懋德字維立直𨽻崑山人萬厯己未進士仕至山西巡撫都御史甲申徇難授杭州推官以最徴有以吏部餌之者公謝之補禮部以不拜璫祠乞差歸里崇禎初督學江西登白鹿洞著鹿洞成規立書院與諸生講學及孝經大義聽者感泣備兵嘉湖退海寇劉香擒巨冦屠阿丑廷臣以知兵薦歷井陘寧武濟南諸道所至有折衝禦侮功崇禎壬午升山西巡撫特賜召對陳言靖冦之䇿當使民不為盜欲民不為盜在使窮百姓有飯吃極陳恤民諸事又言平治大道當從大學提綱挈領若節目上逐件照管便煩難不舉上是之賜饌賜銀幣抵任後以安撫百姓為急改三立祠為書院與諸生講理學經濟文章立干城社以招竒謀異勇之士三晉晏然會闖賊破潼關三秦淪陷公孤軍捍禦守河干四閲月守危城三晝夜甲申二月無援城破草遺疏遣人上報天子入三立祠自縊死中軍應時盛從焉文武將吏同死者四十六人先是李自成遣牌招諭公碎其牌斬其使自成恨之乃驗尸刃首棄之水溝標官段可逺求而得之瘞太原南門外之東岡賜祠諡忠襄劉理順字復禮河南杞縣人崇禎甲戍進士仕至左春坊左中允兼翰林院侍讀甲申徇難好濓洛之學敦尚古道持論不為偏苛而人皆敬畏之舉萬厯丙午鄉薦所居一茅屋子某崇禎初亦舉鄉薦偶有所關説公撻其子而還其資領鄉薦二十有八載困約甚不改其素里中無不重劉公為人崇禎七年始成進士廷試前一日閣擬制䇿問有預得其稿者人皆夙搆成及對果如所聞公獨至期詳覽制詔中增一事上所自發問也條對甚悉閣以李焻名首上上覆閲諸卷獨公對稱旨親擢第一甲第一人由此心倚重之授翰林院修撰十二年二月上言六事作士氣矜民窮簡良吏定師期信賞罰招脅從上是之十六年進左中允時闖獻二賊陸梁連陷楚豫秦晉諸郡縣朝廷起大師命重臣訖無成功公故無軍旅寄然君國之憂內切於心外形諸顔色於經筵講讀時每痛切言之十七年三月丁未聞召對晨趨朝户部右侍郎吳履中大理卿凌義渠先在相與咨嗟歎息而已傳城陷賊入矣三人相顧駴愕倉皇歸隨聞上徇社稷公撫膺大慟曰臣荷特簡不能出竒殄亂致逆冦披猖以有今日臣罪何辭遂北面稽顙書絶命詞投繯而死妻宜人萬氏妾李氏俱從死頃之賊數百人至寓云欲保護劉狀元而公已死相與叩頭號慟去蓋賊帳下多中州人素稔劉公德也劉念臺哭公詩曰公之徇國也自妻子而外若壻若外孫若僕從無一免者以時而言玉汝第一以事而言公第一嗚呼聖矣乎佳按此念臺先生當時所聞異辭余嘗問之睢州師云止妻妾從死耳良玉維溫金礪寒一回把袂一回看周情孔思推同調方矩圜規式大官十族止憐朋友在九原誰問此心安異時伊洛推人物誠敬淵源似爾難有同年子候先生因問曰聞中鼎甲者手紋直透中指有諸先生舉手細視曰想是幸中未嘗有此耳其寬宏不拒人如此先生幼孤奉母至孝稍失意輒涕泣母悅乃已事兄如嚴師弱冠舉於鄉久之不第以風教人倫為己任恬淡自持嘗語人曰學貴絶欲吾生平困於病然其所得卒亦不出此也擢廷試第一烈皇帝喜甚顧左右曰朕今日自擢得一德行耆老蓋以先生歷十試且䇿語多危論也授修撰司起居注管理六曹章奏纂修大明會典先生皆與焉為經筵講官開陳詳切上每嘉納之太子出學復選任焉嘗入侍東朝一宫僚以體豐滯几間太子忽笑衆皆笑先生挺立端視丰采隱然太子笑為頓止上聞愈賢之兵部尚書楊嗣昌議奪情忽中旨內用中外駭然相繼論劾嗣昌力詆言者曰君綱在父綱上戰國分裂誼固可逃天下一家無可逃也先生深疾之既而易吉入閣先生大痛即歸草疏曰嗣昌果有嘉謀即在兵部儘可入告如劉大夏戴珊故事以候服闋入侍未晚豈有政本之地先忘其親乎且嗣昌只宜引罪豈宜罪人君綱父綱之論悖道極矣嗣昌殆病狂喪心者耳嗣昌見其疏深銜之已而館中皆謁賀先生又不往復向所親曰文弱不能滅賊可謂進退失據矣於是嗣昌大怒嗾忌者奪其講席轉展書先生不起久之上念其名遂卑經筵兼知制誥其在制誥也雖撰豫不一率皆端士勞臣鼓忠褒勤之詞至於宦官恩幸為上所寵幸者終不得邀其一語故當其視草競相詡曰此劉公語也持之以為榮是時闖冦蹂躪中原先生習知冦形且以諸將無辦冦志不過輦金錢集都門分賄權要為蔽隱計而秉銓司樞職封駁者亦憑是為豫奪奬劾感憤隱憂義形於色每於衆中論天下大勢以為積薪厝火禍將不救汴圍急復議援𠞰之䇿請分屯河北撫練死士如李抱真澤潞事以圖恢除當事率以為狂不能用也繼而賊破潼關入三秦先生歎曰事去矣遂遣其長子歸留妻妾處京師自分必死甲申三月賦薄都城先生括所得百五十金送城上犒守者翼日黎明入朝欲請上發帑金募死士為背城計抵長安門警衛散落覲班寂然遇一宦者曰大家已不知所在尚欲誰謁也是時城中賊騎充斥還至寓有門生來謁請所向先生曰既及吾門須辨一忠字客去送之如平時乃具袍笏北面再拜起書一紙曰成仁取義孔孟所傳文信踐之吾何不然既占科名豈敢茍全三忠祠內無愧前賢筆勢端徑無異暇時寫畢正冠投繯而盡甲申諡文正國朝改諡文烈與祭田春秋致祭田蘭芳撰傳先生生平學問以誠為主一言一動必凖於禮造次顛沛未嘗稍違親戚子弟無少長每見必正容揖讓即密友終未見其嬉笑燕惰之色人有過必婉曲導之請改方已有貧困疾病濱於死者設法救濟保全人骨肉倫理者甚衆至遇時事有闕則痛哭流涕披露肝膈雖觸嫌犯危勿恤也卒至國變從容殉節以死非誠之所積而能然乎黃淳耀字藴生南直嘉定人崇禎癸未進士自少沈潛好書博學工文詞為諸生即有名每勵著書明道之志著自監録知過録後更為日厯晝之所為夜必書之成進士出周太史鳳翔之門釋褐後寄弟淵耀書曰吾廷試傳臚時見鼎甲先上人皆稱羡吾此時歎息無限天地間自有數千年一人數百年一人者今人必不肯為數千年之一人而必欲為三年之一人又曰近見他人品骨不如我意思見識不如我不免有輕蔑時俗之意坐此學力不進然在寵辱場中壁立如鐵過此以往并心一向終有一立腳處又曰天下事不可為可為者惟有已分內事勉之勉之先生見當時事勢已壞遂無仕進意䇿蹇南歸杜門不出與窮交數子砥礪益堅天性純孝家居無私財所得廩餼束修盡以歸之親丁內憂毁瘠骨立自弱冠至登第後不茍取一錢其友人有親戚以官事連染屬先生白免之其親戚以五十金為夀友人懷之以餽及覿面不敢出潛置書笥中經數日忽撿出大駭亟還之介操類若此雒閩源流録乙酉兵至遂同淵耀自縊於西城僧舍臨死神氣間暇如平時題壁有進不能宣力皇朝退不能潔身自隱讀書寡益學道無成耿耿不昧此心而已士林聞而悲之所著有劄記二卷語録二卷吾師録一卷史記雜論四卷詩文若干卷藏於家後學稱為陶庵先生同里有夏雲蛟者字啓霖居貧力學與先生同館於侯通政家講習相契一時有黃夏之稱篤行孝友精研性理以程朱自期著有豫章遊草心學直指二編乙酉秋亦以兵死崑山陶琰字圭稚為人溫醇端慤特深於性理之學雖為諸生恆厭薄時文好博觀諸儒語録訪道不逺千里乙酉兵至有友人朱集璜字以發者居圍城中拒守不下及城破赴水死時圭稚居雞鳴塘去城二十餘里躬率其徒奔救至中塗聞城已破倣徨久之乃還曰以發其死矣後之哉是夜距户自經死明儒言行録續編卷二
